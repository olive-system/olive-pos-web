<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex,nofollow">
<title>OLIVE 顧客</title><!-- customer v1.36 -->
<style>
  :root{--bg:#f6f5f2;--card:#fff;--ink:#1a1a1a;--muted:#7a7a7a;--line:#e3e1dc;--acc:#3f9d5a;--warn:#d9534f;--gold:#e0a32a;--blue:#3b82f6;--edit:#7b61c9}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;font-size:16px}
  body{padding-bottom:env(safe-area-inset-bottom)}
  button{font:inherit;cursor:pointer;border:none;border-radius:10px;padding:10px 14px;background:#eee;color:var(--ink)}
  button.primary{background:var(--blue);color:#fff}button.ok{background:var(--acc);color:#fff}button.danger{background:var(--warn);color:#fff}
  button.edit{background:var(--edit);color:#fff}
  button.ghost{background:transparent;border:1px solid var(--line)}button.sm{padding:6px 10px;font-size:14px}
  button.chip{background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:14px}button.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  button:disabled{opacity:.4}
  input,select,textarea{font:inherit;font-size:16px;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);width:100%}
  textarea{line-height:1.5;resize:vertical}
  .muted{color:var(--muted)}small{font-size:13px}
  .hide{display:none!important}

  /* ログイン */
  #vLogin{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  #vLogin .box{width:100%;max-width:360px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px}
  #vLogin h1{margin:0 0 4px;font-size:22px}#vLogin p{margin:0 0 18px}
  #vLogin button{width:100%;margin-top:12px;padding:12px}
  .err{color:var(--warn);font-size:14px;min-height:20px;margin-top:8px}

  /* 共通の上部バー */
  .top{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top));display:flex;align-items:center;gap:10px}
  .top .ttl{font-weight:700;font-size:17px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .editbar{background:var(--edit);color:#fff;font-size:14px;padding:6px 16px;display:flex;align-items:center;gap:8px}
  .editbar button{margin-left:auto;background:rgba(255,255,255,.2);color:#fff;padding:4px 10px;font-size:13px}
  .wrap{max-width:720px;margin:0 auto;padding:12px 16px 40px}

  /* 一覧 */
  .tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}
  .tools select{width:auto;padding:7px 10px;font-size:14px}
  .rows{display:flex;flex-direction:column;gap:6px}
  .row{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
  .row{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 14px}.row .nm{font-weight:700}.row .sub{font-size:13px;color:var(--muted)} /* v1.34：名前と来店日・係・キープ名を1行に（入りきらない幅の時だけ折り返す） */
  .badge{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--gold);color:#fff;white-space:nowrap;vertical-align:1px;font-weight:400}
  .badge.gray{background:#9a9a9a}.badge.k{background:var(--ink)}.badge.warnb{background:var(--warn)}

  /* 詳細 */
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
  .card h2{margin:0 0 10px;font-size:14px;color:var(--muted);display:flex;align-items:center;gap:8px}
  .card h2 button{margin-left:auto}
  .kv{display:grid;grid-template-columns:6.5em 1fr;gap:6px 10px;font-size:15px}
  .kv.info{margin:0}.kv.info dd:first-of-type{padding-right:84px}
  .kv dt{color:var(--muted);font-size:13px;padding-top:2px}.kv dd{margin:0;overflow-wrap:anywhere}
  .memo{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6;font-size:15px}
  .req{background:#fff8e6;border:1px solid #f0dca8;border-radius:10px;padding:8px 10px;margin-top:8px;font-size:14px}
  .req .who{font-size:12px;color:var(--muted)}
  .bt{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;background:#fafafa}
  .bt .nm{font-weight:700;font-size:16px}.bt .sub{font-size:12px;color:var(--muted);margin:2px 0 8px}
  .bt .ops{display:flex;gap:6px;align-items:center}
  .bt .ops select{width:auto;flex:1;padding:8px}
  .vis{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid #f0eee9;font-size:14px}
  .vis:last-child{border-bottom:none}.vis .amt{font-variant-numeric:tabular-nums;white-space:nowrap}
  .vyr{border-top:1px solid #f0eee9}.vyr>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;padding:9px 0;font-size:14px;font-weight:600}.vyr>summary::-webkit-details-marker{display:none}.vyr>summary::after{content:'▾';color:var(--muted)}.vyr[open]>summary::after{content:'▴'}.vyr>div{padding-left:12px}
  label.f{display:block;margin-bottom:10px;font-size:13px;color:var(--muted)}label.f input,label.f select,label.f textarea{margin-top:4px;color:var(--ink)}

  /* ダイアログ・トースト */
  .modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.4);display:none;align-items:flex-end;justify-content:center}
  .modal.on{display:flex}
  .sheet{background:#fff;width:100%;max-width:560px;border-radius:16px 16px 0 0;padding:18px 16px calc(16px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
  @media (min-width:600px){.modal{align-items:center}.sheet{border-radius:16px}}
  .sheet h3{margin:0 0 12px;font-size:17px}.sheet .msg{white-space:pre-wrap;margin-bottom:14px;line-height:1.5}
  .sheet .btns{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}.sheet .btns button{min-width:88px}
  #toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#1a1a1a;color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;z-index:60;display:none;max-width:90vw;text-align:center}
  #toast.on{display:block}
  .loading{padding:30px 0;text-align:center;color:var(--muted)}
/* v1.9：ボトル欄の枠の高さをそろえる */
.bt .ops select,.bt .ops button{height:36px;box-sizing:border-box;padding-top:0;padding-bottom:0}
/* v1.10：ボトル欄を POS の顧客画面と同じ2段に（銘柄・日付・残量／キープ名・飲切・期限切・ボトル移動）。枠の高さは36pxでそろえる */
.bt .b1{display:flex;align-items:center;gap:8px;margin-bottom:6px}.bt .b1 .nm{flex:1 1 0;min-width:0;overflow-wrap:anywhere;line-height:1.35}.bt .b1 .nm small{font-size:12px;font-weight:400;margin-left:6px;white-space:nowrap;color:var(--muted)}
.bt .b2{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:13px}.bt .b2 .kn{flex:1 1 90px;min-width:0;display:flex;align-items:center;gap:4px}.bt .b2 .kn span{white-space:nowrap;font-size:11px}/* v1.12：キープ名の文字を小さく・ボタンは「移動」 */.bt .b2 .kn input{flex:1 1 0;min-width:0;width:0}.bt .b3{display:flex;gap:6px;flex:none;margin-left:auto}.bt .b3 button{white-space:nowrap}
.bt .b1 select{flex:none;width:auto;padding-left:8px;padding-right:4px}
.bt .b1 select,.bt .b2 input,.bt .b3 button{height:36px;box-sizing:border-box;padding-top:0;padding-bottom:0}.bt .b2 input{padding-left:8px;padding-right:8px;font-size:15px}
/* v1.11：期限切れ・ボトル移動の行は1行に収まるまで文字を小さくする（fitLine） */
/* v1.14：v1.13 の枠・［戻す］をやめ、期限切れ・移動は飲み切り済みと同じ小さな文字で1本1行（［戻す］なし） */
.vis .fit1{flex:1 1 0;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#btSel,#btRem,#btAdd{height:40px;box-sizing:border-box;padding-top:0;padding-bottom:0}
  /* 15番：入力欄の高さは全部 44px */
  input:not([type=checkbox]):not([type=radio]):not([type=file]):not([type=range]):not([type=color]),select{height:44px!important;min-height:44px;box-sizing:border-box;padding-top:0!important;padding-bottom:0!important}
  .bt .ops button,.bt .b3 button,#btAdd{height:44px!important;box-sizing:border-box;padding-top:0;padding-bottom:0} /* 入力欄の横のボタンも 44px */
</style>
</head>
<body>

<!-- ログイン -->
<div id="vLogin" class="hide">
  <div class="box">
    <h1>OLIVE 顧客</h1>
    <p class="muted">パスワードを入力してください</p>
    <form id="loginForm" autocomplete="off">
      <input id="pw" type="password" autocomplete="current-password" placeholder="パスワード">
      <button class="primary" type="submit" id="loginBtn">ログイン</button>
      <div class="err" id="loginErr"></div>
    </form>
  </div>
</div>

<!-- 一覧 -->
<div id="vList" class="hide">
  <div class="top"><span class="ttl" id="storeName">顧客</span><button class="ghost sm" id="menuBtn">メニュー</button></div>
  <div class="editbar hide" id="editBar1"><span>編集モード</span><span class="editLeft"></span><button class="editEnd">終了</button></div>
  <div class="wrap">
    <input id="q" type="search" placeholder="お名前・会社名・領収書名・キープ名で検索" autocomplete="off">
    <div class="tools">
      <select id="months" aria-label="期間"></select>
      <button class="ok sm" id="newBtn" style="margin-left:auto">＋新規</button>
    </div>
    <div class="muted" id="count" style="font-size:13px;margin-bottom:6px"></div>
    <div class="rows" id="rows"><div class="loading">読み込み中…</div></div>
  </div>
</div>

<!-- 詳細 -->
<div id="vDetail" class="hide">
  <div class="top"><button class="ghost sm" id="backBtn">‹ 一覧</button><span class="ttl" id="dName"></span></div>
  <div class="editbar hide" id="editBar2"><span>編集モード</span><span class="editLeft"></span><button class="editEnd">終了</button></div>
  <div class="wrap" id="detail"></div>
</div>

<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0"></script>
<script>
// v1.33・SQL 080：店ごとの「係」の名称（stores.kakari_label。空なら「係」）。画面の「係」は KL を差し込む。見出しの一覧は kReg に入れておき、kSet で付け直す。操作ログに残す操作の名前は「係」のまま（表示の時に kl で読み替える）
let KL='係'; const kl=s=>KL==='係'?s:String(s??'').replace(/係/g,KL); const KT=[];
function kReg(...os){ const walk=o=>{ for(const k of Object.keys(o)){ const v=o[k]; if(typeof v==='string'){ if(v.includes('係')) KT.push([o,k,v]); } else if(v&&typeof v==='object') walk(v); } }; os.forEach(walk); }
function kSet(v){ KL=(v&&String(v).trim())||'係'; KT.forEach(([o,k,v])=>{ o[k]=kl(v); }); }
'use strict';
const SUPABASE_URL='https://gjqaxenwvvazhjtziusf.supabase.co', SUPABASE_KEY='sb_publishable_pPfJUvJd6iJeHBNiD7XkWA_2RKF7JYw';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const yen=n=>Number(n||0).toLocaleString('ja-JP')+'円'; /* v1.16：金額は POS と同じ「78,000円」 */
/* v1.32・SQL 076：管理サイトの「顧客サイト」の中で開いた時（#admin）は、パスワードを聞かずに管理サイトから入場券をもらう。この端末の顧客サイトのログインには触らない（覚えるのはこの画面の中だけ） */
const EMB=window.parent!==window&&location.hash==='#admin', MEM={};
const LS0={ get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }, set(k,v){ try{ v==null?localStorage.removeItem(k):localStorage.setItem(k,v); }catch(e){} } };
const SS0={ get(k){ try{ return sessionStorage.getItem(k); }catch(e){ return null; } }, set(k,v){ try{ v==null?sessionStorage.removeItem(k):sessionStorage.setItem(k,v); }catch(e){} } };

const MEMS={ get(k){ return MEM[k]??null; }, set(k,v){ if(v==null) delete MEM[k]; else MEM[k]=String(v); } }, LS=EMB?MEMS:LS0, SS=EMB?MEMS:SS0;
let embWait=null, embEdit=null, embEditExp=0; // 管理サイトに入場券をたのむ（返事が来るまで待つ）
function embAsk(){ if(!embWait) embWait=new Promise(res=>{ const on=e=>{ if(e.origin!==location.origin||e.source!==window.parent||!e.data||e.data.type!=='olive-cs-auth') return;
    window.removeEventListener('message',on); embWait=null; const d=e.data; token=d.token||null; embEdit=d.edit_token||null; embEditExp=d.edit_expires_at?new Date(d.edit_expires_at).getTime():0; editTok=embEdit; editExp=embEditExp; /* v1.36：管理サイトの中では、編集の入場券があれば最初から編集できる */ try{ paintEdit(); }catch(e){} res(d); };
  window.addEventListener('message',on); window.parent.postMessage({type:'olive-cs-need'},location.origin); }); return embWait; }
let token=LS.get('olive_cs_token'), editTok=SS.get('olive_cs_edit'), editExp=Number(SS.get('olive_cs_edit_exp')||0);
let boot=null, custs=[], mode='all', monthsSel=null, curId=null, cur=null;

// ---------- 通信 ----------
class CsError extends Error{ constructor(code,msg){ super(msg||code); this.code=code; } }
async function rpc(fn,args){
  let r; try{ r=await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`,{method:'POST',headers:{'Content-Type':'application/json',apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY},body:JSON.stringify(args||{})}); }
  catch(e){ throw new CsError('NET','通信できませんでした。電波の良い所でもう一度お試しください'); }
  const t=await r.text(); let d=null; try{ d=t?JSON.parse(t):null; }catch(e){}
  if(!r.ok){ const m=String(d&&d.message||t||''); const c=(m.match(/^(CS_[A-Z]+)/)||[])[1];
    if(c==='CS_AUTH'){ logoutLocal(); throw new CsError(c,'もう一度パスワードを入力してください'); }
    if(c==='CS_EDIT'){ endEdit(true); throw new CsError(c,'編集パスワードの有効時間が切れました。もう一度入力してください'); }
    if(c==='CS_INPUT') throw new CsError(c,m.replace(/^CS_INPUT:/,''));
    if(c==='CS_CONFLICT') throw new CsError(c,'ほかの人が先にこのお客様を変更しました。最新の内容を読み込み直します');
    if(c==='CS_NOTFOUND') throw new CsError(c,'見つかりません（削除された可能性があります）');
    if(c==='CS_LOCKED') throw new CsError(c,'パスワードの間違いが続いたため、15分間止めています');
    if(c==='CS_NOEDITPW') throw new CsError(c,'編集パスワードがまだ設定されていません');
    if(/Could not find the function|does not exist/.test(m)) throw new CsError('SQL','準備中です（SQL 043 が未適用）');
    throw new CsError('ERR',m||('エラー '+r.status)); }
  return d; }

// ---------- ダイアログ（ブラウザ標準は使わない） ----------
function sheet(html,onOpen){ return new Promise(res=>{ const m=$('modal'), s=$('sheet'); s.innerHTML=html; m.classList.add('on'); const done=v=>{ m.classList.remove('on'); s.innerHTML=''; res(v); }; onOpen(s,done); }); }
function uiConfirm(msg,ok='OK',cls='primary'){ return sheet(`<div class="msg">${esc(msg)}</div><div class="btns"><button class="ghost" data-x>キャンセル</button><button class="${cls}" data-ok>${esc(ok)}</button></div>`,(s,done)=>{ s.querySelector('[data-x]').onclick=()=>done(false); s.querySelector('[data-ok]').onclick=()=>done(true); }); }
function uiAlert(msg){ return sheet(`<div class="msg">${esc(msg)}</div><div class="btns"><button class="primary" data-ok>OK</button></div>`,(s,done)=>{ s.querySelector('[data-ok]').onclick=()=>done(true); }); }
function uiPrompt(title,val='',opt={}){ return sheet(`<h3>${esc(title)}</h3><input id="pIn" ${opt.pw?'type="password" autocomplete="off"':''} value="${esc(val)}" placeholder="${esc(opt.ph||'')}"><div class="err" id="pErr"></div><div class="btns"><button class="ghost" data-x>キャンセル</button><button class="primary" data-ok>${esc(opt.ok||'OK')}</button></div>`,(s,done)=>{ const i=s.querySelector('#pIn'); setTimeout(()=>i.focus(),50); const go=()=>done(i.value); s.querySelector('[data-x]').onclick=()=>done(null); s.querySelector('[data-ok]').onclick=go; i.onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); go(); } }; }); }
let toastT=0; function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('on'),2200); }
async function fail(e){ if(e&&e.code==='CS_AUTH'){ showLogin(e.message); return; } await uiAlert(e&&e.message||String(e)); }

// ---------- 画面切り替え ----------
function show(v){ ['vLogin','vList','vDetail'].forEach(x=>$(x).classList.toggle('hide',x!==v)); window.scrollTo(0,0); }
let embTry=0;
function showLogin(msg){ if(EMB){ if(++embTry>3){ show('vLogin'); $('loginErr').textContent='顧客サイトを開けません。管理サイトを読み込み直してください'; return; } embAsk().then(d=>{ if(d&&d.token) start(); else { show('vLogin'); $('loginErr').textContent=d&&d.error||'顧客サイトを開けません'; } }); return; } show('vLogin'); $('loginErr').textContent=msg||''; $('pw').value=''; }
function logoutLocal(){ token=null; LS.set('olive_cs_token',null); endEdit(true); boot=null; custs=[]; }

// ---------- ログイン ----------
$('loginForm').onsubmit=async e=>{ e.preventDefault(); const pw=$('pw').value; if(!pw){ $('loginErr').textContent='パスワードを入力してください'; return; }
  $('loginBtn').disabled=true; $('loginErr').textContent='';
  try{ const r=await rpc('cs_login',{p_pw:pw}); if(r&&r.error){ $('loginErr').textContent='パスワードが違います'; return; }
    token=r.token; LS.set('olive_cs_token',token); $('pw').value=''; await start(); }
  catch(err){ $('loginErr').textContent=err.message; }
  finally{ $('loginBtn').disabled=false; } };

async function start(){ if(!token){ showLogin(); return; }
  try{ boot=await rpc('cs_boot',{p_token:token}); }catch(e){ if(e.code==='CS_AUTH'){ showLogin(); return; } showLogin(e.message); return; }
  kSet(boot&&boot.store&&boot.store.kakari_label);
  $('storeName').textContent=(boot.store&&boot.store.name||'')+'　顧客'; document.title=(boot.store&&boot.store.name||'OLIVE')+' 顧客';
  if(!monthsSel) monthsSel=boot.bottle_keep_months||6;
  show('vList'); paintEdit(); await loadList(); rtSub(); }
/* v1.29・SQL 067：リアルタイム。店の設定・伝票がほかで変わったら、すぐ読み直す（入力中・確認の画面の間は読み直さない。つながらない時は1分ごとのまま） */
let rtCh=null, rtT=0;
function rtSub(){ const sid=boot&&boot.store&&boot.store.id; if(rtCh||!sid||!window.supabase) return;
  try{ const c=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:false,autoRefreshToken:false,storageKey:'olive-cs-rt'}});
    rtCh=c.channel('olive:'+sid).on('broadcast',{event:'chg'},m=>{ const k=(m.payload||{}).kind; clearTimeout(rtT); rtT=setTimeout(()=>rtRefresh(k),k==='settings'?1500:2500); }).subscribe(); }catch(e){ console.warn('realtime',e); } }
async function rtRefresh(k){ if(k==='settings'){ try{ const b=await rpc('cs_boot',{p_token:token}); if(b){ boot=b; kSet(boot.store&&boot.store.kakari_label); $('storeName').textContent=(boot.store&&boot.store.name||'')+'　顧客'; document.title=(boot.store&&boot.store.name||'OLIVE')+' 顧客'; } }catch(e){} } csRefresh(true); }

// ---------- 編集モード ----------
function editing(){ return !!editTok&&editExp>Date.now(); }
function endEdit(silent){ editTok=null; editExp=0; SS.set('olive_cs_edit',null); SS.set('olive_cs_edit_exp',null); paintEdit(); if(!silent&&cur) renderDetail(); }
let editTimer=0;
function paintEdit(){ const on=editing(); ['editBar1','editBar2'].forEach(id=>$(id).classList.toggle('hide',!on||EMB));
  if(EMB){ clearTimeout(editTimer); if(embEdit) editTimer=setTimeout(async()=>{ if(embEditExp<Date.now()+120000){ try{ await embAsk(); }catch(e){} } paintEdit(); },30000); return; } // 管理サイトの中：帯は出さず、期限が近づいたら入場券を取り直す
  const left=on?Math.max(0,Math.ceil((editExp-Date.now())/60000)):0; document.querySelectorAll('.editLeft').forEach(x=>x.textContent=on?`（あと${left}分）`:'');
  clearTimeout(editTimer); if(on) editTimer=setTimeout(()=>{ if(!editing()){ endEdit(); toast('編集モードを終了しました'); } else paintEdit(); },30000); }
document.querySelectorAll('.editEnd').forEach(b=>b.onclick=()=>{ endEdit(); toast('編集モードを終了しました'); });

// ---------- 日付 ----------
function bd(){ return boot&&boot.business_date||new Date().toISOString().slice(0,10); }
// 来店履歴は今年の分はそのまま出し、去年より前は年ごとにまとめる（タップで開く）。POSと同じ
function visYears(list,dt,row){ const cy=bd().slice(0,4), g={}; const head=list.filter(v=>String(dt(v)).slice(0,4)===cy).map(row).join(''); for(const v of list){ const y=String(dt(v)).slice(0,4); if(y===cy) continue; (g[y]=g[y]||[]).push(v); } return head+Object.keys(g).sort().reverse().map(y=>`<details class="vyr"><summary>${y}年　${g[y].length}回</summary>${g[y].map(row).join('')}</details>`).join(''); }
// 一覧のボトル：キープ中の銘柄を3本まで、4本以上は「ほか○本」。銘柄が届かない時は本数だけ。POSと同じ
function bnLine(names,n){ names=names||[]; if(!names.length) return n?`ボトル${n}本`:''; return names.slice(0,3).join('、')+(names.length>3?` ほか${names.length-3}本`:''); }
function md(d){ const m=String(d||'').match(/^(\d{4})-(\d{2})-(\d{2})/); return m?`${m[1]===bd().slice(0,4)?'':m[1]+'/'}${+m[2]}/${+m[3]}`:''; }
function cutoff(n){ const [y,m,d]=bd().split('-').map(Number); const x=new Date(y,m-1-n,d); return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`; }
function base(c){ return c.last||c.first_bottle||String(c.created_at||'').slice(0,10)||''; }
const staffBy=id=>(boot&&boot.staff||[]).find(s=>s.id===id);
const sname=id=>{ const s=staffBy(id); return s?s.name+(s.active?'':'（退店）'):''; };

  try{ custs=await rpc('cs_list',{p_token:token})||[]; custs.sort((a,b)=>jaCmp(a.name,b.name)||String(a.id).localeCompare(String(b.id))); /* v1.25：POS と同じ並び */ renderList(); }catch(e){ $('rows').innerHTML=''; await fail(e); } }
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{ mode=b.dataset.mode; renderList(); });
$('q').oninput=()=>renderList();
function renderList(){ const q=$('q').value.trim();
  document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('on',b.dataset.mode===mode));
  const ms=$('months'); const opts=[...new Set([1,2,3,6,12,monthsSel])].sort((a,b)=>a-b); ms.innerHTML=`<option value="" ${mode==='old'?'':'selected'}>全員</option>`+opts.map(n=>`<option value="${n}" ${mode==='old'&&n===monthsSel?'selected':''}>${n%12?n+"か月":n/12+"年"}以上ご来店なし</option>`).join(''); ms.onchange=()=>{ if(!ms.value){ mode='all'; renderList(); return; } monthsSel=Number(ms.value); mode='old'; renderList(); };
  const cut=cutoff(monthsSel);
  let list=custs.filter(c=>!q||[c.name,c.company,c.receipt_name,...(c.keep_names||[])].some(v=>v&&String(v).includes(q)));
  if(mode==='old') list=list.filter(c=>base(c)&&base(c)<=cut).sort((a,b)=>base(a).localeCompare(base(b)));
  $('count').textContent=`${list.length}名`+(mode==='old'?`（${md(cut)} 以前）`:'');
  const show=list.slice(0,300);
  $('rows').innerHTML=show.map(c=>`<button class="row" data-id="${c.id}"><div class="nm">${esc(c.name)}${c.company?` <small class="muted" style="font-weight:400">${esc(c.company)}</small>`:''}${c.is_industry?' <span class="badge k">同業</span>':''}${c.req?` <span class="badge warnb">申請 ${c.req}件</span>`:''}</div><div class="sub" style="${mode==='old'?'color:#c0392b':''}">${[c.last?md(c.last):'来店なし',c.kakari_staff_id?esc(sname(c.kakari_staff_id)):'',esc(bnLine(c.bottle_names,c.bottles))].filter(Boolean).join('・')}</div></button>`).join('')+(list.length>show.length?`<div class="muted" style="font-size:13px;padding:8px 0">ほか ${list.length-show.length}名（検索で絞り込んでください）</div>`:'')||'<div class="muted" style="padding:20px 0">該当なし</div>';

// 基本情報・メモの編集（編集パスワードが必要）
const EF=[['name','お名前'],['birthday','お誕生日'],['company','会社名'],['receipt_name','領収書名'],['kakari_staff_id',''+KL+''],['company_address','会社住所']];
function editForm(memoOnly,draft){ const c=cur.customer, dv=k=>draft&&(k in draft)?draft[k]:c[k]; const casts=(boot.staff||[]).filter(s=>s.kind==='cast'&&s.active); const curK=c.kakari_staff_id&&!casts.some(s=>s.id===c.kakari_staff_id)?staffBy(c.kakari_staff_id):null;
  const fields=memoOnly?'':EF.map(([k,l])=>k==='kakari_staff_id'?`<label class="f">${l}<select data-k="${k}"><option value="">なし</option>${curK?`<option value="${curK.id}" selected>${esc(curK.name)}（退店）</option>`:''}${casts.map(s=>`<option value="${s.id}" ${dv(k)===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select></label>`
    :`<label class="f">${l}<input data-k="${k}" value="${esc(dv(k)||'')}" ${k==='birthday'?'placeholder="例 11/24" inputmode="numeric"':''}></label>`).join('')+`<label class="f" style="display:flex;align-items:center;gap:8px;color:var(--ink);font-size:15px"><input type="checkbox" data-k="is_industry" ${dv('is_industry')?'checked':''} style="width:auto;margin:0">同業（会社名に店名を入れる）</label>`;
  return sheet(`<h3>${esc(c.name)} 様　${memoOnly?'メモを編集':'お客様の情報を編集'}</h3>${fields}${memoOnly?`<label class="f">メモ<textarea data-k="memo" rows="12">${esc(dv('memo')||'')}</textarea></label>`:''}<div class="btns"><button class="ghost" data-x>キャンセル</button><button class="edit" data-ok>保存</button></div>`,(s,done)=>{
    s.querySelector('[data-x]').onclick=()=>done(false);
    s.querySelector('[data-ok]').onclick=async e=>{ const patch={}, before={}, dr={}; s.querySelectorAll('[data-k]').forEach(i=>{ dr[i.dataset.k]=i.type==='checkbox'?i.checked:(i.value||null); });
      s.querySelectorAll('[data-k]').forEach(i=>{ const k=i.dataset.k; let v=i.type==='checkbox'?i.checked:(k==='memo'?i.value.replace(/\s+$/,''):i.value.trim()); if(v==='') v=null; if(k==='is_industry'){ if(v!==!!c.is_industry){ patch[k]=v; before[k]=!!c.is_industry; } return; } if(v!==(c[k]||null)){ patch[k]=v; before[k]=c[k]??null; } });
      if('name' in patch&&!patch.name){ toast('お名前は必須です'); return; }
      if(patch.birthday){ const m=patch.birthday.replace(/[０-９／]/g,ch=>String.fromCharCode(ch.charCodeAt(0)-0xFEE0)).match(/^(\d{1,2})[\/月.\-](\d{1,2})日?$/); const dim=[31,29,31,30,31,30,31,31,30,31,30,31]; if(!m||+m[1]<1||+m[1]>12||+m[2]<1||+m[2]>dim[+m[1]-1]){ toast('お誕生日は 11/24 のように入力してください'); return; } patch.birthday=`${+m[1]}/${+m[2]}`; if(patch.birthday===(c.birthday||null)){ delete patch.birthday; delete before.birthday; } }
      const ind='is_industry' in patch?patch.is_industry:!!c.is_industry; const co='company' in patch?patch.company:c.company; if(ind&&!co){ toast('同業の時は店名を会社名に入力してください'); return; }
      if(!Object.keys(patch).length){ done(false); toast('変更はありません'); return; }
      if(!editing()){ done(false); if(!await needEdit()) return; return editForm(memoOnly,dr); } /* v1.30：パスワードを入れ直しても、書いた内容は残す */
      e.target.disabled=true; try{ await rpc('cs_customer_edit',{p_token:token,p_edit_token:editTok,p_id:c.id,p_patch:patch,p_before:before}); done(true); toast('保存しました'); await reloadDetail(); const li=custs.find(x=>x.id===c.id); if(li&&cur){ Object.assign(li,{name:cur.customer.name,company:cur.customer.company,receipt_name:cur.customer.receipt_name,kakari_staff_id:cur.customer.kakari_staff_id,is_industry:cur.customer.is_industry}); } }
      catch(err){ e.target.disabled=false; if(err.code==='CS_CONFLICT'){ done(false); await reloadDetail(); return csClash(memoOnly,c,patch,before,dr); } if(err.code==='CS_EDIT'){ done(false); await uiAlert(err.message); if(!await needEdit()) return; return editForm(memoOnly,dr); } await fail(err); } }; }); }
/* v1.30：ほかの人が先に変えていた時。メモは行ごとに自動で合わせて保存する（同じ行を両方が直した時だけ、どちらを残すか聞く）。メモ以外は最新にして、書いた内容と一緒に見せ直す */
async function csClash(memoOnly,c0,patch,before,dr){ const c=cur&&cur.customer; if(!c||c.id!==c0.id){ await uiAlert('ほかの人が先にこのお客様を変更しました'); return; }
  const same=(x,y)=>JSON.stringify(x??null)===JSON.stringify(y??null);
  const clash=Object.keys(patch).filter(k=>!same(k==='is_industry'?!!c[k]:c[k],before[k]));
  if(clash.includes('memo')){ const r=memoMerge(before.memo,patch.memo,c.memo), ch=[];
    for(const x of r.conflicts){ const v=await pickClash(x); if(v==null){ return editForm(true,{memo:patch.memo}); } ch.push(v); }
    const memo=memoMergeDone(r,ch).replace(/\s+$/,'')||null;
    if(same(memo,c.memo)){ toast('ほかの人の変更と同じだったので、そのままにしました'); return; }
    try{ await rpc('cs_customer_edit',{p_token:token,p_edit_token:editTok,p_id:c.id,p_patch:{memo},p_before:{memo:c.memo??null}}); toast('ほかの人の変更と合わせて保存しました'); await reloadDetail(); }
    catch(err){ if(err.code==='CS_CONFLICT'){ await reloadDetail(); return csClash(true,c0,{memo},{memo:c.memo??null},{memo}); } if(err.code==='CS_EDIT'){ await uiAlert(err.message); if(!await needEdit()) return; return editForm(true,{memo}); } await fail(err); }
    return; }
  const lb=Object.fromEntries(EF.concat([['is_industry','同業']])); const d={...dr}; clash.forEach(k=>{ d[k]=c[k]; });
  await uiAlert(`ほかの人が先に「${clash.map(k=>lb[k]||k).join('・')}」を変えていました。そこは最新にして、ほかの欄は書いた内容を残したので、確かめて保存してください`);
  return editForm(memoOnly,d); }
function pickClash(x){ return sheet(`<h3>同じ所をほかの人も直していました</h3><div class="muted" style="font-size:13px">どちらを残しますか？</div>
  <div class="f" style="margin-top:8px">あなた<div class="memo" style="border:1px solid var(--line);border-radius:10px;padding:8px 10px">${esc(x.mine.join('\n'))||'<span class="muted">（消した）</span>'}</div></div>
  <div class="f">ほかの人<div class="memo" style="border:1px solid var(--line);border-radius:10px;padding:8px 10px">${esc(x.theirs.join('\n'))||'<span class="muted">（消した）</span>'}</div></div>
  <div class="btns"><button class="ghost" data-v="x">やめる</button><button class="ghost" data-v="b">両方残す</button><button class="ghost" data-v="t">ほかの人</button><button class="edit" data-v="m">あなた</button></div>`,(s,done)=>{ s.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>done(b.dataset.v==='x'?null:b.dataset.v)); }); }
/* メモを行ごとに合わせる（3者マージ）。base＝書き始めた時のメモ、mine＝自分の入力、theirs＝ほかで変わった今のメモ。同じ所を両方が別々に直した時だけ conflicts に入る */
function memoMerge(base,mine,theirs){ const L=s=>s?String(s).replace(/\r/g,'').split('\n'):[]; const b=L(base), m=L(mine), t=L(theirs), J=a=>a.join('\n');
  if(J(m)===J(t)||J(t)===J(b)) return {lines:m,conflicts:[]}; if(J(m)===J(b)) return {lines:t,conflicts:[]};
  const hunks=(a,o)=>{ const n=a.length, k=o.length, d=Array.from({length:n+1},()=>new Int32Array(k+1)); for(let i=n-1;i>=0;i--) for(let j=k-1;j>=0;j--) d[i][j]=a[i]===o[j]?d[i+1][j+1]+1:Math.max(d[i+1][j],d[i][j+1]);
    const h=[]; let i=0,j=0,cur=null; const flush=()=>{ if(cur){ h.push(cur); cur=null; } };
    while(i<n||j<k){ if(i<n&&j<k&&a[i]===o[j]){ flush(); i++; j++; } else if(j<k&&(i>=n||d[i][j+1]>=d[i+1][j])){ cur=cur||{s:i,e:i,lines:[]}; cur.lines.push(o[j]); j++; } else { cur=cur||{s:i,e:i,lines:[]}; cur.e=i+1; i++; } }
    flush(); return h; };
  const all=[...hunks(b,m).map(x=>({...x,w:'m'})),...hunks(b,t).map(x=>({...x,w:'t'}))].sort((x,y)=>x.s-y.s||x.e-y.e);
  const hit=(x,y)=>(x.s===x.e&&y.s===y.e)?x.s===y.s:(x.s===x.e?(x.s>y.s&&x.s<y.e):y.s===y.e?(y.s>x.s&&y.s<x.e):Math.max(x.s,y.s)<Math.min(x.e,y.e));
  const groups=[]; for(const x of all){ const g=groups[groups.length-1]; if(g&&g.some(y=>y.w!==x.w&&hit(x,y))){ g.push(x); g.S=Math.min(g.S,x.s); g.E=Math.max(g.E,x.e); } else { const ng=[x]; ng.S=x.s; ng.E=x.e; groups.push(ng); } }
  const side=(g,w)=>{ const out=[]; let p=g.S; for(const x of g.filter(y=>y.w===w)){ out.push(...b.slice(p,x.s),...x.lines); p=x.e; } out.push(...b.slice(p,g.E)); return out; };
  const out=[], conflicts=[]; let p=0;
  for(const g of groups){ out.push(...b.slice(p,g.S)); const ws=new Set(g.map(x=>x.w));
    if(ws.size===1){ out.push(...side(g,g[0].w)); }
    else { const vm=side(g,'m'), vt=side(g,'t');
      if(J(vm)===J(vt)) out.push(...vm);
      else if(g.S===g.E) out.push(...vt,...vm); // 同じ所に両方が書き足した時は、両方残す（先に入っていた方が上）
      else { conflicts.push({at:out.length,mine:vm,theirs:vt}); } }
    p=Math.max(p,g.E); }
  out.push(...b.slice(p)); return {lines:out,conflicts}; }
/* conflicts の choice（'m'／'t'／'b'）で仕上げる */
function memoMergeDone(r,choices){ const out=[...r.lines]; for(let i=r.conflicts.length-1;i>=0;i--){ const c=r.conflicts[i], ch=choices[i]; out.splice(c.at,0,...(ch==='m'?c.mine:ch==='t'?c.theirs:[...c.theirs,...c.mine])); } return out.join('\n'); }


// 戻るボタン（スマホの戻る操作）で一覧へ
const _open=openDetail; openDetail=async id=>{ try{ history.pushState({d:1},''); }catch(e){} return _open(id); };
$('backBtn').onclick=()=>{ if(history.state&&history.state.d){ history.back(); return; } curId=null; cur=null; show('vList'); renderList(); loadList(); };
window.addEventListener('popstate',()=>{ curId=null; cur=null; show('vList'); renderList(); loadList(); });
/* v1.25：ほかの端末（POS など）での変更を出す。画面に戻った時と、詳細を開いている間は1分ごとに読み直す。入力中・確認の画面が出ている間は読み直さない。失敗しても知らせない */
async function csRefresh(listToo){ if(!token||document.visibilityState!=='visible'||$('modal').classList.contains('on')) return; const a=document.activeElement; if(a&&/INPUT|SELECT|TEXTAREA/.test(a.tagName)&&a.id!=='q') return;
  try{ if(!$('vDetail').classList.contains('hide')&&curId){ const id=curId; const d=await rpc('cs_detail',{p_token:token,p_id:id}); if(curId!==id||$('modal').classList.contains('on')) return; if(JSON.stringify(d)!==JSON.stringify(cur)){ cur=d; renderDetail(); } }
    else if(listToo&&!$('vList').classList.contains('hide')){ const l=await rpc('cs_list',{p_token:token})||[]; if($('vList').classList.contains('hide')) return; l.sort((a,b)=>jaCmp(a.name,b.name)||String(a.id).localeCompare(String(b.id))); if(JSON.stringify(l)!==JSON.stringify(custs)){ custs=l; renderList(); } } }catch(e){ if(e&&e.code==='CS_AUTH'){ logoutLocal(); showLogin('パスワードが変わったので、ログアウトしました'); } } }
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'){ paintEdit(); csRefresh(true); } });
setInterval(()=>csRefresh(true),60000); /* v1.27：一覧の画面でも1分ごとに読み直す（パスワードが変わったらログアウト） */

kReg(EF);
if(EMB){ token=null; editTok=null; editExp=0; embAsk().then(d=>{ if(d&&d.token) start(); else { show('vLogin'); $('loginErr').textContent=d&&d.error||'顧客サイトを開けません'; } }); } else start();
