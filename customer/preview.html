<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<script src="../lib/olive/err.js"></script><!-- 画面のエラーを送る（一番初めに読む） -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex,nofollow">
<title>OLIVE 顧客</title><!-- customer v1.70 -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet"><style>button,input,select,textarea{font-family:inherit}</style><!-- 書体：Zen Kaku Gothic New（オーナー 2026-10-18） -->
<style>
  :root{--bg:#f6f5f0;--card:#fff;--ink:#1a1a1a;--muted:#7a7a7a;--line:#e3e1dc;--soft:#f1f0e8;--head:#4b5320;--head2:#6b7436;--brand:#c9b37a;--brand-d:#a08a4f;--pri:#4b5320;--ok:#b8973e;--warn:#c0392b;--warn-soft:#fbe9e7;--gold-soft:#f8f0d8;--acc:var(--ok);--gold:var(--ok);--blue:var(--pri);--edit:var(--pri)}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Zen Kaku Gothic New",-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;font-size:16px}
  body{padding-bottom:env(safe-area-inset-bottom)}
  button{font:inherit;cursor:pointer;border:none;border-radius:10px;padding:10px 14px;background:var(--soft);color:var(--ink)}
  button.primary{background:var(--blue);color:#fff}button.ok{background:var(--acc);color:#fff}button.danger{background:var(--warn);color:#fff}
  button.edit{background:var(--edit);color:#fff}
  button.ghost{background:transparent;border:1px solid var(--line)}button.sm{padding:6px 10px;font-size:14px}
  button.chip{background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:14px}button.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  button:disabled{opacity:.4}
  input,select,textarea{font:inherit;font-size:16px;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);width:100%}
  textarea{line-height:1.5;resize:vertical}
  .muted{color:var(--muted)}small{font-size:13px}
  .hide{display:none!important}

  /* ログイン */
  #vLogin{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  #vLogin .box{width:100%;max-width:360px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px}
  #vLogin h1{margin:0 0 4px;font-size:22px}#vLogin p{margin:0 0 18px}
  #vLogin button{width:100%;margin-top:12px;padding:12px}
  .err{color:var(--warn);font-size:14px;min-height:20px;margin-top:8px}

  /* 共通の上部バー */
  .top{position:sticky;top:0;z-index:5;background:var(--head);color:#fff;border-bottom:1px solid var(--head);padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top));display:flex;align-items:center;gap:10px}
  .top button.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.4)} /* v1.38：ヘッダーは3つのサイトで同じ色（色の決まり） */
  .top .ttl{font-weight:700;font-size:17px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .wrap{max-width:720px;margin:0 auto;padding:12px 16px 40px}

  /* 一覧 */
  .tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}
  .tools select{width:auto;padding:7px 10px;font-size:14px}
  .rows{display:flex;flex-direction:column;gap:6px}
  .row{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
  .row{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 14px}.row .nm{font-weight:700}.row .sub{font-size:13px;color:var(--muted)} /* v1.34：名前と来店日・係・キープ名を1行に（入りきらない幅の時だけ折り返す） */
  .badge{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--gold);color:#fff;white-space:nowrap;vertical-align:1px;font-weight:400}
  .badge.gray{background:var(--muted)}.badge.k{background:var(--ink)}.badge.warnb{background:var(--warn)}

  /* 詳細 */
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
  .card h2{margin:0 0 10px;font-size:14px;color:var(--muted);display:flex;align-items:center;gap:8px}
  .card h2 button{margin-left:auto}
  .kv{display:grid;grid-template-columns:6.5em 1fr;gap:6px 10px;font-size:15px}
  .kv.info{margin:0}.kv.info dd:first-of-type{padding-right:84px}
  .kv dt{color:var(--muted);font-size:13px;padding-top:2px}.kv dd{margin:0;overflow-wrap:anywhere}
  .memo{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6;font-size:15px}
  .req{background:var(--gold-soft);border:1px solid var(--brand);border-radius:10px;padding:8px 10px;margin-top:8px;font-size:14px}
  .req .who{font-size:12px;color:var(--muted)}
  .bt{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;background:var(--soft)}
  .bt .nm{font-weight:700;font-size:16px}.bt .sub{font-size:12px;color:var(--muted);margin:2px 0 8px}
  .bt .ops{display:flex;gap:6px;align-items:center}
  .bt .ops select{width:auto;flex:1;padding:8px}
  .vis{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
  .vis:last-child{border-bottom:none}.vis .amt{font-variant-numeric:tabular-nums;white-space:nowrap}
  .vyr{border-top:1px solid var(--line)}.vyr>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;padding:9px 0;font-size:14px;font-weight:600}.vyr>summary::-webkit-details-marker{display:none}.vyr>summary::after{content:'▾';color:var(--muted)}.vyr[open]>summary::after{content:'▴'}.vyr>div{padding-left:12px}
  label.f{display:block;margin-bottom:10px;font-size:13px;color:var(--muted)}label.f input,label.f select,label.f textarea{margin-top:4px;color:var(--ink)}

  /* ダイアログ・トースト */
  .modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.4);display:none;align-items:flex-end;justify-content:center}
  .modal.on{display:flex}
  .sheet{background:#fff;width:100%;max-width:560px;border-radius:16px 16px 0 0;padding:18px 16px calc(16px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
  @media (min-width:600px){.modal{align-items:center}.sheet{border-radius:16px}}
  .sheet h3{margin:0 0 12px;font-size:17px}.sheet .msg{white-space:pre-wrap;margin-bottom:14px;line-height:1.5}
  .sheet .btns{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}.sheet .btns button{min-width:88px}
  .sheet:has(>.dx){position:relative;padding-right:44px}button.xb.dx{position:absolute;top:10px;right:10px;font-size:24px!important} /* v1.66：見るだけの小窓は右上の × で閉じる（オーナー 2026-11-06） */
  #toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;z-index:60;display:none;max-width:90vw;text-align:center}
  #toast.on{display:block}
  .loading{padding:30px 0;text-align:center;color:var(--muted)}
/* v1.9：ボトル欄の枠の高さをそろえる */
.bt .ops select,.bt .ops button{height:36px;box-sizing:border-box;padding-top:0;padding-bottom:0}
/* v1.10：ボトル欄を POS の顧客画面と同じ2段に（銘柄・日付・残量／キープ名・飲切・期限切・ボトル移動）。枠の高さは36pxでそろえる */
.bt .b1{display:flex;align-items:center;gap:8px;margin-bottom:6px}.bt .b1 .nm{flex:1 1 0;min-width:0;overflow-wrap:anywhere;line-height:1.35}.bt .b1 .nm small{font-size:12px;font-weight:400;margin-left:6px;white-space:nowrap;color:var(--muted)}
.bt .b2{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:13px}.bt .b2 .kn{flex:1 1 90px;min-width:0;display:flex;align-items:center;gap:4px}.bt .b2 .kn span{white-space:nowrap;font-size:11px}/* v1.12：キープ名の文字を小さく・ボタンは「移動」 */.bt .b2 .kn input{flex:1 1 0;min-width:0;width:0}.bt .b2 .kn{position:relative}.bt .b2 .kn span{position:absolute;left:7px;top:2px;font-size:9px;line-height:1;pointer-events:none;z-index:1}.bt .b2 .kn input{padding-top:11px}/* v1.65：「キープ名」は欄の左上に小さく（POS と同じ。オーナー 2026-11-06） */.bt .b3{display:flex;gap:6px;flex:none;margin-left:auto}.bt .b3 button{white-space:nowrap}
.bt .b1 select{flex:none;width:auto;padding-left:8px;padding-right:4px}
.bt .b3{gap:4px}.bt .b3 button{padding-left:5px;padding-right:5px;font-size:13px} /* v1.55：ボタンが4つ（共同）でもキープ名の枠を狭くしない */
/* v1.58：銘柄が長い時は銘柄を「…」で短くして、開けた日と「共同 ○○ 様」は必ず出す（2026-11-01 成田様のマッカランで共同が切れていた） */
.bt .b1 select,.bt .b2 input,.bt .b3 button{height:36px;box-sizing:border-box;padding-top:0;padding-bottom:0}.bt .b2 input{padding-left:8px;padding-right:8px;font-size:15px}
/* v1.11：期限切れ・ボトル移動の行は1行に収まるまで文字を小さくする（fitLine） */
/* v1.14：v1.13 の枠・［戻す］をやめ、期限切れ・移動は飲み切り済と同じ小さな文字で1本1行（［戻す］なし） */
.vis .fit1{flex:1 1 0;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#btSel,#btRem,#btAdd{height:40px;box-sizing:border-box;padding-top:0;padding-bottom:0}
  /* 15番：入力欄の高さは全部 44px */
  input:not([type=checkbox]):not([type=radio]):not([type=file]):not([type=range]):not([type=color]),select{height:44px!important;min-height:44px;box-sizing:border-box;padding-top:0!important;padding-bottom:0!important}
  .bt .ops button,.bt .b3 button,#btAdd{height:44px!important;box-sizing:border-box;padding-top:0;padding-bottom:0} /* 入力欄の横のボタンも 44px */
/* v1.50：管理サイト・黒服マイページの中で編集の券が無い人（閲覧のみ・限定項目が不可）には、編集につながるボタンを出さない（オーナー 2026-10-24「不可の人には編集ボタンを表示させなければいいだけ」） */
html.ro #editInfo,html.ro #editMemo,html.ro #cuDel,html.ro #btcAdd,html.ro [data-sh],html.ro [data-bte],html.ro [data-btd],html.ro [data-unexp]{display:none!important}
html.ro [data-kn]{pointer-events:none;border-color:transparent}
  button.xb{background:none!important;border:none!important;box-shadow:none;border-radius:6px;padding:4px 6px!important;margin:0;width:auto!important;min-width:0;height:auto!important;min-height:0;font:inherit;font-size:18px!important;line-height:1;color:var(--muted)!important;flex:none;cursor:pointer}button.xb.img{position:absolute;top:2px;right:4px;color:var(--card)!important;text-shadow:0 0 4px var(--ink)}button.xb.img.lt{color:var(--muted)!important;text-shadow:none} /* 2026-11-05：行・写真の × は枠なし・うすく小さく（オーナー「×に枠はダサい、スペース食う」） */
</style>
</head>
<body>

<!-- ログイン -->
<div id="vLogin" class="hide">
  <div class="box">
    <h1>OLIVE 顧客</h1>
    <p class="muted">パスワードを入力してください</p>
    <form id="loginForm" autocomplete="off">
      <input id="pw" type="password" autocomplete="current-password" placeholder="パスワード">
      <button class="primary" type="submit" id="loginBtn">ログイン</button>
      <div class="err" id="loginErr"></div>
    </form>
  </div>
</div>

<!-- 一覧 -->
<div id="vList" class="hide">
  <div class="top"><span class="ttl" id="storeName">顧客</span><button class="ghost sm" id="menuBtn">メニュー</button></div>
  <div class="wrap">
    <input id="q" type="search" placeholder="お名前・フリガナ・会社名・領収書名・キープ名で検索" autocomplete="off">
    <div class="tools">
      <select id="months" aria-label="期間"></select>
      <button class="ok sm" id="newBtn" style="margin-left:auto">＋新規</button>
    </div>
    <div class="muted" id="count" style="font-size:13px;margin-bottom:6px"></div>
    <div class="rows" id="rows"><div class="loading">読み込み中…</div></div>
  </div>
</div>

<!-- 詳細 -->
<div id="vDetail" class="hide">
  <div class="top"><button class="ghost sm" id="backBtn">‹ 一覧</button><span class="ttl" id="dName"></span></div>
  <div class="wrap" id="detail"></div>
</div>

<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>

<script src="../lib/supabase-js@2.116.0.js"></script>
<!-- プログラムは js/ に役目ごとに分けた（中身はそのまま。読み込む順に意味がある：始めの処理は 04_edit.js の最後） -->
<script src="js/01_core.js"></script>
<script src="js/02_list.js"></script>
<script src="js/03_detail.js"></script>
<script src="js/04_edit.js"></script>
</body>
</html>
