<!DOCTYPE html>
<html lang="ja">
<head>

<title>OLIVE 管理</title><!-- admin v0.80 -->
<style>
  :root{--bg:#f6f5f0;--card:#fff;--ink:#1a1a1a;--muted:#7a7a7a;--line:#e3e1dc;--soft:#f1f0e8;--head:#4b5320;--head2:#6b7436;--brand:#c9b37a;--brand-d:#a08a4f;--pri:#4b5320;--ok:#b8973e;--warn:#c0392b;--warn-soft:#fbe9e7;--gold-soft:#f8f0d8;--acc:var(--ok);--gold:var(--ok);--blue:var(--pri);--edit:var(--pri);--h:44px}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;font-size:16px}
  button{font:inherit;cursor:pointer;border:none;border-radius:10px;padding:0 16px;height:var(--h);background:var(--soft);color:var(--ink);white-space:nowrap}
  button.primary{background:var(--blue);color:#fff}button.ok{background:var(--acc);color:#fff}button.danger{background:var(--warn);color:#fff}
  button.ghost{background:transparent;border:1px solid var(--line)}button.sm{height:34px;padding:0 10px;font-size:14px}
  button:disabled{opacity:.4;cursor:not-allowed}
  input,select{font:inherit;font-size:16px;height:var(--h);padding:0 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);width:100%;min-width:0}
  label{display:block;font-size:13px;color:var(--muted)}label>input,label>select{margin-top:4px;color:var(--ink)}
  .muted{color:var(--muted)}small{font-size:13px}.hide{display:none!important}
  .err{color:var(--warn);font-size:14px;min-height:20px;margin-top:8px}

  /* ログイン */
  #vLogin{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  #vLogin .box{width:100%;max-width:360px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:10px}
  #vLogin h1{margin:0;font-size:22px}

  /* 画面の枠 */
  #vApp{min-height:100vh;display:flex;flex-direction:column}
  .top{position:sticky;top:0;z-index:20;background:var(--head);color:#fff;display:flex;align-items:center;gap:10px;padding:8px 16px;padding-top:calc(8px + env(safe-area-inset-top))}
  .top .ttl{font-weight:700;font-size:17px;white-space:nowrap}
  .top select{width:auto;max-width:220px;height:36px;background:#fff}
  .top .who{margin-left:auto;font-size:13px;color:var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .top button{height:36px;background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;font-size:14px;padding:0 12px}
  #menuBtn{display:none}
  .alertbar{background:var(--warn-soft);color:var(--warn);padding:10px 16px;font-weight:700;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .alertbar button{height:36px;font-size:14px}
  .body{flex:1;display:flex;min-height:0}
  nav{width:230px;flex:none;background:#fff;border-right:1px solid var(--line);padding:10px 0;overflow:auto}
  nav .grp{font-size:12px;color:var(--muted);padding:12px 18px 4px}
  nav a{display:flex;align-items:center;gap:6px;padding:9px 18px;color:var(--ink);text-decoration:none;font-size:15px;cursor:pointer}
  nav a:hover{background:var(--soft)}nav a.on{background:var(--head);color:#fff}
  nav a .tag{margin-left:auto;font-size:11px;color:var(--muted);white-space:nowrap;flex:none}nav a.on .tag{color:var(--line)}
  main{flex:1;min-width:0;padding:18px 22px 60px;overflow:auto}
  main h1{font-size:22px;margin:0 0 14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
  .card h2{font-size:16px;margin:0 0 10px}
  .grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;align-items:end}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  table.t{width:100%;border-collapse:collapse}table.t td,table.t th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;font-size:15px;vertical-align:middle}
  table.t th{font-size:13px;color:var(--muted);font-weight:400}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .seg button{border-radius:0;background:#fff;height:36px;font-size:14px;padding:0 12px;border-right:1px solid var(--line)}.seg button:last-child{border-right:none}
  .seg button.on{background:var(--ink);color:#fff}
  .badge{font-size:12px;padding:2px 8px;border-radius:999px;white-space:nowrap;background:var(--gold);color:#fff}.badge.gray{background:var(--muted)}.badge.k{background:var(--acc)}.badge.warnb{background:var(--warn)}
  .num{text-align:right!important;font-variant-numeric:tabular-nums;white-space:nowrap}
  .alert{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 14px;margin-bottom:14px;font-weight:700}
  table.reg{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:13px}table.reg td,table.reg th{padding:6px 5px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:right}
  table.reg th{color:var(--muted);font-weight:400}table.reg tr[data-rd]{cursor:pointer}table.reg tr[data-rd]:hover{background:var(--soft)}
  table.sl{border-collapse:collapse;font-variant-numeric:tabular-nums}table.sl th{font-size:12px;color:var(--muted);font-weight:400;padding:4px 4px;text-align:right;white-space:nowrap}
  table.sl td{padding:3px 4px}table.sl input{width:88px;text-align:right;height:38px}table.sl td.x{width:40px}
  table.fn{border-collapse:collapse}table.fn th{font-size:12px;color:var(--muted);font-weight:400;padding:4px 4px;text-align:left;white-space:nowrap}
  table.fn td{padding:3px 4px;white-space:nowrap}table.fn input,table.fn select{height:38px}table.fn input[data-f=name]{width:260px}table.fn select{width:auto}table.fn input[data-f=hv],table.fn input[data-f=dv]{width:80px;text-align:right}table.fn th.gh{text-align:center;color:var(--ink);font-weight:700;border-bottom:1px solid var(--line)}table.fn .sep{width:10px;border-left:1px solid var(--line)}table.fn .u{display:inline-block;width:1.4em;color:var(--muted);font-size:13px}
  table.fn label.pu{display:inline-flex;align-items:center;gap:4px;font-size:13px;color:var(--ink);height:38px}table.fn label.pu input{width:auto;height:auto;margin:0}table.fn td.x{width:40px}
  .slw{overflow-x:auto}.slgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px;align-items:start}
  .kv2{display:grid;grid-template-columns:1fr auto;gap:8px 14px;align-items:center}
  .pwbox{font-family:ui-monospace,Menlo,monospace;font-size:20px;font-weight:700;letter-spacing:.05em}
  .pwv{font-family:ui-monospace,Menlo,monospace;font-size:17px;font-weight:700;letter-spacing:.05em;white-space:nowrap}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
  .modal .box{background:#fff;border-radius:16px;padding:18px;width:min(520px,100%);max-height:88vh;overflow:auto;display:flex;flex-direction:column;gap:10px}
  .modal .bar{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
  #toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60}#toast.on{opacity:1}
  /* v0.15 キャスト設定 */
  .cs-w{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:12px}.cs-w.editing{border-color:var(--blue)}
  table.cs{width:max-content;min-width:100%}table.cs td,table.cs th{padding:7px 8px}table.cs th.nm,table.cs td.nm{position:sticky;left:0;background:#fff;text-align:left;z-index:1;border-right:1px solid var(--line)}
  table.cs td.nm a{color:var(--blue);font-weight:700;cursor:pointer}
  table.cs input,table.cs select{height:34px;font-size:13px;padding:0 6px;width:auto}table.cs input{text-align:right}table.cs button.sm{height:34px}
  .cs-gu{display:inline-flex;align-items:center;gap:6px}.cs-gu input[type=date]{width:140px;text-align:left}.cs-gu label{display:inline-flex;align-items:center;gap:3px;font-size:13px;color:var(--ink)}.cs-gu input[type=checkbox]{width:auto;height:auto}
  .cs-tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px}.cs-tabs button{background:none;border-radius:0;border-bottom:3px solid transparent;color:var(--muted);height:42px}.cs-tabs button.on{color:var(--ink);border-bottom-color:var(--ink);font-weight:700}
  table.rgden input,#rgDepIn,#rgOpenIn{height:38px;font-size:15px}
  .ck{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--ink);min-height:var(--h)}.ck input{width:auto;height:auto;margin:0}
  table.pc th,table.pc td{vertical-align:top;text-align:left}.pc-c{display:flex;flex-direction:column;align-items:flex-start;gap:4px;font-size:15px}.pc-c img{width:72px;height:54px;object-fit:cover;border-radius:6px;border:1px solid var(--line);cursor:pointer;background:var(--soft)}
  .tccode{font-size:44px;font-weight:700;letter-spacing:.2em;text-align:center;font-variant-numeric:tabular-nums;padding:8px 0}
  table.vip input{width:110px;text-align:right}
  .sif{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}.sit{display:flex;align-items:center;gap:6px;margin-top:4px}.sit input{flex:1}
  [data-st] .seg button{height:var(--h)}[data-st] .stb{display:inline-flex;align-items:center;height:var(--h);padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--soft);white-space:nowrap}
  .cs-li{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}.cs-li:last-child{border-bottom:none}
  @media (max-width:820px){
    #menuBtn{display:inline-block}
    nav{position:fixed;top:52px;bottom:0;left:0;z-index:15;transform:translateX(-100%);transition:transform .2s;box-shadow:2px 0 12px rgba(0,0,0,.15)}
    nav.open{transform:none}
    main{padding:14px 16px 60px}
    .top .who{display:none}
    table.perm tr.pr{display:flex;flex-direction:column;align-items:stretch;gap:6px;padding:8px 0;border-bottom:1px solid var(--line)}
    table.perm tr.pr td{border:none;padding:0 6px;text-align:left!important}
    table.perm .seg{display:flex}table.perm .seg button{flex:1}
  }
  /* 15番：長い説明は1行＋「？」で詳しく（押すとその場で下に開く）。入力欄の高さは全部 44px */
  .hint .qm{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px!important;min-height:0!important;min-width:0;padding:0!important;margin:0 0 0 6px;border:1px solid var(--line);border-radius:50%;background:#fff;color:var(--muted);font-size:12px;line-height:1;vertical-align:middle;cursor:pointer}
  .hint .more{display:none;margin-top:4px}.hint.open .more{display:block}.hint.open .qm{background:var(--line)}
  input:not([type=checkbox]):not([type=radio]):not([type=file]):not([type=range]):not([type=color]),select{height:44px!important;min-height:44px;box-sizing:border-box;padding-top:0!important;padding-bottom:0!important}
  table.cs button.sm,table.fn button,.row button.sm{height:44px} /* 入力欄の横のボタンも 44px */
  table.ks td,table.ks th{text-align:right;white-space:nowrap}table.ks th.nm,table.ks td.nm{text-align:left}table.ks th.ksg{text-align:center;color:var(--ink);font-weight:700;border-left:1px solid var(--line)}table.ks tr.kst td{border-top:2px solid var(--line);font-weight:700}
  .plg{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:14px;align-items:start}.plg .card{margin:0}table.pl td.r,table.pl th.r{text-align:right}table.pl tr.sep td{padding:2px;border-bottom:2px solid var(--line)}table.pl tr.kst td{font-weight:700;border-top:2px solid var(--line)}table.pl td,table.pl th{white-space:nowrap}
  /* v0.50：まとめ */
  .smg{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;margin-bottom:14px;align-items:start}
  .smb{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}.smb h2{margin:0;padding:10px 14px;font-size:16px;font-weight:600}.smb h2 small{font-weight:400}
  .smb .big{text-align:right;font-size:24px;padding:10px 14px}.smb table{width:100%;border-collapse:collapse}.smb td{padding:8px 12px;border-top:1px solid var(--line);font-size:14px}
  .smb td:first-child{background:var(--soft);font-weight:600;width:45%;white-space:nowrap}.smb td:last-child{text-align:right}
  button.eye{display:inline-flex;align-items:center;justify-content:center;padding:0 10px;color:var(--muted)}button.eye.on{color:var(--ink)}
  .smb tr.grp td{border-top:2px solid var(--line)}.smb tr.sum td{font-weight:700;font-size:16px;border-top:2px solid var(--line)}.smb tr.sub td:first-child{padding-left:26px;font-weight:400}
</style>

<body>
<div id="vLogin" class="hide"><form class="box" id="loginForm" autocomplete="on">
  <h1>OLIVE 管理</h1>
  <input id="lid" placeholder="ID" autocomplete="username" autocapitalize="off" spellcheck="false">
  <input id="lpw" type="password" placeholder="パスワード" autocomplete="current-password">
  <button class="primary" type="submit">ログイン</button>
  <div class="err" id="loginErr"></div>
</form></div>

<div id="vApp" class="hide">
  <div class="top">
    <button id="menuBtn">☰</button>
    <span class="ttl">OLIVE 管理</span>
    <select id="storeSel"></select><span id="storeName" style="font-weight:700"></span>
    <span class="who" id="who"></span>
    <button id="logoutBtn">ログアウト</button>
  </div>
  <div id="alertBar"></div>
  <div class="body">
    <nav id="nav"></nav>
    <main id="main"></main>
  </div>
</div>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0"></script>
<script>
// v0.57・SQL 080：店ごとの「係」の名称（stores.kakari_label。空なら「係」）。画面の「係」は KL を差し込む。見出しの一覧は kReg に入れておき、kSet で付け直す。操作ログに残す操作の名前は「係」のまま（表示の時に kl で読み替える）
let KL='係'; const kl=s=>KL==='係'?s:String(s??'').replace(/係/g,KL); const actL=a=>kl(a==='伝票取消'?'伝票削除':a); /* v0.64：操作ログの「伝票取消」は「伝票削除」と表示（記録の名前は変えない） */ const KT=[];
function kReg(...os){ const walk=o=>{ for(const k of Object.keys(o)){ const v=o[k]; if(typeof v==='string'){ if(v.includes('係')) KT.push([o,k,v]); } else if(v&&typeof v==='object') walk(v); } }; os.forEach(walk); }
function kSet(v){ KL=(v&&String(v).trim())||'係'; KT.forEach(([o,k,v])=>{ o[k]=kl(v); }); }
document.addEventListener('click',e=>{ const q=e.target.closest&&e.target.closest('.hint .qm'); if(q){ e.preventDefault(); e.stopPropagation(); q.closest('.hint').classList.toggle('open'); } },true); /* 15番：「？」で詳しい説明を開く・閉じる */
const SUPABASE_URL='https://gjqaxenwvvazhjtziusf.supabase.co', SUPABASE_KEY='sb_publishable_pPfJUvJd6iJeHBNiD7XkWA_2RKF7JYw';
// POS・タイムカードと同じサイト上にあるので、ログイン情報は別の場所にしまう（POSのログインを横取りしない）
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{storageKey:'olive-admin-auth'}});
const EMAIL_DOMAIN='@admin.olive.local';
const $=id=>document.getElementById(id);
const esc=t=>String(t??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('on'); clearTimeout(toast.h); toast.h=setTimeout(()=>t.classList.remove('on'),2000); }
function guard(btn,fn){ return async(...a)=>{ if(btn.disabled) return; btn.disabled=true; try{ await fn(...a); } finally{ btn.disabled=false; } }; }
function modal(html){ const m=document.createElement('div'); m.className='modal'; m.innerHTML=`<div class="box">${html}</div>`; document.body.appendChild(m); return m; }
function uiAlert(msg){ return new Promise(res=>{ const m=modal(`<div style="white-space:pre-wrap">${esc(msg)}</div><div class="bar"><button class="primary" data-k="ok">OK</button></div>`); m.querySelector('[data-k=ok]').onclick=()=>{ m.remove(); res(); }; }); }
function uiConfirm(msg,okLabel='OK',cls='primary'){ return new Promise(res=>{ const m=modal(`<div style="white-space:pre-wrap">${esc(msg)}</div><div class="bar"><button class="ghost" data-k="no">キャンセル</button><button class="${cls}" data-k="ok">${esc(okLabel)}</button></div>`); m.querySelector('[data-k=no]').onclick=()=>{ m.remove(); res(false); }; m.querySelector('[data-k=ok]').onclick=()=>{ m.remove(); res(true); }; }); }
async function rpc(fn,args){ rtOwn=Date.now(); const r=await sb.rpc(fn,args||{}); rtOwn=Date.now(); if(r.error){ await uiAlert(r.error.message); return {ok:false}; } return {ok:true,data:r.data}; }
function genPw(n=10){ const c='abcdefghjkmnpqrstuvwxyz23456789'; const a=crypto.getRandomValues(new Uint8Array(n)); return [...a].map(x=>c[x%c.length]).join(''); }
const fmtDT=t=>t?new Date(t).toLocaleString('ja-JP',{year:'numeric',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}):'—';

// ---------- 画面の一覧（オーナー以外に見せるかは店舗ごとに設定） ----------
const SCREENS=[
  {grp:'集計'},
  {k:'summary',n:'まとめ'},
  {k:'pl',n:'収支'},
  {k:'bills',n:'伝票一覧'},
  {k:'cast_sales',n:'スタッフ'},
  {k:'register',n:'現金管理'},
  {k:'punches',n:'打刻一覧'},
  {k:'cust',n:'顧客サイト'},
  {grp:'設定'},
  {k:'set_cast',n:'スタッフ設定'},
  {k:'set_pay',n:'給与項目'},
  {k:'set_pos',n:'POS設定'},
  {grp:'履歴'},
  {k:'hist_memo',n:'メモ一覧'},
  {k:'hist_cash',n:'入出金履歴'},
  {k:'hist_print',n:'印刷履歴'},
  {k:'hist_del',n:'削除履歴'},
];
// v0.21：パスワードはオーナーだけ（「アカウント」の見出しをやめて、オーナーの下へ）
const OWNER_SCREENS=[{grp:'オーナー'},{k:'o_perms',n:'表示設定'},{k:'o_share',n:'顧客情報の共有'},{k:'o_ids',n:'管理サイトのID'},{k:'pw',n:'パスワード'}];
const PERM_LABEL={none:'非表示',view:'閲覧',edit:'編集'};

let me=null, storeId=null, page=null;
const stores=()=>me?.stores||[];
const curStore=()=>stores().find(s=>s.id===storeId);
const stSet=()=>me?.settings?.[storeId]||{perms:{},nippo_days:3};
// v0.05：収支は月次・日次を1つの画面にまとめた（前の設定 pl_day／pl_month も読む）
function perm(k){ if(me?.is_owner) return 'edit'; const p=stSet().perms||{}; if(k==='pl') return p.pl||p.pl_day||p.pl_month||'none'; if(k==='register') return p.register||p.register_month||'none'; /* v0.07：レジ精算も月次・日次を1つの画面に */ return p[k]||'none'; }

// ---------- ログイン ----------
$('loginForm').onsubmit=async e=>{ e.preventDefault(); $('loginErr').textContent='';
  const id=$('lid').value.trim().toLowerCase(), pw=$('lpw').value;
  if(!id||!pw){ $('loginErr').textContent='IDとパスワードを入力してください'; return; }
  const btn=e.submitter; if(btn) btn.disabled=true;
  try{ const { error }=await sb.auth.signInWithPassword({email:id+EMAIL_DOMAIN,password:pw});
    if(error){ $('loginErr').textContent='IDかパスワードが違います'; return; }
    $('lpw').value=''; await start(); } finally{ if(btn) btn.disabled=false; } };
$('logoutBtn').onclick=async()=>{ if(!await uiConfirm('ログアウトしますか？')) return; await sb.auth.signOut(); location.reload(); };
$('menuBtn').onclick=()=>$('nav').classList.toggle('open');
function showLogin(msg){ $('vApp').classList.add('hide'); $('vLogin').classList.remove('hide'); $('loginErr').textContent=msg||''; }

async function loadMe(){ const r=await sb.rpc('admin_me'); if(r.error||!r.data) return null; return r.data; }
async function start(){
  const { data:{ session } }=await sb.auth.getSession(); if(!session){ showLogin(); return; }
  me=await loadMe();
  if(me&&!me.is_owner){ const ms=await sb.rpc('admin_my_staff'); me.staff_id=ms.error?undefined:ms.data; } /* v0.68・SQL 087：結びつけた黒服。黒服の給料は自分の分だけ出す（関数が無い時は undefined＝今までどおり） */
  if(!me){ await sb.auth.signOut(); showLogin('このIDでは管理サイトに入れません（止められたか、パスワードが変わりました）'); return; }
  const saved=(()=>{ try{ return localStorage.getItem('olive_admin_store'); }catch(e){ return null; } })();

function businessDate(d=new Date()){ const x=new Date(d.getTime()-8*3600*1000); return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`; }
const bdStart=d=>new Date(`${d}T08:00:00+09:00`).toISOString();
const md=x=>`${+x.slice(5,7)}/${+x.slice(8,10)}`;
const WJ=['日','月','火','水','木','金','土'];
let regDate=null, regMonth=null, regTab='day';
const regHead=()=>`<h1>現金管理 <small class="muted" style="font-weight:400">${esc(curStore()?.name||'')}</small></h1><div class="row" style="margin-bottom:14px"><span class="seg">${[['month','月次'],['day','日次']].map(([v,n])=>`<button data-rt="${v}" class="${regTab===v?'on':''}">${n}</button>`).join('')}</span></div>`;
function regTabs(){ $('main').querySelectorAll('[data-rt]').forEach(b=>b.onclick=()=>{ if(b.dataset.rt==='month'&&regTab==='day'&&regDate) regMonth=regDate.slice(0,7); /* v0.08：日次で見ている日の月を開く */ regTab=b.dataset.rt; PAGES.register(); }); }

// 期間（from〈含まない〉〜to〈含まない〉）の日ごとの 現金売上・入金・出金（日払い含む）
// v0.65：1000行で切れないように分けて読む（精算の間が空いた時に「未精算分」が少なく出た）
async function sbAll(mk){ let all=[]; for(let from=0;;from+=1000){ const r=await mk().range(from,from+999); if(r.error) return {data:all.length?all:null,error:r.error}; all=all.concat(r.data||[]); if((r.data||[]).length<1000) return {data:all,error:null}; } }
async function regMoves(fromEx,toEx){
  const [mv,adv,pay]=await Promise.all([
    sbAll(()=>sb.from('cash_movements').select('business_date,kind,amount').eq('store_id',storeId).gt('business_date',fromEx).lt('business_date',toEx).order('id')),
    sbAll(()=>sb.from('daily_advances').select('business_date,amount').eq('store_id',storeId).gt('business_date',fromEx).lt('business_date',toEx).order('id')),
    sbAll(()=>sb.from('payments').select('amount,paid_at,bills!inner(status,store_id)').eq('method','cash').eq('bills.store_id',storeId).gte('paid_at',bdStart(fromEx)).lt('paid_at',bdStart(toEx)).order('id')) ]);
  const er=mv.error||adv.error||pay.error; if(er) return {error:er};
  const sum={}; const add=(dd,k,v)=>{ if(dd<=fromEx||dd>=toEx) return; (sum[dd]=sum[dd]||{sales:0,cin:0,cout:0})[k]+=Number(v)||0; };
  (mv.data||[]).forEach(x=>add(x.business_date,x.kind==='in'?'cin':'cout',x.amount)); (adv.data||[]).filter(x=>x.amount>0).forEach(x=>add(x.business_date,'cout',x.amount));
  (pay.data||[]).filter(p=>p.bills&&p.bills.status!=='void'&&p.amount).forEach(p=>add(businessDate(new Date(p.paid_at)),'sales',p.amount));
  return {sum}; }
const dayAdd=(d,n)=>{ const x=new Date(d+'T00:00:00'); x.setDate(x.getDate()+n); return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`; };

  const idle=!saved&&d<today&&!outSum&&!inSum&&!advSum&&!cashSales;

      const r=await rpc('admin_set_after_ext',{p_store:st,p_on:on,p_minutes:m}); if(!r.ok) return; toast('保存しました'); PAGES.set_pay(); }); } }
  { const fc=$('main').querySelector('[data-fines]'); if(fc){ fc.querySelector('[data-fadd]').onclick=()=>{ const tb=fc.querySelector('table.fn'); fc.querySelector('[data-fempty]')?.remove(); tb.insertAdjacentHTML('beforeend',fineRowHtml({},true)); const last=[...tb.querySelectorAll('tr[data-fr]')].pop(); fineRowWire(last,true); last.querySelector('[data-f=name]').focus(); };

    const sv=fc.querySelector('[data-fsave]'); sv.onclick=guard(sv,async()=>{ const g=fineRead(fc); if(g.err){ await uiAlert(g.err); return; } if(!await uiConfirm(`罰金の種類を保存しますか？（${g.n}種類）\nPOS の「＋罰金」の一覧も変わります。今までに登録した罰金は変わりません`)) return;

// v0.11・SQL 052：罰金の種類（店舗ごと）。POS の在籍リスト「＋罰金」で選ぶ。金額が決まっているものはそのまま登録、時給の％は月末の時給で計算、日給の％はその人の日給で計算
// v0.17：罰金1つを1行にして、時給の人・日給の人の決め方を横に並べる（表は今と同じ fine_types。時給と日給が同じ「円」か「その都度」なら target='all' の1行＝黒服にもかかる。違えば hourly・daily の2行）
const FINE_H=[['','なし'],['hourly_pct','％'],['yen','円'],['input','その都度']], FINE_D=[['','なし'],['daily_pct','％'],['yen','円'],['input','その都度'],['daily_late','遅刻（時間分）'],['daily_early','早上がり（時間分）']];
const FINE_TIME=c=>c==='daily_late'||c==='daily_early';
// fine_types の行 → 名前ごとに {name, h:{calc,value,per_unit}, d:{…}}
function fineGroup(rows){ const g=new Map();
  for(const r of rows){ const k=r.name; if(!g.has(k)) g.set(k,{name:k,h:null,d:null}); const x=g.get(k), c={calc:r.calc,value:r.value,per_unit:r.per_unit};
    if(r.target==='hourly') x.h=c; else if(r.target==='daily') x.d=c;
    else if(r.calc==='hourly_pct') x.h=x.h||c; else if(r.calc==='daily_pct'||FINE_TIME(r.calc)) x.d=x.d||c; else { x.h=x.h||c; x.d=x.d||c; } }
  return [...g.values()]; }
function fineSide(k,c,ed){ const dis=ed?'':'disabled', os=k==='h'?FINE_H:FINE_D, cl=c?.calc||'';
  return `<td><select data-f="${k}c" ${dis}>${os.map(([v,n])=>`<option value="${v}" ${cl===v?'selected':''}>${n}</option>`).join('')}</select></td>
    <td><input data-f="${k}v" inputmode="numeric" value="${c?.value??''}" ${dis}><span class="u" data-f="${k}u"></span></td><td><label class="pu"><input type="checkbox" data-f="${k}p" ${c?.per_unit?'checked':''} ${dis}>個数</label></td>`; }
function fineRowHtml(r,ed){ return `<tr data-fr><td><input data-f="name" value="${esc(r.name||'')}" ${ed?'':'disabled'}></td>${fineSide('h',r.h,ed)}<td class="sep"></td>${fineSide('d',r.d,ed)}${ed?'<td class="x"><button class="ghost sm" data-fdel aria-label="行を削除">✕</button></td>':''}</tr>`; }
function fineRowWire(tr,ed){ for(const k of ['h','d']){ const q=f=>tr.querySelector(`[data-f=${k}${f}]`), cl=q('c'), v=q('v'), pu=q('p'), u=q('u');
    const upd=()=>{ const c=cl.value; u.textContent=c==='yen'?'円':(c===''||c==='input')?'':'%'; v.disabled=!ed||c===''||c==='input'; if(c===''||c==='input') v.value=''; v.placeholder=FINE_TIME(c)?'加算（%）':''; pu.disabled=!ed||c!=='yen'; if(c!=='yen') pu.checked=false; }; cl.onchange=upd; upd(); }
  const d=tr.querySelector('[data-fdel]'); if(d) d.onclick=()=>tr.remove(); }
function fineCard(rows,ed,hours){ const gs=fineGroup(rows); return `<div class="card" data-fines><h2>罰金の種類<br><small class="muted" style="font-weight:400">POS の在籍リストの「＋罰金」で選びます</small></h2>
  <div class="muted hint" style="font-size:13px;margin-bottom:8px;line-height:1.6">時給の人・日給の人のそれぞれで決め方を選びます（かからない方は「なし」）<button type="button" class="qm" aria-label="詳しく">？</button><div class="more">％：時給は月末に決まった時給の％、日給はその人の日給の％<br>円：選ぶとその金額で登録します（「個数」にすると 金額×個数）<br>その都度：選んだ時に金額を入れます<br>遅刻・早上がり（時間分）：決まった時刻と打刻（15分丸め）の差 × 時間給（日給 ÷ 下の所定時間）。「加算（%）」を入れると日給のその％を加算します（無断の時など）<br>時給と日給が同じ「円」か「その都度」の罰金は、黒服にもかかります<br>一覧にないものは、POS で「その他」を選んで理由と金額を入れられます</div></div>
  <div class="row" style="margin-bottom:10px;font-size:14px">日給の人の所定時間<input id="dHours" inputmode="decimal" value="${hours??''}" ${ed&&hours!=null?'':'disabled'} style="width:80px;text-align:right">時間${ed&&hours!=null?'<button class="ghost sm" id="dHoursSave">保存</button>':''}${hours==null?'<span class="muted" style="font-size:13px">SQL 053 が未実行です</span>':''}</div>
  <div class="slw"><table class="fn"><tr><th rowspan="2" style="vertical-align:bottom">名前</th><th colspan="3" class="gh">時給</th><th class="sep"></th><th colspan="3" class="gh">日給</th>${ed?'<th></th>':''}</tr>
  <tr><th>決め方</th><th>金額・％</th><th></th><th class="sep"></th><th>決め方</th><th>金額・％</th><th></th>${ed?'<th></th>':''}</tr>${gs.map(r=>fineRowHtml(r,ed)).join('')}</table>${gs.length?'':'<div class="muted" data-fempty style="padding:8px 4px">まだ入っていません</div>'}</div>
  ${ed?'<div class="row" style="margin-top:10px"><button class="ghost sm" data-fadd>＋ 行を追加</button><button class="primary sm" data-fsave>保存</button></div>':''}</div>`; }
function fineRead(card){ const out=[]; let i=0, n=0; const names=new Set();
  for(const tr of card.querySelectorAll('tr[data-fr]')){ i++; const g=k=>tr.querySelector(`[data-f=${k}]`); const name=g('name').value.trim();
    const side=k=>{ const calc=g(k+'c').value; if(!calc) return {}; const vs=g(k+'v').value; let value=null, lb=k==='h'?'時給':'日給';
      if(FINE_TIME(calc)){ value=slNum(vs); if(value!=null&&(!Number.isInteger(value)||value<=0)) return {err:`${i}行目（${name}・${lb}）：加算（%）は1以上の整数にするか、空けてください`}; }
      else if(calc!=='input'){ value=slNum(vs); if(value==null||!Number.isInteger(value)||value<=0) return {err:`${i}行目（${name}・${lb}）：${calc==='yen'?'金額':'％'}を1以上の整数で入力してください`}; }
      return {c:{calc,value,per_unit:calc==='yen'&&g(k+'p').checked}}; };
    const h=side('h'), d=side('d'); if(!name&&!h.c&&!d.c) continue; if(!name) return {err:`${i}行目：名前を入力してください`};
    if(h.err) return {err:h.err}; if(d.err) return {err:d.err}; if(!h.c&&!d.c) return {err:`${i}行目（${name}）：時給か日給のどちらかの決め方を選んでください`};
    if(names.has(name)) return {err:`同じ名前の行が2つあります：${name}`}; names.add(name); n++;
    const same=h.c&&d.c&&h.c.calc===d.c.calc&&(h.c.calc==='yen'||h.c.calc==='input')&&h.c.value===d.c.value&&h.c.per_unit===d.c.per_unit;
    if(same) out.push({name,target:'all',...h.c}); else { if(h.c) out.push({name,target:'hourly',...h.c}); if(d.c) out.push({name,target:'daily',...d.c}); } }
  return {rows:out,n}; }

// v0.14・SQL 055：アフターの延長（attendance_rules。タイムカードの打刻の時に round_punch が使う）。閉店の○分前を過ぎたアフターは、閉店まで働いたことにする。閉店時間は店舗設定で決める
const closeTxt=c=>{ const m=String(c||'01:00').match(/^(\d{1,2}):(\d{2})/); return m?`${+m[1]<12?'翌':''}${+m[1]}:${m[2]}`:String(c); };
function afterCard(ax,ed){ const h='<h2>アフターの延長<br><small class="muted" style="font-weight:400">アフターの打刻（退勤の代わり）で、時給を付ける時間を延ばします</small></h2>';
  if(ax.error) return `<div class="card">${h}<div class="err">${esc(/after_ext|minutes|close/.test(ax.error.message)||/find|exist|schema cache/.test(ax.error.message)?'SQL 055 が未実行です：':'読み込めません：')}${esc(ax.error.message)}</div></div>`;
  const a=ax.data||{}; if(a.minutes==null) return `<div class="card">${h}<div class="err">SQL 055 が未実行です</div></div>`;
  const on=!!a.on, dis=ed?'':'disabled', cl=closeTxt(a.close);
  return `<div class="card" data-after>${h}<div class="row"><span class="seg" id="afOn">${[[true,'する'],[false,'しない']].map(([v,n])=>`<button data-v="${v}" class="${on===v?'on':''}" ${dis}>${n}</button>`).join('')}</span></div>
    <div class="row" style="margin-top:10px;font-size:14px">閉店（${esc(cl)}）の<input id="afM" inputmode="numeric" value="${esc(String(a.minutes))}" ${dis} style="width:80px;text-align:right">分前を過ぎたアフターは、閉店（${esc(cl)}）まで働いたことにする${ed?'<button class="primary sm" id="afSave">保存</button>':''}</div>
    <div class="muted hint" style="font-size:13px;margin-top:8px;line-height:1.6">時給の人・日給の人の両方。タイムカードで打刻した時に決まります<button type="button" class="qm" aria-label="詳しく">？</button><div class="more">（変更しても、前の打刻はそのまま）<br>閉店時間は「POS設定」で設定します。退勤・アフターの打刻は閉店より後になりません</div></div></div>`; }

// ---------- キャスト設定 v0.15・SQL 056：一人ずつの給与条件（月ごと。その月以降／その月のみ）・その人だけの条件・メモ ----------
// 担当・給与（時給／日給）・日給・日払い・契約書は staff に入れる（月で変わらない。POS と同じ欄）
// 保証時給・期限・同伴ノルマ・バック・源泉徴収・消費税・厚生費・罰金の免除は cast_terms に月ごとに入れる（その月の行があればそれ、なければ前の月の「以降」の行）
const CS_PUNCH='打刻の手入力'; // v0.24・SQL 064：POS で打刻を手で入れた時に自動で付く罰金
const CS_FOREVER='9999-12-31', CS_CATS=['性格','体調','お客様','勤怠','良かったこと','その他'];
const CS_SP={pay:'支給',deduct:'控除',text:'文字だけ',wage:'支給（時給加算）'}; // v0.54・SQL 079：時給加算（1時間あたりの円。時給の人のスライド表の金額に足す）。v0.55：時給加算は「支給」の中の1つ（種類＝支給 → 月額／時給加算）。保存する kind は wage のまま // v0.43：文字だけは新しく入れない（メモを使う。前に入れたものは出す）
let csMonth=null, csEdit=false, csDetail=null, csTab='memo', csOrdM=null;
// v0.52：キャスト・黒服のタブをやめて、1つの画面に（上にキャスト、下に黒服）。編集はどちらか片方ずつ（csEdit＝'cast'／'hall'）
// v0.23：「今月」は営業日（朝8時で日付が変わる）の月
const csNowMonth=()=>businessDate().slice(0,7)+'-01';
const csAddMonth=(m,n)=>{ const [y,mo]=m.split('-').map(Number); const d=new Date(Date.UTC(y,mo-1+n,1)); return d.toISOString().slice(0,7)+'-01'; };
const csMLabel=m=>{ const [y,mo]=m.split('-').map(Number); return `${y}年${mo}月`; };
const csMShort=m=>`${Number(m.split('-')[1])}月`;
const csList=st=>sb.from('staff').select('*').eq('store_id',st).eq('is_active',true).order('sort_order').order('id');
// v0.23・SQL 063：給与形態（時給・日給）と日給も月ごと。前の行（pay_type が空）は staff の値を使う
function csTerms(s,rows,m){ const t=rows.filter(r=>r.staff_id===s.id&&r.month<=m&&(r.month===m||!r.only_month)).sort((a,b)=>a.month<b.month?1:-1)[0];
  const pay=x=>{ const pt=x.pay_type||(s.is_seppan?'seppan':s.pay_type==='daily'?'daily':'hourly'); /* v0.36・SQL 075：給与に折半 */ return {...x,pay_type:pt,daily_wage:pt==='daily'?(x.pay_type?x.daily_wage:s.daily_wage)??null:null}; };
  if(t) return pay({...t,exempt_fines:t.exempt_fines||[]});
  return pay({month:null,only_month:false,guaranteed_wage:s.guaranteed_wage??null,guarantee_until:s.guarantee_until??null,douhan_quota:s.douhan_quota??null,back_pct:null,back_mode:'add',withhold:null,ctax_pct:null,welfare_mode:'std',welfare_amount:null,exempt_fines:[],slide_ids:null,pay_type:null,daily_wage:null,seppan_pct:null}); }
const csNum=v=>v==null||v===''?null:Number(v);
const csDate=d=>{ if(!d) return '—'; if(d===CS_FOREVER) return '無期限'; const [y,m,dd]=d.split('-').map(Number); return `${y}/${m}/${dd}`; };

PAGES.set_cast=async()=>{
  if(csDetail&&csDetail.store===storeId) return csDetailPage();
  csDetail=null; const st=storeId, ed=perm('set_cast')==='edit'; if(!ed) csEdit=false;

  <div class="row" style="margin-bottom:12px"><select id="csM" style="width:auto" ${csEdit?'disabled':''}>${mOpts.map(x=>`<option value="${x}" ${x===m?'selected':''}>${csMLabel(x)}</option>`).join('')}</select></div>
  <div id="csCastBox"><h2 style="margin:0 0 8px">キャスト</h2><div class="card muted">読み込み中…</div></div>
  <div id="csHallBox" style="margin-top:28px"><h2 style="margin:0 0 8px">黒服</h2><div class="card muted">読み込み中…</div></div>`;
  $('csM').onchange=()=>{ csMonth=$('csM').value; PAGES.set_cast(); };
  await Promise.all([csCastPart($('csCastBox'),st,ed,m), csHallPart($('csHallBox'),st,ed,m)]); };
async function csCastPart(box,st,ed,m){
  const [sf,tm,ft,nt,stb]=await Promise.all([csList(st), sbAll(()=>sb.from('cast_terms').select('*').eq('store_id',st).lte('month',m).order('id')),
    sb.from('fine_types').select('name').eq('store_id',st).order('sort_order'), sbAll(()=>sb.from('cast_notes').select('staff_id').eq('store_id',st).eq('is_void',false).order('id')), /* v0.67：1000行で切れないように分けて読む */
    sb.from('slide_tables').select('id,name,unit,sort_order').eq('store_id',st).eq('is_active',true).order('sort_order')]);
  if(page!=='set_cast'||storeId!==st||csMonth!==m||!box.isConnected) return;
  const er=sf.error||tm.error||nt.error;
  if(er){ box.innerHTML=`<h2 style="margin:0 0 8px">キャスト</h2><div class="card err">${esc(/cast_terms|cast_notes|day_pay_ok/.test(er.message)&&/exist|schema cache/.test(er.message)?'SQL 056 が未実行です：':'読み込めません：')}${esc(er.message)}</div>`; return; }
  const all=sf.data||[], halls=all.filter(x=>x.kind==='hall'), casts=all.filter(x=>x.kind==='cast'&&!x.is_trial&&!x.kakari_only);
  const nc={}; (nt.data||[]).forEach(x=>nc[x.staff_id]=(nc[x.staff_id]||0)+1);
  const tbls=stb.error?[]:(stb.data||[]); // SQL 058 の前は空
  const unitOf=(s,t)=>t.pay_type==='seppan'?null:t.pay_type==='daily'?'daily':'hourly'; // v0.36・SQL 075：折半＝係小計×小計バック％だけ（スライド・保証時給・同伴ノルマなし）
  const slOk=(ids,u)=>(ids||[]).filter(id=>tbls.some(x=>x.id===id&&x.unit===u));
  const slTxt=(s,t)=>{ const u=unitOf(s,t); if(!u) return '—'; const ok=slOk(t.slide_ids,u); return ok.length?esc(ok.map(id=>slShort(tbls.find(x=>x.id===id).name)).join('・')):'<span class="badge warnb">未選択</span>'; };
  const slShort=n=>String(n).replace(/スライド(表)?$/,'')||n; // v0.35：表の中は短く
  const fines=[...new Set([...(ft.data||[]).map(x=>x.name),'同伴ノルマ','新調日',CS_PUNCH])];
  const rows=casts.map(s=>({s,t:csTerms(s,tm.data||[],m)}));
  const hallName=id=>halls.find(h=>h.id===id)?.display_name||'—';
  const E=csEdit==='cast', lock=csEdit==='hall';
  const sel=(k,v,os,dis)=>`<select data-k="${k}" ${dis?'disabled':''}>${os.map(([ov,on])=>`<option value="${esc(ov)}" ${String(v??'')===String(ov)?'selected':''}>${esc(on)}</option>`).join('')}</select>`;
  const inp=(k,v,w,dis)=>`<input data-k="${k}" inputmode="decimal" value="${esc(v??'')}" style="width:${w}px" ${dis?'disabled':''}>`;
  const yn=v=>v==null?'—':v;
  const PT={hourly:'時給',daily:'日給',seppan:'折半'};
  const cell=({s,t})=>{ const sp=t.pay_type==='seppan', daily=t.pay_type==='daily';
    const back=t.back_pct==null?(sp?'<span class="badge warnb">未設定</span>':'—'):`${Number(t.back_pct)}%`;
    const wf=t.welfare_mode==='amount'?yen(t.welfare_amount):t.welfare_mode==='none'?'なし':'標準';

    <div style="margin-top:8px;text-align:right"><button class="ghost sm" id="nCats">分類の変更</button></div></div>`:''}

// ---------- 集計「キャスト」 v0.28・SQL 068・069：成績 → 支給 → 罰金 → 控除 → 支払う額（見るだけ。計算はデータベースの admin_cast_month） ----------
// 決定時給：選んだスライド表と保証時給（日給の人は日給）の高い方。時間報酬＝決定時給×稼働時間（日給の人は 日給×稼働日数）。会計済の伝票だけ。体験は入れない
// 同伴ノルマ罰金＝足りない回数×時間給×4時間。源泉＝（課税対象額−5,000円×その月の日数）×10.21%（罰金は引かずに計算）。厚生費「標準」＝出勤 1〜3日 5,000円／4〜10日 10,000円／11日以上 15,000円
let ksMonth=null;
const KS_COLS=[
  ['成績',[['manager','担当黒服','t'],['days','稼働日数','d'],['hours','稼働時間','h'],['sales',''+KL+'小計','y'],['points','ポイント','p'],['douhan','同伴','dq'],['reactions','反応','n']]],
  ['支給',[['wage','決定時給','w'],['time_pay','時間報酬','y'],['kakari_back','小計バック','y'],['seppan_pay','折半','y'],['item_back','商品バック','y'],['allowance','手当','y'],['special_pay','個別支給','y']]],
  ['罰金',[['fines','罰金','m'],['quota_fine','同伴ノルマ','m']]],
  ['控除',[['ctax','消費税','m'],['welfare','厚生費','m'],['special_deduct','個別控除','m'],['advance','日払（立替）','m'],['withholding','源泉徴収','m']]],
  ['支給額',[['taxable','課税対象額','y'],['net','残り支給額','net']]]];
PAGES.cast_sales=async()=>{ const st=storeId, now=csNowMonth(); if(!ksMonth) ksMonth=now; const m=ksMonth;
  const mOpts=Array.from({length:13},(_,i)=>csAddMonth(now,-i));
  const head=`<h1>スタッフ <small class="muted" style="font-weight:400">${esc(curStore()?.name||'')}</small></h1><div class="row" style="margin-bottom:12px;justify-content:space-between"><select id="ksM" style="width:auto">${mOpts.map(x=>`<option value="${x}" ${x===m?'selected':''}>${csMLabel(x)}</option>`).join('')}</select><span class="row" style="gap:8px"><button class="ghost" id="ksXls" disabled>詳細（Excel）</button><button class="ghost" id="ksPdf" disabled>給料明細（PDF）</button></span></div>`;
  $('main').innerHTML=head+'<div class="card muted">読み込み中…</div>'; let data=null, hall=null;
  const wire=()=>{ const e=$('ksM'); if(e) e.onchange=()=>{ ksMonth=e.value; PAGES.cast_sales(); }; const x=$('ksXls'), pd=$('ksPdf'); if(x&&data){ x.disabled=pd.disabled=!(data.rows||[]).length&&!(hall?.rows||[]).length; x.onclick=guard(x,()=>ksExcel(data,hall)); pd.onclick=guard(pd,()=>ksPdf(data,hall)); } }; wire();
  // v0.35：黒服も同じ画面に（キャストの下）。Excel・PDF にも黒服を入れる
  const [r,hr]=await Promise.all([sb.rpc('admin_cast_month',{p_store:st,p_month:m}), sb.rpc('admin_hall_month',{p_store:st,p_month:m})]); if(page!=='cast_sales'||storeId!==st||ksMonth!==m) return;
  hall=hr.error?null:(hr.data||{});
  if(r.error){ $('main').innerHTML=head+`<div class="card err">${esc(/admin_cast_month/.test(r.error.message)?'SQL 068・069 が未実行です：':'読み込めません：')}${esc(r.error.message)}</div>`; wire(); return; }
  data=r.data; const rows=r.data?.rows||[], n=v=>Number(v||0), yen0=v=>v?yen(v):'—', neg=v=>v?`<span style="color:var(--warn)">−${yen(v).replace(/^-/,'')}</span>`:'—';
  const fmt=(k,typ,x)=>{ const v=x[k]; if(typ==='t') return esc(v||'—'); if(typ==='d') return n(v)?n(v)+'日':'—'; if(typ==='h') return n(v)?n(v).toLocaleString('ja-JP',{maximumFractionDigits:2})+'時間':'—';
    if(typ==='p') return n(v)?n(v).toLocaleString('ja-JP',{maximumFractionDigits:1}):'—'; if(typ==='n') return n(v)?n(v)+'回':'—';
    if(typ==='dq') return `${n(x.douhan)}回${x.quota!=null?` <small class="muted">／${x.quota}</small>`:''}`;
    if(typ==='w') return v==null?(x.seppan?'—':'<span class="badge warnb">未設定</span>'):yen(v)+(x.pay_type==='daily'?' <small class="muted">日給</small>':'');
    if(typ==='m') return neg(n(v)); if(typ==='net') return n(v)<0?`<b style="color:var(--warn)">${yen(v)}</b>`:`<b>${yen(v)}</b>`; return yen0(n(v)); };
  const sumKeys=['days','hours','sales','points','douhan','reactions','time_pay','kakari_back','seppan_pay','item_back','allowance','special_pay','fines','quota_fine','ctax','welfare','special_deduct','advance','withholding','taxable','net'];
  const tot={}; sumKeys.forEach(k=>tot[k]=rows.reduce((a,x)=>a+n(x[k]),0));
  const cols=KS_COLS.flatMap(([g,cs])=>cs.map(c=>[g,...c]));
  const totCell=([g,k,l,typ])=>{ if(!sumKeys.includes(k)) return '<td></td>'; if(typ==='dq') return `<td>${tot.douhan}回</td>`; return `<td>${fmt(k,typ,tot)}</td>`; };
  $('main').innerHTML=head+'<h2 style="margin:4px 0 8px">キャスト</h2>'+(rows.length?`<div class="cs-w"><table class="t cs ks"><thead><tr><th class="nm" rowspan="2">名前</th>${KS_COLS.map(([g,cs])=>`<th colspan="${cs.length}" class="ksg">${g}</th>`).join('')}</tr>
    <tr>${cols.map(([g,k,l])=>`<th>${l}</th>`).join('')}</tr></thead><tbody>
    ${rows.map(x=>`<tr><td class="nm">${esc(x.name)}${x.active?'':' <small class="muted">（退店）</small>'}${x.seppan?' <small class="muted">折半</small>':''}</td>${cols.map(([g,k,l,typ])=>`<td>${fmt(k,typ,x)}</td>`).join('')}</tr>`).join('')}
    <tr class="kst"><td class="nm"><b>合計</b></td>${cols.map(totCell).join('')}</tr></tbody></table></div>`:'<div class="card muted">この月のキャストはいません</div>')
    +`<div class="muted hint" style="font-size:13px;margin-top:8px;line-height:1.6">会計済の伝票と、タイムカードの打刻（丸めた時刻）で計算します<button type="button" class="qm" aria-label="詳しく">？</button><div class="more">決定時給：選んだスライド表と保証時給（日給の人は日給）のうち一番高い金額。時間報酬＝決定時給×稼働時間（日給の人は 日給×稼働日数）<br>小計バック＝${KL}小計×スタッフ設定のバック％（時給・日給に加算）。折半＝${KL}小計×小計バック％（給与が折半の人。時給・保証時給・同伴ノルマ罰金はなし）。商品バック・手当・日払（立替）・罰金は POS で入れたもの。％の罰金は月末の時給で計算します<br>同伴ノルマ罰金＝足りない回数×時給×4時間（日給の人の時給は 日給÷所定時間）<br>課税対象額＝支給の合計。源泉＝（課税対象額−5,000円×その月の日数）×10.21%（罰金は引かずに計算。スタッフ設定で「しない」の人は0円）<br>厚生費「標準」：稼働日数 1〜3日 5,000円／4〜10日 10,000円／11日以上 15,000円<br>残り支給額＝課税対象額−罰金−控除。体験の人はその日に支払済のため含めていません</div></div>`+'<div id="hpBox" style="margin-top:22px"></div>';
  hallPayDraw(hr,st,m,rows); wire(); };

// v0.29・SQL 069：詳細（Excel）と給料明細（PDF）のダウンロード（d-system の「Excel」「報酬明細PDF」と同じ形）。ライブラリは押した時に読む
const ksLib={}; function ksLoad(u){ return ksLib[u]||(ksLib[u]=new Promise((ok,ng)=>{ const sc=document.createElement('script'); sc.src=u; sc.onload=ok; sc.onerror=()=>{ delete ksLib[u]; ng(new Error('読み込めません：'+u)); }; document.head.appendChild(sc); })); }
const ksN=v=>Number(v||0), ksB=(x,k,f)=>ksN(x.backs?.[k]?.[f]);
const ksFineNames=rows=>[...new Set(rows.flatMap(x=>Object.keys(x.fine_items||{})))].sort((a,b)=>a.localeCompare(b,'ja'));
const ksDed=x=>ksN(x.ctax)+ksN(x.fines)+ksN(x.quota_fine)+ksN(x.welfare)+ksN(x.special_deduct);
const ksHM=h=>{ const t=Math.round(ksN(h)*60); return `${Math.floor(t/60)}時間${String(t%60).padStart(2,'0')}分`; };
const ksCode=()=>{ const c=curStore()?.code; return c?'_'+c:''; };
async function ksExcel(d,h){ try{ await ksLoad('https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js'); }catch(e){ await uiAlert(e.message); return; }

    if(!v) return; const num=t=>t===''?null:slNum(t); const l=num(v.l), bb=num(v.b);

    const z=await rpc('admin_save_hall_adjust',{p_staff:x.id,p_month:m,p_late:l,p_bonus:bb,p_memo:v.m}); if(!z.ok) return; toast('修正しました'); PAGES.cast_sales(); })); }

// ---------- 伝票一覧 v0.49・SQL 078：期間（31日まで）の伝票。No で中身、オーナーは直す・まとめて削除。Excel ----------
let blFrom=null, blTo=null, blFilt='all', blQ='';

const BL_COLS=[['status','状態'],['date','営業日'],['in','入店'],['out','退店'],['dur','時間'],['table','卓'],['guests','客数'],['customers','お客様'],['kakari',''+KL+''],['douhan','同伴'],['items','注文'],['ext','延長'],
  ['sub',''+KL+'小計'],['service','サービス料'],['discount','値引'],['surcharge','値増'],['due','合計'],['cash','現金'],['card','カード'],['invoice','売掛'],['oki','置き'],['receipt','領収書']];
const BL_TXT=['customers','kakari','douhan'];
// v0.51：延長の列は回数。見出しに POS設定の延長単位を出す（例：30分延長（回））。POS設定を読めない時は「延長（回）」
let blExtL='延長（回）'; const blLab=(k,l)=>k==='ext'?blExtL:l;
const BL_SUM=['guests','ext','sub','service','discount','surcharge','due','cash','card','invoice','oki'];
const blDur=(a,b)=>{ if(!a||!b) return ''; const m=Math.max(0,Math.round((new Date(b)-new Date(a))/60000)); return `${Math.floor(m/60)}:${String(m%60).padStart(2,'0')}`; };
const blSt=x=>x.status==='void'?'削除':x.status==='open'?'来店中':'会計済';
const blVal=(k,x)=>k==='status'?blSt(x):k==='date'?x.date:k==='in'?beHm(x.opened_at):k==='out'?(x.closed_at?beHm(x.closed_at):''):k==='dur'?blDur(x.opened_at,x.closed_at):k==='receipt'?(x.receipt?'◯':''):BL_SUM.includes(k)?Number(x[k]||0):(x[k]??'');
PAGES.bills=async()=>{ const st=storeId, own=!!me?.is_owner, today=businessDate();
  if(!blFrom){ blFrom=today.slice(0,8)+'01'; blTo=today; }
  const f=blFrom, t=blTo;
  const head=`<h1>伝票一覧 <small class="muted" style="font-weight:400">${esc(curStore()?.name||'')}</small></h1>
  <div class="card"><div class="row" style="flex-wrap:wrap;gap:8px;align-items:center"><input type="date" id="blF" value="${f}" style="width:auto"><span>〜</span><input type="date" id="blT" value="${t}" style="width:auto">
    <button class="ghost" id="blMon">月間反映</button><select id="blFl" style="width:auto">${BL_F.map(([k,n])=>`<option value="${k}" ${blFilt===k?'selected':''}>${n}</option>`).join('')}</select><button class="primary" id="blGo">検索</button>
    <span style="flex:1"></span><input id="blQ" placeholder="文字で探す" value="${esc(blQ)}" style="width:180px"></div>
    <div class="muted" style="font-size:13px;margin-top:6px">期間は31日まで。No で伝票を開きます${own?'。削除は会計済の伝票のみ':''}</div></div>`;
  $('main').innerHTML=head+'<div id="blBox"><div class="card muted">読み込み中…</div></div>';
  const wire=()=>{ $('blGo').onclick=()=>{ const a=$('blF').value, b=$('blT').value; if(!a||!b){ uiAlert('期間を入力してください'); return; } if(b<a){ uiAlert('期間が逆になっています'); return; }
      if((new Date(b)-new Date(a))/864e5>30){ uiAlert('期間は31日までにしてください'); return; } blFrom=a; blTo=b; blFilt=$('blFl').value; PAGES.bills(); };
    $('blMon').onclick=()=>{ const a=($('blF').value||today).slice(0,8)+'01', d=new Date(a+'T00:00:00'); d.setMonth(d.getMonth()+1); d.setDate(0);
      $('blF').value=a; $('blT').value=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
    $('blFl').onchange=()=>{ blFilt=$('blFl').value; draw(); }; $('blQ').oninput=()=>{ blQ=$('blQ').value; draw(); }; };
  wire();
  const [r,ps]=await Promise.all([sb.rpc('admin_bill_list',{p_store:st,p_from:f,p_to:t}), sb.from('pos_settings').select('ext_minutes').eq('store_id',st).maybeSingle()]); if(page!=='bills'||storeId!==st||blFrom!==f||blTo!==t) return;
  const em=Number(ps?.data?.ext_minutes||0); blExtL=em>0?`${em}分延長（回）`:'延長（回）';
  if(r.error){ $('blBox').innerHTML=`<div class="card err">${esc(/admin_bill_list/.test(r.error.message)?'SQL 078 が未実行です：':'読み込めません：')}${esc(r.error.message)}</div>`; return; }
  const all=r.data||[]; let rows=[];
  const pick=()=>{ const q=blQ.trim().toLowerCase(); return all.filter(x=>blFilt==='void'?x.status==='void':x.status!=='void'&&(blFilt==='all'||(blFilt==='open'?x.status==='open':Number(x[blFilt]||0)>0)))
    .filter(x=>!q||BL_COLS.some(([k])=>String(blVal(k,x)).toLowerCase().includes(q))); };
  const cell=(k,x)=>{ const v=blVal(k,x); if(k==='status') return x.status==='closed'?'<span class="muted">会計済</span>':`<span class="badge ${x.status==='open'?'':'warnb'}">${v}</span>`;
    if(k==='date') return md(v); if(BL_SUM.includes(k)) return k==='guests'||k==='ext'?(v?v:'—'):(v?yen(v):'—'); return esc(v||(k==='out'?'':'')); };
  function draw(){ rows=pick(); const tot={}; BL_SUM.forEach(k=>tot[k]=rows.reduce((a,x)=>a+Number(x[k]||0),0));
    const del=own&&blFilt!=='void';
    $('blBox').innerHTML=`<div class="row" style="margin-bottom:8px;gap:8px"><button class="ghost" id="blXls" ${rows.length?'':'disabled'}>Excel</button>${del?'<button class="ghost" id="blDel" disabled>削除</button>':''}<span class="muted" style="font-size:13px">${rows.length}件</span></div>
    <div class="cs-w"><table class="t cs ks bl"><thead><tr>${del?'<th><input type="checkbox" id="blAll" style="width:auto;height:auto"></th>':''}<th class="nm">No</th>${BL_COLS.map(([k,l])=>`<th${k==='items'||BL_TXT.includes(k)?' style="text-align:left"':''}>${blLab(k,l)}</th>`).join('')}</tr></thead><tbody>
    <tr class="kst">${del?'<td></td>':''}<td class="nm"><b>合計</b></td>${BL_COLS.map(([k])=>`<td>${BL_SUM.includes(k)?(k==='guests'||k==='ext'?tot[k]:yen(tot[k])):''}</td>`).join('')}</tr>
    ${rows.map((x,i)=>`<tr>${del?`<td>${x.status==='closed'?`<input type="checkbox" data-blck="${x.id}" style="width:auto;height:auto">`:''}</td>`:''}<td class="nm"><a data-blv="${x.id}" style="color:var(--blue);cursor:pointer;text-decoration:underline">${i+1}</a></td>${BL_COLS.map(([k])=>`<td${k==='items'?' style="white-space:normal;min-width:180px;max-width:320px;text-align:left"':BL_TXT.includes(k)?' style="text-align:left"':''}>${cell(k,x)}</td>`).join('')}</tr>`).join('')||`<tr><td colspan="${BL_COLS.length+2}" class="muted">伝票はありません</td></tr>`}</tbody></table></div>`;
    $('main').querySelectorAll('[data-blv]').forEach(a=>a.onclick=()=>{ const x=all.find(z=>z.id===a.dataset.blv); billView(a.dataset.blv,own&&x&&x.status==='closed'); });
    $('blXls').onclick=guard($('blXls'),()=>blExcel(rows,f,t));
    if(del){ const ck=()=>[...$('main').querySelectorAll('[data-blck]:checked')].map(x=>x.dataset.blck), upd=()=>{ $('blDel').disabled=!ck().length; };
      $('main').querySelectorAll('[data-blck]').forEach(c=>c.onchange=upd); $('blAll').onchange=()=>{ $('main').querySelectorAll('[data-blck]').forEach(c=>c.checked=$('blAll').checked); upd(); };
      $('blDel').onclick=guard($('blDel'),async()=>{ const ids=ck(); if(!ids.length) return; const sum=ids.reduce((a,id)=>a+Number(all.find(x=>x.id===id)?.due||0),0);
        if(!await uiConfirm(`${ids.length}件の伝票（合計 ${yen(sum)}）を削除しますか？\n売上・${KL}小計・バックから外れます`,'削除','danger')) return;
        let n=0; for(const id of ids){ const z=await rpc('admin_bill_void',{p_bill:id}); if(!z.ok) break; n++; }
        toast(`${n}件 削除しました`); PAGES.bills(); }); } }
  draw(); };
async function blExcel(rows,f,t){ try{ await ksLoad('https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js'); }catch(e){ await uiAlert(e.message); return; }
  const head=['No',...BL_COLS.map(([k,l])=>blLab(k,l))], body=rows.map((x,i)=>[i+1,...BL_COLS.map(([k])=>blVal(k,x))]);
  const tot=['合計',...BL_COLS.map(([k])=>BL_SUM.includes(k)?rows.reduce((a,x)=>a+Number(x[k]||0),0):'')];
  const ws=XLSX.utils.aoa_to_sheet([[`伝票一覧 ${f}〜${t}`],head,tot,...body]); ws['!cols']=head.map(h=>({wch:h==='注文'?40:h==='お客様'||h===''+KL+''||h===blExtL?14:10}));
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'伝票一覧'); XLSX.writeFile(wb,`bills-${f}_${t}${ksCode()}.xlsx`); toast('ダウンロードしました'); }

// 削除履歴：操作ログ（pos_audit_log）のうち、名前に 削除・取消・取り消し・外す が入る操作。営業日は朝8時で区切る
const HI_KJ={amount:'金額',minutes:'分',is_auto:'自動延長',before:'変更前',after:'変更後',item:'商品',qty:'数量',total:'請求額',guest_count:'客数',items:'注文',name:'名前',fields:'内容',customer:'お客様',bottle:'ボトル',kind:'種別',total_before:'切替前の請求額',method:'支払方法',payments:'支払',kakari:''+KL+'',tag_no:'タグ番号',by:'操作した人',date:'営業日',business_date:'営業日',memo:'摘要'};
const hiVal=v=>v===true?'はい':v===false?'いいえ':Array.isArray(v)?v.map(hiVal).join('、'):v&&typeof v==='object'?Object.entries(v).map(([k,z])=>`${HI_KJ[k]||k}：${hiVal(z)}`).join('・'):typeof v==='number'?v.toLocaleString('ja-JP'):String(v);
const HI_UNIT={amount:'円',total:'円',total_before:'円',minutes:'分',guest_count:'名'}; // 数字には単位
const logShort=(o,KJ,val,unit)=>{ const e=Object.entries(o||{}).filter(([k,v])=>v!==null&&v!==undefined&&v!==''&&!(Array.isArray(v)&&!v.length)&&k!=='table'&&k!=='reason'); e.sort((a,b)=>(a[0]==='by'?-1:0)-(b[0]==='by'?-1:0));
  const md=v=>{ const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(v)); return m?`${+m[2]}/${+m[3]}`:String(v); }, U={amount:'円',total:'円',total_before:'円',minutes:'分',guest_count:'名'};
  return e.map(([k,v])=>{ const n=typeof v==='number'?v.toLocaleString('ja-JP')+(U[k]||''):null;
    if(k==='by') return '操作者：'+String(v).replace(/^管理サイト：/,'');
    if(k==='date'||k==='business_date') return md(v);
    if(k==='kind'&&(v==='in'||v==='out')) return v==='in'?'入金':'出金';
    if(k==='is_auto') return v?'自動延長':'手動延長';
    if(['amount','minutes','guest_count'].includes(k)&&n!=null) return n;
    if(k==='method'||k==='name'||k==='email') return val(v);
    return `${KJ[k]||k}：${n!=null?n:val(v)}`; }).join(' ／ '); }; /* 2026-10-14：内容は短く（オーナー「長い」）。金額・分・人数・日付・入金／出金は値だけ */
const hiDetail=o=>logShort(o,HI_KJ,hiVal);
const HI_DEL=/削除|取消|取り消し|外す/;
PAGES.hist_del=async()=>{ const st=storeId; hiPeriod('hist_del','<select id="hiK" style="width:auto"><option value="all">全部</option></select>','。削除・取消の記録です（POS の操作ログから）'); const f=hiFrom, t=hiTo; let all=[], raw=0;
  const draw=()=>{ const rows=all.filter(x=>hiDelK==='all'||x.action===hiDelK);
    $('hiBox').innerHTML=`<div class="row" style="margin-bottom:8px"><span class="muted" style="font-size:13px">${rows.length}件${raw>=1000?'（1000件まで。期間を短くしてください）':''}</span></div>
    <div class="cs-w"><table class="t cs ks"><thead><tr><th class="nm">日時</th><th style="text-align:left">操作</th><th style="text-align:left">卓</th><th style="text-align:left">理由</th><th style="text-align:left">内容</th></tr></thead><tbody>
    ${rows.map(x=>`<tr><td class="nm">${hiDT(x.created_at)}</td><td style="text-align:left"><b>${esc(actL(x.action))}</b></td><td style="text-align:left">${esc(x.detail?.table||'')}</td><td style="text-align:left;white-space:normal;min-width:120px;max-width:240px">${esc(x.reason||x.detail?.reason||'')}</td><td style="text-align:left;white-space:normal;min-width:220px;max-width:460px">${esc(hiDetail(x.detail))}</td></tr>`).join('')||'<tr><td colspan="5" class="muted" style="text-align:left">記録はありません</td></tr>'}</tbody></table></div>`; };
  $('hiK').onchange=()=>{ hiDelK=$('hiK').value; draw(); };
  const q=()=>sb.from('pos_audit_log').select('id,action,detail,reason,created_at').eq('store_id',st).gte('created_at',f+'T08:00:00+09:00').lt('created_at',dayAdd(t,1)+'T08:00:00+09:00');
  let r=await q().or('action.ilike.*削除*,action.ilike.*取消*,action.ilike.*取り消し*,action.ilike.*外す*').order('created_at',{ascending:false}).limit(1000);
  if(r.error) r=await q().order('created_at',{ascending:false}).limit(1000); // 絞り込みが通らない時は、全部読んでから画面で絞る
  if(page!=='hist_del'||storeId!==st||hiFrom!==f||hiTo!==t) return; if(r.error){ hiErr(r.error); return; }
  all=(r.data||[]).filter(x=>HI_DEL.test(x.action||'')); raw=(r.data||[]).length; const acts=[...new Set(all.map(x=>x.action))].sort(); if(hiDelK!=='all'&&!acts.includes(hiDelK)) hiDelK='all';
  $('hiK').innerHTML=`<option value="all">全部</option>`+acts.map(a=>`<option value="${esc(a)}" ${hiDelK===a?'selected':''}>${esc(actL(a))}</option>`).join(''); draw(); };

  const kOf=c=>c?('customer_kakari' in c?((c.customer_kakari||[]).find(x=>x.store_id===st)?.staff_id||null):c.kakari_staff_id):null;

  const rows=Object.values(M).sort((a,b)=>b.amt-a.amt||b.n-a.n||String(a.name).localeCompare(String(b.name),'ja'));

  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'お客様のデータ'); XLSX.writeFile(wb,`customers-${f}_${t}${ksCode()}.xlsx`); toast('ダウンロードしました'); }

    ${f('siInv','インボイス番号（T＋数字13桁）',d.invoice,{ph:'T1234567890123',ml:20})}

    if(kn!==k0){ rtOwn=Date.now(); const y=await sb.rpc('admin_save_kakari_label',{p_store:st,p_label:kn}); rtOwn=Date.now(); if(y.error){ await uiAlert(/admin_save_kakari_label/.test(y.error.message)?'SQL 080 が未実行です（係/担当/指名はまだ保存できません。ほかの項目は保存しました）':y.error.message); } }

// ---------- POS設定 v0.22・SQL 062：料金（メニュー以外）はここだけで変える。POS では見るだけ ----------
// HC・BC は伝票を立ち上げた時に人数分つける。金額だけ選ぶ（伝票の名前は HC／BC）。HC は係にバック100%（振分できる）、BC は誰にもバックなし
const HCBC_OPTS=[[null,'付けない'],...Array.from({length:10},(_,i)=>[(i+1)*1000,((i+1)*1000).toLocaleString('ja-JP')+'円'])];
const vipRow=(t,ed,dis)=>`<tr data-tb="${t.id}"><td>${esc(t.name)}</td><td><input inputmode="numeric" data-v="set" value="${esc(String(t.vip_set_fee||0))}" ${dis}></td><td><input inputmode="numeric" data-v="ext" value="${esc(String(t.vip_ext_fee||0))}" ${dis}></td>${ed?'<td style="width:1%"><button class="ghost sm" data-vrm aria-label="外す">×</button></td>':''}</tr>`;
PAGES.set_pos=async()=>{ const st=storeId, ed=perm('set_pos')==='edit', dis=ed?'':'disabled';
  const keep=$('siBox')?.dataset.st===st?$('siBox'):null; // 料金だけ保存した時は、店の情報の入力中の内容を消さない

  const [ps,tb]=await Promise.all([ sb.from('pos_settings').select('*').eq('store_id',st).maybeSingle(), sb.from('tables').select('id,name,vip_set_fee,vip_ext_fee,sort_order').eq('store_id',st).order('sort_order').order('id') ]);
  if(page!=='set_pos'||storeId!==st) return;
  const er=ps.error||tb.error; if(er){ $('main').innerHTML=`<h1>POS設定</h1><div class="card err">読み込めません：${esc(er.message)}</div>`; return; }
  const d=ps.data||{}; if(!('auto_hc_amount' in d)){ $('main').innerHTML=`<h1>POS設定</h1><div class="card err">SQL 062 が未実行です</div>`; return; }
  const num=(id,label,v)=>`<label>${label}<input id="${id}" inputmode="decimal" value="${esc(v??'')}" ${dis}></label>`;
  const amt=(id,label,v)=>`<label>${label}<select id="${id}" ${dis}>${HCBC_OPTS.map(([a,n])=>`<option value="${a??''}" ${(v??null)===a?'selected':''}>${n}</option>`).join('')}</select></label>`;

  $('main').innerHTML=`<h1>POS設定 <small class="muted" style="font-weight:400">${esc(curStore()?.name||'')}</small></h1>${ed?'':'<div class="muted" style="margin-bottom:10px">閲覧のみ</div>'}
  <div id="siBox" data-st="${esc(st)}"><div class="card muted">読み込み中…</div></div>
  <div class="card"><h2>料金</h2><div class="grid2">

    ${amt('psHc','HC（人数分・'+KL+'にバック100%）',d.auto_hc_amount)}${amt('psBc','BC（人数分・バックなし）',d.auto_bc_amount)}
  </div></div>
  <div class="card"><h2>伝票</h2>

  <div class="card"><h2>入金・出金の項目</h2><div class="muted" style="font-size:13px;margin-bottom:8px">POS の現金管理で、入金・出金する時に選ぶ項目です。「その他」はいつも出ます（自由に書けます）</div>
    ${'cash_out_items' in d?`<div style="display:flex;gap:20px;flex-wrap:wrap;align-items:flex-start">${[['in','入金'],['out','出金']].map(([k,l])=>`<div style="flex:1 1 280px;min-width:0"><div style="font-weight:700;margin-bottom:6px">${l}</div><div class="ci-list" data-ci="${k}">${(d['cash_'+k+'_items']||[]).map(x=>`<span class="badge gray ci" style="background:#fff;color:var(--ink);border:1px solid var(--line);font-size:14px;margin:0 6px 6px 0;display:inline-flex;gap:6px;align-items:center"><span>${esc(x)}</span>${ed?'<a data-cirm style="cursor:pointer;color:var(--muted)">×</a>':''}</span>`).join('')}</div>

      ${ed?'<div class="row" style="margin-top:10px"><button class="primary" id="ciSave">項目を保存</button></div>':''}`:'<div class="err">SQL 077 が未実行です</div>'}</div>
  <div class="card"><h2>VIP料金</h2>
    <div class="muted" style="font-size:13px;margin-bottom:6px">VIP代は部屋に1回、VIP延長は延長ごと。人数は掛けません。ここに無い卓は通常卓（0円）です</div>

    <div id="vipNone" class="muted" style="${tables.some(t=>Number(t.vip_set_fee||0)||Number(t.vip_ext_fee||0))?'display:none':''}">VIP の卓はありません</div>
    ${ed&&tables.length?`<div class="row" style="margin-top:8px"><select id="vipAdd" style="width:auto"><option value="">＋VIP の卓を追加</option>${tables.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('')}</select></div>`:''}</div>
  ${ed?'<div class="row"><button class="primary" id="psSave">保存</button></div>':''}
  <div class="muted hint" style="font-size:13px;margin-top:10px;line-height:1.6">保存すると、POS の次の伝票から変わります（今開いている伝票はそのまま）<button type="button" class="qm" aria-label="詳しく">？</button><div class="more">日払（立替）の上限・体験の源泉・ポイント・同伴の準備時間は「給与項目」で設定します</div></div>`;
  if(keep) $('siBox').replaceWith(keep); else siRender();
  if(!ed) return;
  // v0.48：VIP料金は VIP の卓だけ出す。「＋VIP の卓を足す」で行を足す、× で外す（保存すると0円＝通常卓）
  const vipSync=()=>{ const on=new Set([...$('main').querySelectorAll('tr[data-tb]')].map(x=>x.dataset.tb)); $('vipNone').style.display=on.size?'none':''; [...$('vipAdd').options].forEach(o=>{ if(o.value) o.hidden=on.has(o.value); }); };
  const vipWire=tr=>{ tr.querySelector('[data-vrm]').onclick=()=>{ tr.remove(); vipSync(); }; };
  $('main').querySelectorAll('tr[data-tb]').forEach(vipWire);

  // v0.47・SQL 077：入金・出金の項目（足す・×で消す → 項目を保存）
  const ciChip=x=>{ const c=document.createElement('span'); c.className='badge gray ci'; c.style.cssText='background:#fff;color:var(--ink);border:1px solid var(--line);font-size:14px;margin:0 6px 6px 0;display:inline-flex;gap:6px;align-items:center'; c.innerHTML=`<span>${esc(x)}</span><a data-cirm style="cursor:pointer;color:var(--muted)">×</a>`; c.querySelector('[data-cirm]').onclick=()=>c.remove(); return c; };
  $('main').querySelectorAll('[data-cirm]').forEach(a=>a.onclick=()=>a.closest('.ci').remove());
  $('main').querySelectorAll('[data-ciadd]').forEach(b=>{ const k=b.dataset.ciadd, inp=$('main').querySelector(`[data-ciin="${k}"]`), list=$('main').querySelector(`[data-ci="${k}"]`);
    const add=async()=>{ const v=inp.value.trim(); if(!v) return; if(v==='その他'){ await uiAlert('「その他」は登録不要です'); return; } if([...list.querySelectorAll('.ci span')].some(x=>x.textContent===v)){ inp.value=''; return; } list.appendChild(ciChip(v)); inp.value=''; inp.focus(); };
    b.onclick=add; inp.onkeydown=e=>{ if(e.key==='Enter'&&!e.isComposing){ e.preventDefault(); add(); } }; });
  if($('ciSave')){ const cs=$('ciSave'); cs.onclick=guard(cs,async()=>{ const g=k=>[...$('main').querySelectorAll(`[data-ci="${k}"] .ci span`)].map(x=>x.textContent);
    const r=await rpc('admin_save_cash_items',{p_store:st,p_in:g('in'),p_out:g('out')}); if(!r.ok) return; toast('保存しました（POS の次の入金・出金から変わります）'); }); }
  const sv=$('psSave'); sv.onclick=guard(sv,async()=>{
    const g=id=>slNum($(id).value), v={set_minutes:g('psSetM'),set_unit_price:g('psSetP'),ext_minutes:g('psExtM'),ext_unit_price:g('psExtP'),service_rate:g('psSvc'),tax_rate:g('psTax'),total_round_unit:g('psRnd')};
    const lab={set_minutes:'最初のセット時間',set_unit_price:'セット1名単価',ext_minutes:'延長単位',ext_unit_price:'延長1名単価',service_rate:'サービス料率',tax_rate:'消費税率',total_round_unit:'合計の切り上げ単位'};
    for(const [k,x] of Object.entries(v)){ if(x==null||!Number.isFinite(x)||x<0){ await uiAlert(`${lab[k]}を0以上の数で入力してください`); return; } }
    for(const k of ['set_minutes','set_unit_price','ext_minutes','ext_unit_price','total_round_unit']) if(!Number.isInteger(v[k])){ await uiAlert(`${lab[k]}は整数で入力してください`); return; }
    if(!(v.set_minutes>0)||!(v.ext_minutes>0)){ await uiAlert('セット時間と延長単位は1分以上にしてください'); return; }
    if(v.service_rate>100||v.tax_rate>100){ await uiAlert('サービス料率・消費税率は100%までです'); return; }
    v.auto_hc_amount=$('psHc').value?Number($('psHc').value):null; v.auto_bc_amount=$('psBc').value?Number($('psBc').value):null;
    v.douhan_is_kakari=$('psDk').checked; v.cust_auto_kakari=$('psCk').checked;
    const vip=[]; for(const t of tables){ const tr=$('main').querySelector(`tr[data-tb="${t.id}"]`); if(!tr){ vip.push({id:t.id,set:0,ext:0}); continue; } // 表に無い卓は通常卓（0円）
      const a=slNum(tr.querySelector('[data-v=set]').value)??0, b=slNum(tr.querySelector('[data-v=ext]').value)??0;
      if(!Number.isInteger(a)||!Number.isInteger(b)||a<0||b<0){ await uiAlert(`${tr.cells[0].textContent} のVIP料金は0以上の整数で入力してください`); return; } vip.push({id:t.id,set:a,ext:b}); }
    if(!await uiConfirm('POS設定を保存しますか？\nPOS の次の伝票から変わります')) return;

// ---------- 打刻一覧 v0.23・SQL 063：日ごとの打刻と写真（見るだけ。打刻の修正は POS） ----------
let pcDate=null;
const PC_TYPES=[['douhan','同伴'],['clock_in','出勤'],['after','アフター'],['clock_out','退勤']];
PAGES.punches=async()=>{ const st=storeId; if(!pcDate) pcDate=businessDate(); const d=pcDate;
  const head=`<h1>打刻一覧 <small class="muted" style="font-weight:400">${esc(curStore()?.name||'')}</small></h1>

  $('main').innerHTML=head+'<div class="card muted">読み込み中…</div>';
  const wire=()=>{ $('pcDate').onchange=()=>{ if($('pcDate').value){ pcDate=$('pcDate').value; PAGES.punches(); } }; $('pcPrev').onclick=()=>{ pcDate=dayAdd(d,-1); PAGES.punches(); }; $('pcNext').onclick=()=>{ pcDate=dayAdd(d,1); PAGES.punches(); }; $('pcToday').onclick=()=>{ pcDate=businessDate(); PAGES.punches(); }; };
  const [ev,sf]=await Promise.all([ sb.from('attendance_events').select('staff_id,event_type,event_at,photo_path,is_corrected').eq('store_id',st).eq('business_date',d).order('event_at'),
    sb.from('staff').select('id,display_name,kind,sort_order').eq('store_id',st).order('sort_order').order('id') ]);
  if(page!=='punches'||storeId!==st||pcDate!==d) return;
  const er=ev.error||sf.error; if(er){ $('main').innerHTML=head+`<div class="card err">読み込めません：${esc(er.message)}</div>`; wire(); return; }
  const by={}; (ev.data||[]).forEach(e=>{ const o=by[e.staff_id]||(by[e.staff_id]={}); o[e.event_type]=e; });
  const people=(sf.data||[]).filter(x=>by[x.id]);
  const paths=(ev.data||[]).map(e=>e.photo_path).filter(Boolean); let urls={};
  if(paths.length){ const r=await sb.storage.from('selfies').createSignedUrls(paths,3600); (r.data||[]).forEach(x=>{ if(x.signedUrl) urls[x.path]=x.signedUrl; }); if(page!=='punches'||pcDate!==d) return; }
  const hm=t=>{ const x=new Date(t); return `${x.getHours()}:${String(x.getMinutes()).padStart(2,'0')}`; };

  $('main').innerHTML=head+(people.length?`<div class="cs-w"><table class="reg pc"><tr><th class="nm">名前</th>${PC_TYPES.map(([,n])=>`<th>${n}</th>`).join('')}</tr>
    ${people.map(p=>`<tr><td class="nm">${esc(p.display_name)}${p.kind==='hall'?' <small class="muted">黒服</small>':''}</td>${PC_TYPES.map(([k])=>`<td>${cell(by[p.id][k])}</td>`).join('')}</tr>`).join('')}</table></div>`
    :'<div class="card muted">この日の打刻はありません</div>')+`<div class="muted" style="font-size:13px;margin-top:10px">写真を押すと大きく出ます。打刻の修正は POS の在籍リストで行います</div>`;
  wire();
  $('main').querySelectorAll('[data-big]').forEach(im=>im.onclick=()=>{ const m=modal(`<img src="${esc(im.dataset.big)}" alt="" style="width:100%;border-radius:10px"><div class="bar"><button class="primary" data-k="ok">閉じる</button></div>`); m.querySelector('[data-k=ok]').onclick=()=>m.remove(); }); };
