      <td>${x.last_used_at?esc(fmtDT(x.last_used_at)):'—'}</td><td style="text-align:right;white-space:nowrap"><button class="ghost sm" data-tcre="${x.id}" data-l="${esc(x.label)}">再登録</button> <button class="ghost sm" data-tcdel="${x.id}" data-l="${esc(x.label)}">削除</button></td></tr>`).join('')||'<tr><td class="muted" colspan="4">まだありません</td></tr>'}</table>
    <div style="margin-top:10px;display:grid;grid-template-columns:auto 1fr auto;column-gap:10px;row-gap:4px;align-items:center"><span class="muted" style="font-size:13px">① タイムカード専用ID</span><span class="muted" style="font-size:13px">② 端末名</span><span></span>
      <span style="height:44px;display:flex;align-items:center">${tcHasId?'<span class="badge k">作成済</span>':'<button class="ghost" id="tcIdAdd">作成</button>'}</span><input id="tcLabel" placeholder="例：入口の iPad" maxlength="30" style="height:44px;margin:0"><button class="primary" id="tcAdd" style="height:44px">登録コード発行</button></div>`; /* v0.77：① と ② の見出しと中身の行をそろえる（オーナー「列がそろってない」） */
  /* v0.66・SQL 084：タイムカードの端末でログインするための ID（POS のデータは読めない・書けない）。作った ID とパスワードは上の「今のパスワード」に出る */
  const ia=$('tcIdAdd'); if(ia) ia.onclick=guard(ia,async()=>{ if(!await uiConfirm('タイムカード専用IDを作成しますか？','作成')) return;
    const x=await sb.rpc('admin_tc_account_create',{p_store:st}); if(x.error){ await uiAlert(/admin_tc_account_create/.test(x.error.message)?'SQL 084 が未実行です':x.error.message); return; }
    await uiAlert(`IDを作成しました\n\nログイン用メール：${x.data.email}\nパスワード：${x.data.pw}`); if(page==='pw') PAGES.pw(); });
  const show=(label,code)=>new Promise(res=>{ const m=modal(`<h2 style="margin:0">登録コード</h2><div>${esc(label)}</div><div class="tccode">${esc(code)}</div><div class="muted" style="font-size:14px">この端末のタイムカードを開いて入力してください（30分有効・1回だけ使えます）</div><div class="bar"><button class="primary" data-k="ok">閉じる</button></div>`); m.querySelector('[data-k=ok]').onclick=()=>{ m.remove(); res(); }; });
  const add=$('tcAdd'); add.onclick=guard(add,async()=>{ const lb=$('tcLabel').value.trim(); if(!lb){ await uiAlert('端末名を入力してください'); return; }
    const x=await rpc('admin_tc_code',{p_store:st,p_id:null,p_label:lb}); if(!x.ok) return; await show(lb,x.data.code); tcCard(); });
  box.querySelectorAll('[data-tcre]').forEach(b=>b.onclick=guard(b,async()=>{ if(!await uiConfirm(`${b.dataset.l} を再登録しますか？\n今の登録は無効になり、新しい登録コードを入れるまで、この端末では打刻できません`)) return;
    const x=await rpc('admin_tc_code',{p_store:st,p_id:b.dataset.tcre,p_label:null}); if(!x.ok) return; await show(b.dataset.l,x.data.code); tcCard(); }));
  box.querySelectorAll('[data-tcdel]').forEach(b=>b.onclick=guard(b,async()=>{ if(!await uiConfirm(`${b.dataset.l} を削除しますか？\nこの端末では打刻できなくなります`,'削除','danger')) return;
    const x=await rpc('admin_tc_delete',{p_id:b.dataset.tcdel}); if(!x.ok) return; toast('削除しました'); tcCard(); })); }

// ---------- 表示設定（オーナー） ----------
PAGES.o_perms=()=>{
  const s=stSet(); const perms={...(s.perms||{})}; if(!perms.pl&&(perms.pl_day||perms.pl_month)) perms.pl=perms.pl_day||perms.pl_month; if(!perms.register&&perms.register_month) perms.register=perms.register_month;
  const rows=SCREENS.map(x=>x.grp?`<tr><th colspan="2" style="padding-top:14px;color:var(--ink);font-weight:700">${esc(x.grp)}</th></tr>`
    :`<tr class="pr"><td>${esc(x.n)}</td><td style="text-align:right"><span class="seg" data-pk="${x.k}">${['none','view','edit'].map(v=>`<button data-v="${v}" class="${(perms[x.k]||'none')===v?'on':''}">${PERM_LABEL[v]}</button>`).join('')}</span></td></tr>`).join('');
  $('main').innerHTML=`<h1>表示設定 <small class="muted" style="font-weight:400">${esc(curStore()?.name||'')}</small></h1>
  <div class="card"><h2>オーナー以外の人が使える画面</h2><div class="muted" style="font-size:14px;margin-bottom:8px">この店舗のオーナー以外の人、全員に同じ設定が使われます。オーナーはいつでも全部の画面を使えます</div>
  <table class="t perm">${rows}</table></div>
  <div class="row"><button class="primary" id="permSave">保存</button></div>`;
  $('main').querySelectorAll('.seg').forEach(g=>g.querySelectorAll('button').forEach(b=>b.onclick=()=>{ perms[g.dataset.pk]=b.dataset.v; g.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b)); }));
  $('permSave').onclick=guard($('permSave'),async()=>{
    const n=Number(s.nippo_days??3); // v0.40：日報登録をなくしたので「日報のさかのぼり」は出さない（前の値をそのまま送る）
    const clean={}; SCREENS.forEach(x=>{ if(x.k&&perms[x.k]&&perms[x.k]!=='none') clean[x.k]=perms[x.k]; });
    const r=await rpc('admin_save_store_settings',{p_store:storeId,p_perms:clean,p_nippo_days:n}); if(!r.ok) return;
    me=await loadMe()||me; toast('保存しました'); renderNav(); });
};

// ---------- 顧客情報の共有（オーナー）v0.06・SQL 048 ----------
// 「共有する」にした店舗どうしで、お客様の基本情報・来店履歴・キープ中のボトル（閲覧のみ）を見せ合う。「しない」に戻してもデータは消えない
PAGES.o_share=()=>{
  const on=id=>!!me?.settings?.[id]?.cust_share;
  $('main').innerHTML=`<h1>顧客情報の共有</h1>
  <div class="card"><div class="muted hint" style="font-size:14px;margin-bottom:8px">「共有する」にした店舗どうしで、お客様の情報を見せ合います<button type="button" class="qm" aria-label="詳しく">？</button><div class="more">「共有する」にした店舗どうしで、お客様の基本情報（閲覧・編集）・来店履歴・キープ中のボトル（閲覧のみ）を共有します。${KL}はそれぞれの店舗で決めます。<br>「しない」に戻しても、データは消えません（ほかの店舗から見えなくなるだけです）</div></div>
  <table class="t">${stores().map(st=>`<tr><td>${esc(st.name)}</td><td style="text-align:right"><span class="seg" data-st="${st.id}">${[[true,'共有する'],[false,'しない']].map(([v,n])=>`<button data-v="${v}" class="${on(st.id)===v?'on':''}">${n}</button>`).join('')}</span></td></tr>`).join('')}</table></div>`;
  $('main').querySelectorAll('.seg').forEach(g=>g.querySelectorAll('button').forEach(b=>b.onclick=guard(b,async()=>{
    const v=b.dataset.v==='true', st=stores().find(x=>x.id===g.dataset.st); if(on(st.id)===v) return;
    if(!await uiConfirm(v?`${st.name} の顧客情報を「共有する」にしますか？\n「共有する」のほかの店舗から見えるようになります`:`${st.name} の顧客情報を「しない」にしますか？\nデータは消えません。ほかの店舗から見えなくなります`)) return;
    const r=await rpc('admin_set_cust_share',{p_store:st.id,p_on:v}); if(!r.ok) return;
    me=await loadMe()||me; toast('保存しました'); PAGES.o_share(); })));
};

// ---------- 管理サイトのID（オーナー） ----------
PAGES.o_ids=async()=>{
  $('main').innerHTML=`<h1>管理サイトのID</h1><div class="card muted">読み込み中…</div>`;
  const [ra,rh]=await Promise.all([sb.rpc('admin_accounts_list'),sb.rpc('admin_hall_staff',{p_store:storeId})]);
  if(page!=='o_ids') return;
  if(ra.error||rh.error){ $('main').innerHTML=`<h1>管理サイトのID</h1><div class="card err">${esc((ra.error||rh.error).message)}</div>`; return; }
  const halls=rh.data||[], sName=id=>stores().find(s=>s.id===id)?.name||'';
  const list=(ra.data||[]).filter(a=>a.is_owner||a.store_id===storeId);
  $('main').innerHTML=`<h1>管理サイトのID <small class="muted" style="font-weight:400">${esc(curStore()?.name||'')}</small></h1>
  <div class="card"><h2>IDの一覧</h2><table class="t"><tr><th>ID</th><th>名前</th><th>店舗</th><th>黒服</th><th>状態</th><th></th></tr>
  ${list.map(a=>`<tr><td><b>${esc(a.login_id)}</b></td><td>${esc(a.name)}</td><td>${a.is_owner?'全店舗':esc(sName(a.store_id))}</td><td>${esc(a.staff_name||'—')}</td>
    <td>${a.is_owner?'<span class="badge">オーナー</span>':a.is_active?'使える':'<span class="badge gray">停止中</span>'}</td>
    <td style="text-align:right">${a.is_owner?'':`<button class="ghost sm" data-ed="${a.id}">変更</button>`}</td></tr>`).join('')}
  </table></div>
  <div class="card"><h2>IDの作成</h2>
    <div class="grid2">
      <label>ID（半角の小文字・数字 3〜20文字）<input id="nId" autocapitalize="off" spellcheck="false"></label>
      <label>名前<input id="nName"></label>
      <label>黒服と結びつける<select id="nStaff"><option value="">結びつけない</option>${halls.map(h=>`<option value="${h.id}">${esc(h.name)}</option>`).join('')}</select></label>
      <label>最初のパスワード（8文字以上）<input id="nPw" autocapitalize="off" spellcheck="false"></label>
    </div>
    <div class="row" style="margin-top:10px"><button class="ghost" id="nGen">パスワードを自動作成</button><button class="primary" id="nSave">作成</button></div>
    <div class="muted hint" style="font-size:14px;margin-top:8px">黒服と結びつけると、POSでその黒服を削除した時に、このIDも自動で使えなくなります<button type="button" class="qm" aria-label="詳しく">？</button><div class="more">店舗は上で選んでいる「${esc(curStore()?.name||'')}」になります</div></div>
  </div>`;
  $('nGen').onclick=()=>{ $('nPw').value=genPw(10); };
  $('nSave').onclick=guard($('nSave'),async()=>{
    const id=$('nId').value.trim().toLowerCase(), pw=$('nPw').value;
    if(!/^[a-z0-9_-]{3,20}$/.test(id)){ await uiAlert('IDは半角の小文字・数字で3〜20文字にしてください'); return; }
    if(pw.length<8){ await uiAlert('パスワードは8文字以上にしてください'); return; }
    const r=await rpc('admin_account_create',{p_login:id,p_pw:pw,p_name:$('nName').value.trim(),p_store:storeId,p_staff:$('nStaff').value||null}); if(!r.ok) return;
    await uiAlert(`IDを作成しました\n\nID：${id}\nパスワード：${pw}\n\n本人に伝えてください`); PAGES.o_ids(); });
  $('main').querySelectorAll('[data-ed]').forEach(b=>b.onclick=()=>editAccount(list.find(a=>a.id===b.dataset.ed),halls));
};
async function editAccount(a,halls){ if(!a) return;
  const m=modal(`<h2 style="margin:0">IDの変更：${esc(a.login_id)}</h2>
    <label>名前<input data-k="name" value="${esc(a.name)}"></label>
    <label>黒服と結びつける<select data-k="staff"><option value="">結びつけない</option>${halls.map(h=>`<option value="${h.id}" ${h.id===a.staff_id?'selected':''}>${esc(h.name)}</option>`).join('')}${a.staff_id&&!halls.some(h=>h.id===a.staff_id)?`<option value="${a.staff_id}" selected>${esc(a.staff_name||'（削除済の黒服）')}</option>`:''}</select></label>
    <label>状態<select data-k="active"><option value="1" ${a.is_active?'selected':''}>使える</option><option value="0" ${a.is_active?'':'selected'}>停止（ログイン不可）</option></select></label>
    <div class="bar"><button class="ghost" data-k="no">キャンセル</button><button class="primary" data-k="ok">保存</button></div>`);
  const q=k=>m.querySelector(`[data-k=${k}]`);
  q('no').onclick=()=>m.remove();
  q('ok').onclick=guard(q('ok'),async()=>{ const act=q('active').value==='1';
    if(a.is_active&&!act&&!await uiConfirm(`「${a.login_id}」を停止します。ログイン中でもすぐに使えなくなります`,'停止','danger')) return;
    const r=await rpc('admin_account_update',{p_id:a.id,p_name:q('name').value.trim(),p_staff:q('staff').value||null,p_active:act}); if(!r.ok) return;
    m.remove(); toast('保存しました'); PAGES.o_ids(); });
}

// ---------- パスワード ----------
PAGES.pw=async()=>{
  if(!me.is_owner){ PAGES.none(); return; }
  const own=`<div class="card"><h2>自分のパスワード（ID：${esc(me.login_id)}）</h2>
    <div class="grid2"><label>新しいパスワード（8文字以上）<input id="myPw1" type="password" autocomplete="new-password"></label><label>再入力<input id="myPw2" type="password" autocomplete="new-password"></label><div><button class="primary" id="mySave" style="width:100%">変更</button></div></div>
    <div class="muted" style="font-size:14px;margin-top:8px">変更すると、ほかの端末でこのIDでログインしている分はログアウトされます</div></div>`;
  $('main').innerHTML=`<h1>パスワード <small class="muted" style="font-weight:400">${esc(curStore()?.name||'')}</small></h1>${own}<div class="card muted">読み込み中…</div>`; bindOwn();
  const [r,ta]=await Promise.all([sb.rpc('admin_credentials',{p_store:storeId}), sb.rpc('admin_tc_accounts',{p_store:storeId})]); if(page!=='pw') return;
  const TA={}; if(!ta.error) (ta.data||[]).forEach(x=>{ TA[x.user_id]=x; }); /* v0.73・SQL 089：タイムカード専用ID は、ログインした日時と「削除」を出す */
  if(r.error){ $('main').lastElementChild.outerHTML=`<div class="card err">${esc(r.error.message)}</div>`; return; }
  const d=r.data||{}; tcHasId=(d.devices||[]).some(x=>x.label==='タイムカード専用');
  const pwCell=pw=>pw?`<span class="pwv" data-pwv="${esc(pw)}">••••••••</span> <button class="ghost sm eye" data-show aria-label="表示"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg></button>`:'<small class="muted">変更すると表示されます</small>';
  const O=true; // v0.21：この画面はオーナーだけ（SQL 061 で関数もオーナーだけにする）
  const row=(label,sub,key,pw,extra)=>`<tr><td>${label}${sub?`<br><small class="muted">${sub}</small>`:''}</td><td>${pwCell(pw)}</td><td style="text-align:right;white-space:nowrap">${extra||''}${O?`<button class="ghost sm" data-pw="${esc(key)}" data-label="${esc(label.replace(/<[^>]*>/g,''))}">変更</button>`:''}</td></tr>`;
  $('main').lastElementChild.outerHTML=(O?`
  <div class="card"><div class="row" style="justify-content:space-between;gap:10px;align-items:center"><div style="font-size:14px;line-height:1.7">更新されるもの：POS・タイムカードの端末／タイムカード専用ID／顧客サイト（閲覧用・編集用）<br><span class="muted">黒服が辞めた時に使います。管理サイトのIDは変わりません</span></div><button class="danger" id="rotAll" style="flex:none">全パスワード更新</button></div></div>`:'')+`
  <div class="card"><h2>今のパスワード</h2><div class="muted" style="font-size:14px;margin-bottom:6px">「変更」で、任意のパスワードに変更できます（自動作成も可）</div><table class="t">
    <tr><th>どこの</th><th>パスワード</th><th></th></tr>
    ${(d.devices||[]).map(x=>{ const t=TA[x.user_id]; return row(x.label==='タイムカード専用'?'タイムカード専用ID':`POS・タイムカード：${esc(x.label||'端末')}`,`ログイン用メール ${esc(x.email||'')}`+(t?`／ログイン：${t.last_sign_in_at?esc(fmtDT(t.last_sign_in_at)):'なし'}`:''),`dev:${x.user_id}`,x.pw,t?`<button class="ghost sm" data-tcid="${esc(x.user_id)}" data-em="${esc(x.email||'')}">削除</button> `:''); }).join('')||'<tr><td class="muted" colspan="3">POS・タイムカードの端末がありません</td></tr>'}
    ${(d.cs||[]).map(x=>row(esc(CS_KIND[x.kind]||x.kind),'',`cs:${x.kind}`,x.pw)).join('')}
    ${(d.accounts||[]).map(x=>row(`管理サイト：${esc(x.login_id)}`,esc(x.name)+(x.is_owner&&x.name!=='オーナー'?'（オーナー）':'')+(x.is_active?'':'（停止中）'),x.login_id===me.login_id?'own:':`acc:${x.id}`,x.pw)).join('')}
  </table></div>`;
  $('main').querySelectorAll('[data-tcid]').forEach(b=>b.onclick=guard(b,async()=>{ if(!await uiConfirm(`タイムカード専用ID（${b.dataset.em}）を削除しますか？\nこのIDでログインしている端末は使えなくなります`,'削除','danger')) return;
    const x=await rpc('admin_tc_account_delete',{p_user:b.dataset.tcid}); if(!x.ok) return; toast('削除しました'); PAGES.pw(); }));
  $('main').querySelectorAll('[data-show]').forEach(b=>b.onclick=()=>{ const v=b.previousElementSibling; const on=!b.classList.contains('on'); v.textContent=on?v.dataset.pwv:'••••••••'; b.classList.toggle('on',on); b.innerHTML=on?EYEOFF:EYE; b.setAttribute('aria-label',on?'非表示':'表示'); });
  $('main').insertAdjacentHTML('beforeend','<div class="card" id="tcBox"><h2>タイムカードの端末</h2><div class="muted">読み込み中…</div></div>'); tcCard();
  if(O) $('rotAll').onclick=guard($('rotAll'),()=>rotateAll());
  $('main').querySelectorAll('[data-pw]').forEach(b=>b.onclick=()=>{ if(b.dataset.pw==='own:'){ $('myPw1').focus(); window.scrollTo(0,0); return; } changeOne(b.dataset.pw,b.dataset.label); });
};
function bindOwn(){ $('mySave').onclick=guard($('mySave'),async()=>{
  const a=$('myPw1').value, b=$('myPw2').value;
  if(a.length<8){ await uiAlert('パスワードは8文字以上にしてください'); return; }
  if(a!==b){ await uiAlert('2つのパスワードが違います'); return; }
  const r=await rpc('admin_set_own_pw',{p_pw:a}); if(!r.ok) return;
  $('myPw1').value=''; $('myPw2').value=''; toast('パスワードを変更しました'); if(page==='pw') PAGES.pw(); }); }
async function changeOne(key,label){
  const [kind,id]=[key.slice(0,key.indexOf(':')),key.slice(key.indexOf(':')+1)];
  const m=modal(`<h2 style="margin:0">パスワードの変更</h2><div>${esc(label)}</div>
    <label>新しいパスワード（8文字以上）<input data-k="pw" autocapitalize="off" spellcheck="false"></label>
    <div class="muted" style="font-size:14px">${kind==='acc'?'このIDでログインしている分はログアウトされます':'この端末・サイトでログインしている分は全部ログアウトされます'}</div>
    <div class="bar"><button class="ghost" data-k="gen">自動作成</button><button class="ghost" data-k="no">キャンセル</button><button class="primary" data-k="ok">変更</button></div>`);
  const q=k=>m.querySelector(`[data-k=${k}]`);
  q('gen').onclick=()=>{ q('pw').value=genPw(10); };
  q('no').onclick=()=>m.remove();
  q('ok').onclick=guard(q('ok'),async()=>{ const pw=q('pw').value;
    if(pw.length<8){ await uiAlert('パスワードは8文字以上にしてください'); return; }
    const r= kind==='dev'?await rpc('admin_set_device_pw',{p_user:id,p_pw:pw})
           : kind==='cs'?await rpc('admin_set_cs_pw',{p_store:storeId,p_kind:id,p_pw:pw})
           : await rpc('admin_set_account_pw',{p_id:id,p_pw:pw});
    if(!r.ok) return; m.remove(); toast('変更しました'); PAGES.pw(); });
}

kReg(PL_COLS,SLIDE_DEF,ST_BASIS,KS_COLS,BL_COLS,HI_KJ);
start();
</script>
