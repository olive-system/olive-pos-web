<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>OLIVE タイムカード</title>
<style>
  :root{
    --bg:#f6f5f2; --card:#fff; --ink:#1a1a1a; --muted:#7a7a7a; --line:#e3e1dc;
    --douhan:#e0a32a; --after:#7b61c9; --in:#3f9d5a; --out:#d9534f;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;overflow:hidden}
  #app{height:100%;display:flex;flex-direction:column;padding:18px 28px;gap:16px}

  .top{display:flex;align-items:center;justify-content:space-between}
  .store{font-size:18px;color:var(--muted);letter-spacing:.05em}
  .clock{font-size:64px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.02em;line-height:1}
  .date{font-size:16px;color:var(--muted)}

  .cam{align-self:center;width:300px;height:170px;border-radius:14px;overflow:hidden;background:#111;position:relative;border:2px solid var(--line)}
  .cam video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
  .cam .hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;background:rgba(0,0,0,.45)}

  .types{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .type{height:64px;border:none;border-radius:32px;color:#fff;font-size:22px;font-weight:700;opacity:.45;transition:opacity .15s,transform .1s}
  .type.on{opacity:1;transform:scale(1.04);box-shadow:0 6px 18px rgba(0,0,0,.2)}
  /* 2026-09-27：未選択の時はボタンをはっきりした色で見せて「先にここを押す」と分かるようにする。選んだら他を薄く、名前は選んだ色の枠になる */
  .types:not(.picked) .type{opacity:1;animation:invite 1.8s ease-in-out infinite}
  @keyframes invite{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
  .types.picked .type:not(.on){opacity:.3}
  .grid:not(.locked) .staff{border:2px solid var(--sel,var(--line));color:var(--sel,var(--ink))}
  .grid.locked .staff{color:#b5b5b5}
  .type.douhan{background:var(--douhan)} .type.after{background:var(--after)}
  .type.in{background:var(--in)} .type.out{background:var(--out)}

  .guide{text-align:center;color:var(--muted);font-size:16px;height:20px}
  .guide.warn{color:var(--out);font-weight:700;animation:shake .4s}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

  .grid{flex:1;display:grid;grid-template-columns:repeat(6,1fr);gap:12px;align-content:start;overflow:auto;transition:opacity .2s}
  .staff{height:64px;border:1px solid var(--line);border-radius:12px;background:var(--card);font-size:22px;font-weight:600}
  .staff:active{background:#eee}
  .staff.hall{border-color:#bbb;background:#fafafa}
  .grid.locked{opacity:.35}
  .grid.busy{pointer-events:none;opacity:.5}

  /* ---- 通常トースト（出勤・退勤） ---- */
  .toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:#1a1a1a;color:#fff;padding:26px 40px;border-radius:18px;font-size:30px;font-weight:700;display:none;z-index:20;text-align:center;line-height:1.4}
  .toast.show{display:block}
  .toast small{display:block;font-size:16px;font-weight:400;opacity:.8;margin-top:8px}

  /* ---- 演出オーバーレイ ---- */
  .fx{position:fixed;inset:0;z-index:25;display:none;align-items:center;justify-content:center;overflow:hidden}
  .fx.show{display:flex}
  .fx .msg{position:relative;z-index:2;text-align:center;color:#fff;text-shadow:0 4px 24px rgba(0,0,0,.35)}
  .fx .msg .big{font-size:76px;font-weight:800;letter-spacing:.04em;animation:pop .6s cubic-bezier(.2,1.4,.4,1)}
  .fx .msg .name{font-size:34px;font-weight:700;margin-top:10px;animation:rise .8s .15s both}
  .fx .msg .sub{font-size:22px;margin-top:8px;opacity:.9;animation:rise .8s .3s both}
  @keyframes pop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
  @keyframes rise{0%{transform:translateY(16px);opacity:0}100%{transform:translateY(0);opacity:1}}

  /* 同伴の準備時間の警告 */
  .fx.late{background:#c62828}
  .fx.late .msg{padding:0 40px}
  .fx.late .msg .big{font-size:44px;line-height:1.35}
  .fx.late .msg .sub{font-size:26px;margin-top:18px;line-height:1.5}
  .fx.late button{margin-top:36px;height:64px;padding:0 48px;border:none;border-radius:32px;background:#fff;color:#c62828;font-size:22px;font-weight:700}
  /* 同伴：キラキラ＋紙吹雪 */
  .fx.douhan{background:radial-gradient(circle at 50% 40%,#ffd86b 0%,#f5a623 45%,#d97706 100%)}
  .spark{position:absolute;width:14px;height:14px;background:#fff;clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%);animation:twinkle 1.2s ease-in-out infinite}
  @keyframes twinkle{0%,100%{transform:scale(.2) rotate(0);opacity:0}50%{transform:scale(1.3) rotate(45deg);opacity:1}}
  .confetti{position:absolute;top:-20px;width:10px;height:18px;border-radius:2px;animation:fall linear forwards}
  @keyframes fall{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(110vh) rotate(720deg);opacity:.8}}

  /* アフター：夜空＋流れ星＋月 */
  .fx.after{background:linear-gradient(180deg,#1b1740 0%,#3a2f78 60%,#5b48a8 100%)}
  .moon{position:absolute;right:12%;top:12%;width:110px;height:110px;border-radius:50%;background:#fff5c9;box-shadow:0 0 60px 20px rgba(255,245,201,.45);animation:glow 2.4s ease-in-out infinite}
  @keyframes glow{0%,100%{box-shadow:0 0 60px 20px rgba(255,245,201,.35)}50%{box-shadow:0 0 90px 30px rgba(255,245,201,.6)}}
  .star{position:absolute;width:4px;height:4px;background:#fff;border-radius:50%;animation:blink ease-in-out infinite}
  @keyframes blink{0%,100%{opacity:.2}50%{opacity:1}}
  .shoot{position:absolute;width:160px;height:2px;background:linear-gradient(90deg,#fff,transparent);transform:rotate(-30deg);animation:shoot 1.6s ease-out forwards}
  @keyframes shoot{0%{transform:translate(0,0) rotate(-30deg);opacity:0}10%{opacity:1}100%{transform:translate(-500px,300px) rotate(-30deg);opacity:0}}
  .heart{position:absolute;bottom:-40px;font-size:28px;animation:float linear forwards}
  @keyframes float{0%{transform:translateY(0) scale(.6);opacity:0}15%{opacity:1}100%{transform:translateY(-110vh) scale(1.1);opacity:0}}

  /* login */
  .login{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:30}
  .login form{width:360px;background:var(--card);padding:32px;border-radius:16px;border:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
  .login h1{margin:0 0 8px;font-size:20px}
  .login input{font-size:18px;padding:12px;border:1px solid var(--line);border-radius:8px}
  .login button{font-size:18px;padding:12px;border:none;border-radius:8px;background:var(--ink);color:#fff}
  .err{color:var(--out);font-size:14px;min-height:18px}
  .hidden{display:none!important}
  /* 15番：入力欄の高さは全部 44px */
  input:not([type=checkbox]):not([type=radio]):not([type=file]):not([type=range]):not([type=color]),select{height:44px!important;min-height:44px;box-sizing:border-box;padding-top:0!important;padding-bottom:0!important}
</style>
</head>
<body>
<div class="login" id="login">
  <form id="loginForm">
    <h1>店舗端末ログイン</h1>
    <input id="email" type="email" placeholder="端末メールアドレス" autocomplete="username" required>
    <input id="pw" type="password" placeholder="パスワード" autocomplete="current-password" required>
    <button type="submit">ログイン</button>
    <div class="err" id="loginErr"></div>
  </form>
</div>
<!-- 2026-10-02・SQL 063：登録した端末だけ打刻できる。管理サイト（オーナー）の「パスワード」画面で発行した登録コードを、この端末で1回入れる -->
<div class="login hidden" id="reg">
  <form id="regForm">
    <h1>この端末を登録</h1>
    <div style="font-size:15px;color:var(--muted);line-height:1.6">管理サイトの「パスワード」画面で発行した登録コード（6けた）を入力してください</div>
    <input id="regCode" inputmode="numeric" autocomplete="off" maxlength="6" placeholder="登録コード">
    <button type="submit">登録する</button>
    <div class="err" id="regErr"></div>
  </form>
</div>

<div id="app" class="hidden">
  <div class="top">
    <div class="store" id="storeName">—</div>
    <div class="clock" id="clock">--:--:--</div>
    <div class="date" id="date">—</div>
  </div>

  <div class="cam" id="cam">
    <video id="video" autoplay playsinline muted></video>
    <div class="hint" id="camHint">カメラ準備中…</div>
  </div>

  <div class="types">
    <button class="type in"     data-type="clock_in">出勤</button>
    <button class="type out"    data-type="clock_out">退勤</button>
    <button class="type after"  data-type="after">アフター</button>
  </div>

  <div class="guide" id="guide">まず上のボタンを選んでください</div>

  <div class="grid locked" id="grid"></div>
</div>

<div class="toast" id="toast"></div>
<div class="fx" id="fx"><div class="msg" id="fxMsg"></div></div>
<canvas id="canvas" class="hidden"></canvas>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0"></script>
<script>
const SUPABASE_URL = 'https://gjqaxenwvvazhjtziusf.supabase.co';
const SUPABASE_KEY = 'sb_publishable_pPfJUvJd6iJeHBNiD7XkWA_2RKF7JYw';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
// 名前などを画面に入れる時は、タグとして動かないように必ずこれを通す
const esc=t=>String(t??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');

const TYPE_LABEL = { douhan:'同伴', after:'アフター', clock_in:'出勤', clock_out:'退勤' };
let currentType = null;   // 未選択が初期状態
let store = null;
let busy = false;

// ---------- clock ----------
function tick(){
  const d = new Date();
  const p = n => String(n).padStart(2,'0');
  document.getElementById('clock').textContent = `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
  document.getElementById('date').textContent =
    `${d.getFullYear()}/${p(d.getMonth()+1)}/${p(d.getDate())} (${'日月火水木金土'[d.getDay()]})`;
}
setInterval(tick, 1000); tick();

// ---------- login ----------
document.getElementById('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const err = document.getElementById('loginErr'); err.textContent = '';
  const { error } = await sb.auth.signInWithPassword({
    email: document.getElementById('email').value.trim(),
    password: document.getElementById('pw').value
  });
  if (error) { err.textContent = 'ログインできません：' + error.message; return; }
  start();
});

const TC_KEY = 'olive_tc_terminal';
const tcGet = () => { try { return localStorage.getItem(TC_KEY); } catch(e) { return null; } };
const tcSet = v => { try { v == null ? localStorage.removeItem(TC_KEY) : localStorage.setItem(TC_KEY, v); } catch(e) {} };
function showReg(msg){ document.getElementById('app').classList.add('hidden'); document.getElementById('reg').classList.remove('hidden');
  document.getElementById('regErr').textContent = msg || ''; document.getElementById('regCode').value = ''; }
document.getElementById('regForm').addEventListener('submit', async e => {
  e.preventDefault();
  const err = document.getElementById('regErr'); err.textContent = '';
  const code = document.getElementById('regCode').value.trim();
  if (!/^\d{6}$/.test(code)) { err.textContent = '登録コードは6けたの数字です'; return; }
  const { data, error } = await sb.rpc('tc_register', { p_code: code });
  if (error) { err.textContent = error.message; return; }
  tcSet(data.token); document.getElementById('reg').classList.add('hidden'); start();
});

async function start(){
  const { data:{ session } } = await sb.auth.getSession();
  if (!session) return;
  document.getElementById('login').classList.add('hidden');
  { const { data, error } = await sb.rpc('tc_check', { p_token: tcGet() || '' });
    if (error) { showReg(/tc_check/.test(error.message) ? 'SQL 063 が未実行です' : error.message); return; }
    if (!data || !data.ok) { tcSet(null); showReg(); return; } }
  document.getElementById('app').classList.remove('hidden');
  const { data: stores } = await sb.from('stores').select('id,name').limit(1);
  store = stores?.[0] || null;
  document.getElementById('storeName').textContent = store ? store.name : '店舗未設定';
  await loadStaff();
  initCamera();
  rtSub();
}

// ---------- リアルタイム（SQL 067）：管理サイト・POS で店名やスタッフが変わったら、すぐ出し直す（打刻の途中は終わってから）。つながらない時は今までどおり ----------
let rtCh = null, rtT = 0;
function rtSub(){
  if (rtCh || !store) return;
  try { rtCh = sb.channel('olive:' + store.id).on('broadcast', { event:'chg' }, m => {
    if ((m.payload || {}).kind !== 'settings') return; clearTimeout(rtT); rtT = setTimeout(rtReload, 1500); }).subscribe(); }
  catch (e) { console.warn('realtime', e); }
}
async function rtReload(){
  if (busy) { clearTimeout(rtT); rtT = setTimeout(rtReload, 3000); return; }
  const { data } = await sb.from('stores').select('id,name').limit(1);
  if (data && data[0]) { store = data[0]; document.getElementById('storeName').textContent = store.name; }
  if (!busy) await loadStaff();
}

// ---------- staff ----------
async function loadStaff(){
  // SQL 085：スタッフの名前は関数 tc_staff から（タイムカード専用の ID は表を直接読めない）。関数が無い時は今までどおり表から
  let { data, error } = await sb.rpc('tc_staff');
  if (error || !Array.isArray(data)) ({ data, error } = await sb.from('staff')
    .select('id,display_name,kind,is_trial,kakari_only,no_timecard,created_at').eq('is_active', true).order('sort_order'));
  const grid = document.getElementById('grid'); grid.innerHTML = '';
  if (error) { grid.textContent = 'スタッフ取得エラー：' + error.message; return; }
  // 体験キャストは1日限り：登録した営業日（朝8時区切り）の翌営業日からは表示しない
  const bdOf = d => { const x = new Date(d.getTime() - 8*3600*1000); return x.getFullYear()*10000 + (x.getMonth()+1)*100 + x.getDate(); };
  const todayBd = bdOf(new Date());
  for (const s of data) {
    if (s.kakari_only || s.no_timecard) continue; // 係専用（店・ママなど）と「タイムカードを打たない」人は出さない
    if (s.is_trial) continue;
    const b = document.createElement('button');
    b.className = 'staff' + (s.kind === 'hall' ? ' hall' : '');
    b.textContent = s.display_name;
    b.onclick = () => onStaffTap(s);
    grid.appendChild(b);
  }
}

// ---------- type select ----------
function setType(t){
  currentType = t;
  document.querySelectorAll('.type').forEach(x => x.classList.toggle('on', x.dataset.type === t));
  document.querySelector('.types').classList.toggle('picked', !!t);
  document.getElementById('grid').style.setProperty('--sel', t==='clock_in'?'var(--in)':t==='clock_out'?'var(--out)':t==='after'?'var(--after)':'var(--line)');
  const g = document.getElementById('guide');
  g.classList.remove('warn');
  document.getElementById('grid').classList.toggle('locked', !t);
  g.textContent = t ? `「${TYPE_LABEL[t]}」を選択中　→ 名前をタップ` : 'まず上のボタンを選んでください';
}
document.querySelectorAll('.type').forEach(b => { b.onclick = () => setType(b.dataset.type); });

function onStaffTap(staff){
  if (!currentType) {
    const g = document.getElementById('guide');
    g.textContent = '⚠️ 先に「出勤 / 退勤 / アフター」を選んでください';
    g.classList.remove('warn'); void g.offsetWidth; g.classList.add('warn');
    return;
  }
  punch(staff);
}

// ---------- camera ----------
async function initCamera(){
  const hint = document.getElementById('camHint');
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:'user', width:640, height:480 }, audio:false });
    document.getElementById('video').srcObject = stream;
    hint.classList.add('hidden');
  } catch (e) { hint.textContent = 'カメラを許可してください'; }
}
function capture(){
  const v = document.getElementById('video');
  if (!v.videoWidth) return null;
  const c = document.getElementById('canvas');
  c.width = 480; c.height = Math.round(480 * v.videoHeight / v.videoWidth);
  c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
  return new Promise(res => c.toBlob(res, 'image/jpeg', 0.8));
}

// ---------- punch ----------
async function punch(staff){
  if (busy) return;
  busy = true;
  const type = currentType;
  document.getElementById('grid').classList.add('busy');
  try {
    let photoPath = null;
    const blob = await capture();
    if (!blob) { await showToast('写真が撮れません', 'カメラを許可してから、再度押してください', 3000); return; }
    {
      const d = new Date();
      photoPath = `${store?.id || 'store'}/${d.toISOString().slice(0,10)}/${staff.id}_${type}_${d.getTime()}.jpg`;
      const { error: upErr } = await sb.storage.from('selfies').upload(photoPath, blob, { contentType:'image/jpeg' });
      if (upErr) { console.warn('upload failed', upErr); await showToast('写真を保存できません', '通信を確認して、再度押してください', 3000); return; }
    }
    const { error } = await sb.rpc('punch', { p_staff_id: staff.id, p_type: type, p_photo: photoPath, p_terminal: tcGet() || '' });
    if (error && /登録されていません/.test(error.message)) { tcSet(null); showReg('この端末の登録が削除されました。登録コードを再入力してください'); return; }
    if (error) throw error;

    if (type === 'douhan')      await fxDouhan(staff.display_name);
    else if (type === 'after')  await fxAfter(staff.display_name);
    else { await showToast(`${esc(staff.display_name)}　${TYPE_LABEL[type]}`, photoPath ? '記録しました' : '記録しました（写真なし）', 1500);
      if (type === 'clock_in') await checkDouhanLate(staff); }
  } catch (e) {
    showToast('エラー', e.message || String(e), 2500);
  } finally {
    busy = false;
    document.getElementById('grid').classList.remove('busy');
    setType(null);   // 毎回、未選択に戻す
  }
}

function showToast(main, sub, ms){
  const t = document.getElementById('toast');
  t.innerHTML = `${main}<small>${sub}</small>`;
  t.classList.add('show');
  return new Promise(r => setTimeout(() => { t.classList.remove('show'); r(); }, ms));
}

// ---------- 同伴の準備時間チェック（同伴は会計の伝票で付ける。伝票の立ち上げ〜出勤打刻が設定分数を超えたら本人に警告。打刻は止めない） ----------
async function checkDouhanLate(staff){
  try {
    // SQL 085：関数 tc_douhan（決めた分数と、同伴の伝票を立ち上げてからの分数）。関数が無い時は今までどおり表から
    const rd = await sb.rpc('tc_douhan', { p_staff: staff.id });
    if (!rd.error) { const lim = Number(rd.data?.limit ?? 10); if (lim > 0 && rd.data?.mins != null && rd.data.mins > lim) await fxLate(lim); return; }
    let q = sb.from('pos_settings').select('douhan_punch_limit_min');
    if (store?.id) q = q.eq('store_id', store.id);
    const st = await q.limit(1);
    const limit = Number(st.data?.[0]?.douhan_punch_limit_min ?? 10);
    if (!(limit > 0)) return;
    const since = new Date(Date.now() - 20*3600*1000).toISOString();
    const { data, error } = await sb.from('bill_casts').select('role, bills!inner(opened_at,status)').eq('staff_id', staff.id).in('role', ['douhan1','douhan2','douhan']).neq('bills.status','void').gte('bills.opened_at', since);
    if (error || !data?.length) return;
    const first = Math.min(...data.map(r => new Date(r.bills.opened_at).getTime()));
    const mins = Math.floor((Date.now() - first) / 60000);
    if (mins <= limit) return;
    await fxLate(limit);
  } catch (e) { console.warn('douhan check failed', e); }
}
function fxLate(limit){
  const fx = document.getElementById('fx');
  fx.className = 'fx show late';
  fx.querySelectorAll(':scope > :not(.msg)').forEach(n => n.remove());
  document.getElementById('fxMsg').innerHTML = `<div class="big">お客様の着席から${limit}分以上たっています</div><div class="sub">次回は早めの準備をお願いします</div><button id="lateOk">確認しました</button>`;
  return new Promise(r => { let done=false; const end=()=>{ if(done) return; done=true; fx.className='fx'; r(); }; document.getElementById('lateOk').onclick=end; setTimeout(end, 20000); });
}

// ---------- 演出 ----------
const rnd = (a,b) => a + Math.random()*(b-a);
function fxShow(kind, html, ms){
  const fx = document.getElementById('fx');
  fx.className = 'fx show ' + kind;
  fx.querySelectorAll(':scope > :not(.msg)').forEach(n => n.remove());
  document.getElementById('fxMsg').innerHTML = html;
  return new Promise(r => setTimeout(() => { fx.className = 'fx'; r(); }, ms));
}
function fxDouhan(name){
  const fx = document.getElementById('fx');
  const colors = ['#fff','#ffe9a8','#ff7b9c','#7bd3ff','#b8ff7b'];
  for (let i=0;i<40;i++){
    const s = document.createElement('div'); s.className='spark';
    s.style.left = rnd(0,100)+'%'; s.style.top = rnd(0,100)+'%';
    s.style.animationDelay = rnd(0,1.2)+'s'; s.style.transform = `scale(${rnd(.5,1.6)})`;
    fx.appendChild(s);
  }
  for (let i=0;i<80;i++){
    const c = document.createElement('div'); c.className='confetti';
    c.style.left = rnd(0,100)+'%'; c.style.background = colors[i%colors.length];
    c.style.animationDuration = rnd(2.2,3.6)+'s'; c.style.animationDelay = rnd(0,1)+'s';
    fx.appendChild(c);
  }
  return fxShow('douhan',
    `<div class="big">🎉 おめでとう！ 🎉</div><div class="name">${esc(name)} さん、同伴お疲れさま</div><div class="sub">今日も素敵な一日に</div>`, 3200);
}
function fxAfter(name){
  const fx = document.getElementById('fx');
  const moon = document.createElement('div'); moon.className='moon'; fx.appendChild(moon);
  for (let i=0;i<60;i++){
    const s = document.createElement('div'); s.className='star';
    s.style.left = rnd(0,100)+'%'; s.style.top = rnd(0,100)+'%';
    s.style.animationDuration = rnd(1.2,3)+'s'; s.style.animationDelay = rnd(0,2)+'s';
    fx.appendChild(s);
  }
  for (let i=0;i<3;i++){
    const sh = document.createElement('div'); sh.className='shoot';
    sh.style.left = rnd(50,95)+'%'; sh.style.top = rnd(5,30)+'%'; sh.style.animationDelay = rnd(0,1.5)+'s';
    fx.appendChild(sh);
  }
  for (let i=0;i<14;i++){
    const h = document.createElement('div'); h.className='heart'; h.textContent = ['💜','✨','💫'][i%3];
    h.style.left = rnd(0,100)+'%'; h.style.animationDuration = rnd(3,5)+'s'; h.style.animationDelay = rnd(0,1.5)+'s';
    fx.appendChild(h);
  }
  return fxShow('after',
    `<div class="big">遅くまでありがとう</div><div class="name">${esc(name)} さん</div><div class="sub">気をつけて帰ってね</div>`, 3200);
}

// 起動時：既にログイン済ならそのまま開く
start();
</script>
