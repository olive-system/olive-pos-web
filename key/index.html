<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="OLIVE 鍵"><meta name="theme-color" content="#4b5320">
<link rel="apple-touch-icon" href="icon.png"><link rel="icon" href="icon.png">
<title>OLIVE 鍵</title><!-- key v1.00 -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet"><style>button,input,select,textarea{font-family:inherit}</style>
<link rel="stylesheet" href="../cast/cast.css">
<style>
  .kbig{display:block;width:100%;border:0;border-radius:14px;padding:26px;font:inherit;font-size:24px;font-weight:700;background:var(--pri);color:#fff;cursor:pointer;margin-bottom:8px}
  .ksec{display:block;width:100%;border:1px solid var(--pri);border-radius:12px;padding:12px;font:inherit;font-weight:700;background:var(--card);color:var(--pri);cursor:pointer}
  .kbig[disabled],.ksec[disabled]{opacity:.5;cursor:default}
  .kres{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--ok);border-radius:12px;padding:14px;margin-bottom:10px}
  .kres.ng{background:var(--warn-soft);border-left-color:var(--warn)}.kres b{font-size:20px}
  .klock{font-weight:700;margin:4px 2px 8px}
  ol.kh{margin:6px 0 0;padding-left:20px;font-size:14px;line-height:1.8}
</style>
</head>
<body>
<div class="top"><b id="tStore">OLIVE</b><span class="sub">鍵</span></div>
<main id="main"><div class="card muted">読み込み中…</div></main>
<script src="../lib/supabase-js@2.116.0.js"></script>
<script>
// 鍵 v1.00（SQL 326・2026-11-02）：セサミの解錠・施錠。LINEマイページの「鍵」か、業者の QR から開き、ホーム画面に追加して使う
//   ?t= の合言葉で、だれか・使える鍵・時間を読む（key_info）。押すと Edge Function「sesame-key」がセサミに送る
//   ホーム画面のアイコンから開いた時、鍵が1つなら押さずに解錠（オーナー「ワンタッチで開けたい」）。30秒以内の2回目はしない
const SUPABASE_URL = 'https://gjqaxenwvvazhjtziusf.supabase.co';
const SUPABASE_KEY = 'sb_publishable_pPfJUvJd6iJeHBNiD7XkWA_2RKF7JYw';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth:{ persistSession:false } });
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls = (k, v) => { try{ if(v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); }catch(e){ return null; } };
const T = new URLSearchParams(location.search).get('t') || ls('olive_key_t') || '';
const ALONE = !!(navigator.standalone || (window.matchMedia && matchMedia('(display-mode: standalone)').matches));
const hm = d => `${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`;
let K = null, busy = false, res = '';

async function load(){
  if(!T){ $('main').innerHTML = '<div class="kres ng"><b>この鍵は無効です</b></div>'; return; }
  const r = await sb.rpc('key_info', { p_t: T });
  if(r.error){ $('main').innerHTML = `<div class="kres ng"><b>表示できません</b><br><span class="muted sm">${esc(r.error.message)}</span></div>`; return; }
  K = r.data; if(!K.ok){ $('main').innerHTML = `<div class="kres ng"><b>${esc(K.reason)}</b></div>`; return; }
  ls('olive_key_t', T); $('tStore').textContent = K.store_name || 'OLIVE'; paint();
  if(ALONE && K.now && (K.locks||[]).length === 1 && Date.now() - Number(ls('olive_key_auto') || 0) > 30000){ ls('olive_key_auto', String(Date.now())); send(K.locks[0].code, 'unlock'); }
}
function paint(){
  const L = K.locks || [], one = L.length === 1, off = !K.now || busy;
  const lockBox = l => `${one ? '' : `<div class="klock">${esc(l.name)}</div>`}<button class="kbig" data-c="${esc(l.code)}" data-m="unlock" ${off?'disabled':''}>解錠</button><button class="ksec" data-c="${esc(l.code)}" data-m="lock" ${off?'disabled':''}>施錠</button>`;
  $('main').innerHTML = `${res}<div class="card"><span class="muted sm">${esc(K.name)}　解錠可能時間</span><br><b>${esc(K.window || '本日なし')}</b>${K.now ? '' : `<div class="err sm" style="margin-top:4px">${K.expired ? '期限切れ' : '時間外'}</div>`}</div>
    ${L.map(l => `<div class="card">${lockBox(l)}</div>`).join('') || '<div class="card muted">鍵なし</div>'}
    ${ALONE ? '' : `<div class="card"><b>ホーム画面追加</b><ol class="kh"><li>iPhone：Safari で表示 → 共有 → ホーム画面に追加</li><li>Android：Chrome で表示 → メニュー → ホーム画面に追加</li></ol>${one ? '<div class="muted sm" style="margin-top:6px">ホーム画面のアイコンから表示すると、そのまま解錠します</div>' : ''}</div>`}`;
  $('main').querySelectorAll('[data-c]').forEach(b => b.onclick = () => send(b.dataset.c, b.dataset.m));
}
async function send(code, cmd){
  if(busy) return; busy = true; const nm = (K.locks.find(l => l.code === code) || {}).name || '';
  res = `<div class="kres"><b>送信中…</b><br><span class="muted sm">${esc(nm)}</span></div>`; paint();
  let r; try{ r = await sb.functions.invoke('sesame-key', { body: { t: T, lock: code, cmd } }); }catch(e){ r = { error: e }; }
  const d = r.data || {}, lb = cmd === 'lock' ? '施錠' : '解錠';
  res = !r.error && d.ok ? `<div class="kres"><b>${lb}完了</b><br><span class="muted sm">${hm(new Date())}　${esc(nm)}</span></div>`
    : `<div class="kres ng"><b>${lb}エラー</b><br><span class="muted sm">${esc(d.reason || (r.error && r.error.message) || '通信エラー')}</span></div>`;
  busy = false; paint();
}
load();
</script>
</body>
</html>
