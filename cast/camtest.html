<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>カメラの試し</title>
<link rel="stylesheet" href="../lib/olive/olive.css">
<!-- バストアップ写真のシルエットをカメラの画面に重ねられるかの試し（2026-11-19 オーナーの iPhone で確かめる）。
     どこからもつながっていない。撮った写真はどこにも送らず、この画面に出すだけ -->
<style>
body{margin:0;background:var(--bg,#f5f3ee);color:var(--ink);font-family:-apple-system,"Hiragino Sans",sans-serif}
.wrap{max-width:480px;margin:0 auto;padding:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.card b{display:block;margin-bottom:4px}
.card ol{margin:4px 0 0;padding-left:20px;line-height:1.7}
.go{display:block;width:100%;height:48px;border:0;border-radius:10px;background:var(--pri);color:#fff;font:inherit;font-size:17px;font-weight:700}
.cam{position:fixed;inset:0;background:#000;display:none;flex-direction:column;z-index:9}
.cam.on{display:flex}
.vw{position:relative;flex:1;overflow:hidden}
.vw video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vw svg{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);width:100%;max-width:460px;max-height:92%;color:#fff}
.ct{position:absolute;left:16px;top:16px;color:#fff;font-weight:700;font-size:17px}
.cx{position:absolute;right:12px;top:8px;color:#fff;background:none;border:0;font-size:30px}
.bar{height:120px;display:flex;align-items:center;justify-content:center}
.sh{width:72px;height:72px;border-radius:50%;border:4px solid #fff;background:#fff;box-shadow:inset 0 0 0 4px #000}
#out img{display:block;width:100%;border-radius:8px;margin-top:8px}
.err{color:var(--warn)}
</style></head>
<body><div class="wrap">
<div class="card"><b>カメラの試し（バストアップ）</b>
<ol><li>［撮影］を押す。カメラの許可が出たら「許可」</li>
<li>白いシルエットに合わせて、白い丸で撮る</li>
<li>LINE の中と Safari の2つで試す。2回目に開いた時も許可が出るかを見る</li></ol></div>
<div class="card"><b>見てほしい所</b>
<ol><li>許可が毎回出るか</li><li>写りが細かいか</li><li>撮った写真が下に残るか</li></ol></div>
<div class="card"><b>答え方</b>秘書に「LINE：撮れた・許可は毎回」のように、2つの結果を送る</div>
<button class="go" id="go">撮影</button>
<div id="out"></div>
</div>
<div class="cam" id="cam"><div class="vw"><video id="vd" playsinline muted autoplay></video>
<svg viewBox="0 0 150 200" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="142" height="192" rx="10" stroke-dasharray="7 6" stroke-width="1.5" opacity=".8"/><circle cx="75" cy="58" r="30" stroke-width="2.5"/><path d="M63 86 L63 100 C42 104 26 114 22 132 L20 196 M87 86 L87 100 C108 104 124 114 128 132 L130 196" stroke-width="2.5"/></svg>
<div class="ct">写真（バストアップ）</div><button class="cx" id="cx" aria-label="閉じる">×</button></div>
<div class="bar"><button class="sh" id="sh" aria-label="撮影"></button></div></div>
<script>
/* 試しのページだけで使う。ほかの画面の部品とは名前を分ける */
var ctStream = null;
function ctEl(id){ return document.getElementById(id); }
function ctStop(){ if(ctStream){ ctStream.getTracks().forEach(function(t){ t.stop(); }); ctStream = null; } ctEl('cam').classList.remove('on'); }
function ctShow(html){ ctEl('out').insertAdjacentHTML('afterbegin', '<div class="card">' + html + '</div>'); }
ctEl('go').onclick = function(){
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ ctShow('<span class="err">カメラを開けません：この画面ではカメラが使えません</span>'); return; }
  navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1440 } }, audio: false }).then(function(s){
    ctStream = s; var v = ctEl('vd'); v.srcObject = s; ctEl('cam').classList.add('on'); return v.play();
  }).catch(function(e){ ctStop(); ctShow('<span class="err">カメラを開けません：' + (e && e.name ? e.name : e) + '</span>'); });
};
ctEl('cx').onclick = ctStop;
ctEl('sh').onclick = function(){
  var v = ctEl('vd'), c = document.createElement('canvas'); c.width = v.videoWidth; c.height = v.videoHeight;
  if(!c.width){ ctShow('<span class="err">撮れませんでした：カメラの画面がまだ出ていません</span>'); return; }
  c.getContext('2d').drawImage(v, 0, 0);
  c.toBlob(function(b){
    ctStop();
    if(!b){ ctShow('<span class="err">撮れませんでした：写真を作れません</span>'); return; }
    var u = URL.createObjectURL(b), now = new Date();
    ctShow('<b>' + now.getHours() + ':' + String(now.getMinutes()).padStart(2, '0') + '　' + c.width + '×' + c.height + '・' + Math.round(b.size / 1024) + 'KB</b><img src="' + u + '" alt="">');
  }, 'image/jpeg', 0.9);
};
</script>
</body></html>
