<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>OLIVE LINEマイページ</title><!-- cast v0.42 -->
<style>
  :root{--bg:#f6f5f0;--card:#fff;--ink:#1a1a1a;--muted:#7a7a7a;--line:#e3e1dc;--soft:#f1f0e8;--head:#4b5320;--head2:#6b7436;--brand:#c9b37a;--brand-d:#a08a4f;--pri:#4b5320;--ok:#b8973e;--warn:#c0392b;--warn-soft:#fbe9e7;--gold-soft:#f8f0d8;--acc:var(--ok);--gold:var(--ok);--blue:var(--pri);--edit:var(--pri)}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;font-size:16px}
  .top{position:sticky;top:0;z-index:5;background:var(--head);color:#fff;display:flex;align-items:center;gap:10px;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top))}
  .top b{font-size:18px}.top .sub{margin-left:auto;font-size:13px;color:var(--line)}
  .top button{background:transparent;border:1px solid var(--line);color:#fff;border-radius:8px;height:34px;padding:0 12px;font:inherit;font-size:14px}
  main{max-width:520px;margin:0 auto;padding:14px 14px 40px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
  .c{text-align:center;padding:24px 16px}.big{font-size:22px;font-weight:700;margin-bottom:8px}
  .code{font-size:42px;font-weight:700;letter-spacing:.2em;margin:16px 0 10px;color:var(--head);font-variant-numeric:tabular-nums}
  .muted{color:var(--muted)}.sm{font-size:13px}.lkb{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 14px;font:inherit;font-size:14px;color:var(--ink);cursor:pointer}.err{color:var(--warn)}
  .hello{font-size:20px;font-weight:700;margin:2px 2px 10px}
  .row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:4px 0}.row b{font-variant-numeric:tabular-nums;white-space:nowrap}
  .row.warn b{color:var(--warn)}
  .bar{height:10px;background:var(--soft);border-radius:6px;margin:8px 0 6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--brand)}
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .tile{position:relative;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 12px;min-height:84px;font:inherit;color:var(--ink);cursor:pointer}
  .tile b{display:block;font-size:17px}.tile small{color:var(--muted)}
  .tile[disabled]{cursor:default;opacity:.55}.tile .soon{position:absolute;top:8px;right:8px;font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:1px 7px}
  .subh{color:var(--muted);margin:0 2px 8px;font-size:14px}
  .warnbox{background:var(--warn-soft);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px;font-size:14px}
  .warnbox b.t{color:var(--warn);display:block;margin-bottom:6px}.warnbox table{width:100%;border-collapse:collapse}.warnbox td{padding:6px 4px;border-top:1px solid var(--line)}
  .warnbox td:last-child{text-align:right;font-weight:700;white-space:nowrap}.warnbox tr.hi td{background:var(--card);color:var(--warn)}.warnbox .now{margin-top:6px;font-size:13px;color:var(--warn)}
  label.f,div.f{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}textarea{width:100%;min-height:90px;font:inherit;font-size:16px;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--card);color:var(--ink);resize:vertical}
  .btn{display:block;width:100%;border:0;border-radius:10px;padding:14px;font:inherit;font-weight:700;background:var(--pri);color:#fff;cursor:pointer}.btn.g{background:var(--card);color:var(--ink);border:1px solid var(--line);font-weight:400}.btn[disabled]{opacity:.6}
  table.t{width:100%;border-collapse:collapse;font-size:14px}table.t th{font-weight:400;color:var(--muted);font-size:12px;text-align:left;padding:8px;border-bottom:1px solid var(--line)}table.t td{padding:8px;border-bottom:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}table.t td.mk{color:var(--warn);font-size:12px}
  .mon{display:flex;justify-content:space-between;align-items:center;margin:0 2px 10px;font-size:17px}.mon button{background:none;border:0;font:inherit;font-size:24px;color:var(--muted);padding:0 10px}.mon button[disabled]{opacity:.25}
  .row.s{border-top:1px solid var(--line);font-weight:700}.row.n{font-size:18px;border-top:2px solid var(--head);padding-top:8px;margin-top:4px}.gh{font-size:12px;color:var(--muted);margin-bottom:2px}.ttl{text-align:center;font-weight:700;margin-bottom:6px}
  .sign{width:100%;height:180px;border:1px solid var(--line);border-radius:8px;background:var(--card);touch-action:none;display:block}
  .dlg{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;padding:24px;z-index:50}
  .dlg .box{background:var(--card);border-radius:16px;padding:20px 18px 16px;width:min(360px,100%);text-align:center}.dlg p{margin:0 0 16px;white-space:pre-wrap;line-height:1.6}
  .dlg .bt{display:flex;gap:8px}.dlg .bt .btn{flex:1}
  .hide{display:none!important}
</style>
</head>
<body>
<div class="top"><b id="tStore">OLIVE</b><span class="sub" id="tSub">LINEマイページ</span><button id="tBack" class="hide">戻る</button></div>
<main id="main"><div class="card c muted">読み込み中…</div></main>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0"></script>
<script>
// LINEマイページ v0.01（SQL 096）：公式 LINE のメニュー → LINE ログイン（LIFF）→ 連携済みなら本人のページ、未連携なら4桁の番号。v0.02：言葉を熟語に
// 銀座と広島で入口（LIFF）が別。?s= に店のコード
const SUPABASE_URL = 'https://gjqaxenwvvazhjtziusf.supabase.co';
const SUPABASE_KEY = 'sb_publishable_pPfJUvJd6iJeHBNiD7XkWA_2RKF7JYw';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth:{ persistSession:false } });
const LIFF = { ginza:'2012027414-zlSsSUTA', hiroshima:'2012027414-BSyLe8IB' };
const STORE = new URLSearchParams(location.search).get('s') || (()=>{ try{ return localStorage.getItem('olive_cast_store'); }catch(e){ return null; } })() || '';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const yen = n => Number(n||0).toLocaleString('ja-JP') + '円';
const HM = h => { const t=Math.round(Number(h||0)*60); return `${Math.floor(t/60)}時間${String(t%60).padStart(2,'0')}分`; };
let TOKEN = null, ME = null, KL = '係', pollT = null;

// v0.11：確認・お知らせは画面の中の窓で出す（ブラウザの窓にはサイトのアドレスが出るため。オーナー 2026-10-15）
function dlg(msg, ok, cancel){ return new Promise(res => { const d = document.createElement('div'); d.className = 'dlg';
  d.innerHTML = `<div class="box"><p>${esc(msg)}</p><div class="bt">${cancel?'<button class="btn g" data-k="no">キャンセル</button>':''}<button class="btn" data-k="ok">${esc(ok)}</button></div></div>`;
  document.body.appendChild(d); d.querySelector('[data-k=ok]').onclick = () => { d.remove(); res(true); }; const n = d.querySelector('[data-k=no]'); if(n) n.onclick = () => { d.remove(); res(false); }; }); }
const uiAlert = m => dlg(m, 'OK', false), uiConfirm = (m, ok = 'OK') => dlg(m, ok, true);
function show(html){ $('main').innerHTML = html; window.scrollTo(0,0); }
function fail(msg){ show(`<div class="card c"><div class="big">表示できません</div><p class="err">${esc(msg)}</p><p class="muted sm">公式 LINE のメニューから再度開いてください</p></div>`); }

async function start(){
  if(!LIFF[STORE]){ fail('店舗を特定できません（公式 LINE のメニューから開いてください）'); return; }
  try{ localStorage.setItem('olive_cast_store', STORE); }catch(e){}
  try{ await liff.init({ liffId: LIFF[STORE] }); }catch(e){ fail('LINE の初期化に失敗しました：' + (e.message||e)); return; }
  if(!liff.isLoggedIn()){ liff.login({ redirectUri: location.href }); return; }
  await login();
}

// LINE の id_token をデータベースで認証 → 入場券、または連携用の番号
async function login(){
  const idt = liff.getIDToken();
  if(!idt){ liff.login({ redirectUri: location.href }); return; }
  const r = await sb.rpc('cast_login', { p_store: STORE, p_id_token: idt });
  if(r.error){ if(/認証|確かめ/.test(r.error.message)){ liff.logout(); liff.login({ redirectUri: location.href }); return; } fail(r.error.message); return; }
  if(r.data.status === 'link'){ showLink(r.data); return; }
  TOKEN = r.data.token; clearTimeout(pollT); await loadMe();
}

// 未連携：番号を表示し、黒服が POS で入力するのを待つ（5秒ごとに確認）
function showLink(d){
  show(`<div class="card c"><div class="big">ようこそ</div><p>この LINE は未連携です。</p><p>黒服にこの番号をお伝えください。</p>
    <div class="code">${esc(d.code)}</div><p class="muted sm">番号は10分で更新されます。連携が完了すると自動で切り替わります</p></div>`);
  clearTimeout(pollT); pollT = setTimeout(login, 5000);
}

async function loadMe(){
  { const w = await sb.rpc('cast_who', { p_token: TOKEN }); /* v0.33・SQL 133：黒服が開いた時は黒服マイページ */
    if(!w.error && w.data && w.data.kind === 'hall'){ await hallLoad(); return; }
    if(!w.error && w.data && w.data.kind !== 'cast'){ show(`<div class="card c"><div class="big">${esc(w.data.name)} さん</div><p>LINE連携は完了しています。</p><p class="muted sm">黒服マイページは準備中です。連絡先交換のまとめは、この公式 LINE に届きます</p></div>`); return; } }
  const r = await sb.rpc('cast_me', { p_token: TOKEN });
  if(r.error){ fail(r.error.message); return; }
  ME = r.data; KL = ME.kakari_label || '係';
  { const d = await sb.rpc('cast_dress_info', { p_token: TOKEN }); ME.dress = d.error ? null : d.data; }
  await docsLoad(); /* v0.20・SQL 120：書類の未提出の数 */
  { const b = await sb.rpc('cast_bill_months', { p_token: TOKEN }); ME.billMonths = b.error ? null : (b.data || []); } /* v0.36・SQL 134：伝票一覧の件数 */
  { const b = await sb.rpc('cast_birthdays', { p_token: TOKEN }); ME.bdays = b.error ? [] : (b.data || []); } /* v0.40・SQL 150：トップに「お誕生日（前後2週間）」（オーナー 2026-10-18） */
  { const n = await sb.rpc('cast_notice_list', { p_token: TOKEN }); NOTICES = n.error ? [] : (n.data || []); ME.unread = NOTICES.filter(x => !x.read).length; } /* v0.18・SQL 118：お知らせの未確認の数 */ /* v0.12・SQL 110：ドレス新調日（店が「する」の時だけボタンを出す） */
  $('tStore').textContent = ME.store_name || 'OLIVE';
  home();
  { const th = thxParam(); if(th) resvThanksById(th); const nt = urlParam('notice'); if(nt) noticeOpen(nt); } /* v0.16・SQL 115：係に届いた LINE の「ありがとう」から開いた時 */
}

// スライド表の「次の段」の文：あと○○で 時給○円
const UNIT = { sales:v=>`${Math.round(v/10000).toLocaleString('ja-JP')}万円`, points:v=>`${v}ポイント`, douhan:v=>`${v}回`, days:v=>`${v}日`, reactions:v=>`${v}回`, groups:v=>`${v}組`, guests:v=>`${v}名` };
const BASIS = { sales:()=>KL+'小計', points:()=>'ポイント', douhan:()=>'同伴', days:()=>'稼働日数', reactions:()=>'反応◎', groups:()=>KL+'の組数', guests:()=>KL+'の人数' };
function nextTxt(s){
  const u = s.unit === 'daily' ? '日給' : '時給';
  if(s.next_threshold == null) return `最上段（${u} ${yen(s.cur_amount)}）`;
  const rest = Number(s.next_threshold) - Number(s.value||0), f = UNIT[s.basis] || (v=>v);
  return `あと ${f(s.basis==='points'?Math.round(rest*10)/10:Math.ceil(rest))}で ${u} ${yen(s.next_amount)}`;
}
function wageNow(){ const st = ME.stats||{}; if(st.wage) return Number(st.wage); const a = (ME.slides||[]).map(s=>Number(s.cur_amount||0)); return a.length ? Math.max(...a) : 0; }

function setBack(fn){ const b=$('tBack'); b.classList.toggle('hide', !fn); $('tSub').classList.toggle('hide', !!fn); b.onclick = fn || null; }

function home(){
  if(ME && ME.hall){ hallHome(); return; }
  setBack(null);
  const st = ME.stats||{}, sl = (ME.slides||[]).find(s=>s.basis==='sales') || (ME.slides||[])[0];
  let top = `<div class="row"><span>今月の${esc(KL)}小計</span><b>${Math.round(Number(st.sales||0)/10000).toLocaleString('ja-JP')}万円</b></div>`;
  if(sl && sl.next_threshold != null){
    const pct = Math.max(0, Math.min(100, Number(sl.value||0) / Number(sl.next_threshold) * 100));
    top += `<div class="bar"><i style="width:${pct.toFixed(1)}%"></i></div><div class="muted sm">${esc(nextTxt(sl))}</div>`;
  } else if(sl) top += `<div class="muted sm">${esc(nextTxt(sl))}</div>`;
  const tile = (k,t,s,on) => `<button class="tile" data-go="${k}" ${on?'':'disabled'}>${on?'':'<span class="soon">準備中</span>'}<b>${t}</b>${s?`<small>${s}</small>`:''}</button>`;
  const bdRow = b => { const cu = (b.kind_label||'お客様') === 'お客様', past = b.in < 0; return `<div class="row"${past?' style="color:var(--muted)"':''}><span><b class="${b.in===0?'err':''}" style="display:inline-block;min-width:5.6em">${b.in===0?'本日':past?(-b.in)+'日前':'あと'+b.in+'日'}</b>${esc(b.name)}${cu?' 様':''} <small class="muted">${esc(b.birthday)}</small></span><small class="muted">${cu?(b.kakari?esc(KL)+' '+esc(b.kakari):''):esc(b.kind_label)}</small></div>`; };
  const bdCard = (ME.bdays||[]).length ? `<div class="card"><div class="gh">お誕生日（前後2週間）</div>${ME.bdays.map(bdRow).join('')}</div>` : '';
  top += `<div style="display:flex;justify-content:flex-end;gap:8px;margin-top:10px"><button class="lkb" data-go="perf">詳細</button><button class="lkb" data-go="pay">報酬明細</button></div>`; /* v0.41：成績と報酬明細は小計の箱のボタンに（オーナー 2026-10-18「ボタンを減らせる」） */
  show(`<div class="hello">${esc(ME.name)} さん</div><div class="card">${top}</div>${bdCard}
    <div class="tiles">${tile('shift','シフト','提出・確定・打刻',true)}${ME.billMonths?tile('bills','伝票一覧',`今月 ${(ME.billMonths[0]||{}).count||0}件`,true):''}${tile('absent','欠勤連絡','',true)}${tile('resv','予約・同伴','',true)}${tile('contact','連絡先交換','',true)}${tile('sales','営業連絡','',true)}${ME.docs&&ME.docs.target?tile('docs','書類',ME.docs.left?`未提出 ${ME.docs.left}件`:'',true):''}${tile('card','名刺発注','',true)}${ME.dress?.enabled?tile('dress','ドレス新調日','',true):''}${tile('info','お知らせ',ME.unread?`未確認 ${ME.unread}件`:'',true)}</div>`);
  $('main').querySelector('[data-go=perf]').onclick = perf;
  $('main').querySelector('[data-go=absent]').onclick = absent;
  { const b = $('main').querySelector('[data-go=bills]'); if(b) b.onclick = () => castBills(null); }
  $('main').querySelector('[data-go=pay]').onclick = payslip;
  $('main').querySelector('[data-go=card]').onclick = cardOrder;
  { const b = $('main').querySelector('[data-go=docs]'); if(b) b.onclick = docsList; }
  $('main').querySelector('[data-go=resv]').onclick = resvList;
  $('main').querySelector('[data-go=contact]').onclick = contactList;
  $('main').querySelector('[data-go=sales]').onclick = salesHome;
  $('main').querySelector('[data-go=shift]').onclick = shiftHome;
  $('main').querySelector('[data-go=info]').onclick = noticeList;
  { const d = $('main').querySelector('[data-go=dress]'); if(d) d.onclick = dressReport; }
}

function perf(){
  setBack(home);
  const st = ME.stats||{}, r = (k,v,c='') => `<div class="row ${c}"><span>${k}</span><b>${v}</b></div>`;
  const [y,m] = String(ME.month).split('-').map(Number), d = Number(String(ME.business_date).slice(8,10));
  const u = ME.pay_type === 'daily' ? '日給' : '時給';
  const slides = (ME.slides||[]).map(s=>`<div class="muted sm">${esc(s.name)}：${esc(nextTxt(s))}</div>`).join('');
  const q = st.quota != null && Number(st.quota) > 0 ? Number(st.quota) : null, dh = Number(st.douhan||0);
  const dhCard = q ? `${r('同伴', `${dh}回 / ノルマ ${q}回`, dh<q?'warn':'')}${dh<q?`<div class="muted sm">あと${q-dh}回（未達の場合は月末に罰金）</div>`:'<div class="muted sm">ノルマ達成</div>'}` : r('同伴', `${dh}回`);
  const fines = (ME.fines||[]), fsum = Number(st.fines||0);
  const fl = fines.map(f=>`<div class="muted sm">${Number(String(f.date).slice(5,7))}/${Number(String(f.date).slice(8,10))} ${esc(f.reason||'')}　${f.wage_pct?`時給の${f.wage_pct}%`:yen(f.amount)}</div>`).join('');
  show(`<div class="subh">${m}月（${m}/${d} まで）</div>
    <div class="card">${r(esc(KL)+'小計', yen(st.sales))}${r(`決定${u}（今）`, wageNow()?yen(wageNow()):'—')}${slides}</div>
    <div class="card">${dhCard}</div>
    <div class="card">${r('出勤日数', `${Number(st.days||0)}日`)}${r('稼働時間', HM(st.hours))}${r('ポイント', `${Number(st.points||0)}`)}${r('反応◎', `${Number(st.reactions||0)}回`)}</div>
    <div class="card">${r('罰金（今月）', fines.length?yen(fsum):'なし')}${fl}</div>`);
}

// v0.03・SQL 098：当日欠勤。理由は自由入力。罰金のルールは本人の報酬（時給／日給）の分だけ出し、今の時刻に当たる行を赤くする
const WD = ['日','月','火','水','木','金','土'];
const dTxt = d => { const x = new Date(d + 'T00:00:00+09:00'); return `${x.getMonth()+1}月${x.getDate()}日（${WD[x.getDay()]}）`; };
const tTxt = t => new Date(t).toLocaleTimeString('ja-JP', { timeZone:'Asia/Tokyo', hour:'2-digit', minute:'2-digit', hour12:false });
const fineTxt = (f, pt) => !f ? '—' : f.calc === 'hourly_pct' ? `時給の${f.value}%` : f.calc === 'daily_pct' ? `日給の${f.value}%` : f.calc === 'yen' ? yen(f.value) : '—';
async function absent(){
  setBack(home); show('<div class="card c muted">読み込み中…</div>');
  const r = await sb.rpc('cast_absence_info', { p_token: TOKEN });
  if(r.error){ fail(r.error.message); return; }
  const A = r.data;
  if(A.sent){ absentDone(A.date, A.sent.at, A.sent.fine_name, true); return; }
  const t = A.types || {}, rows = [['13時までの連絡', t.early, false], ['13時以降・金曜日・イベント日', t.late, true]].filter(x => x[1]);
  const rule = rows.length ? `<div class="warnbox"><b class="t">当日欠勤の罰金</b><table>${rows.map(x => `<tr class="${x[2]===!!A.is_late?'hi':''}"><td>${x[0]}</td><td>${esc(fineTxt(x[1], t.pay_type))}</td></tr>`).join('')}</table>
    <div class="now">現在の連絡は「${A.is_late ? '13時以降・金曜日・イベント日' : '13時までの連絡'}」に該当します</div></div>` : '';
  show(`<div class="subh">${dTxt(A.date)} ${tTxt(A.now)}</div>
    <div class="card"><label class="f" for="abR">理由</label><textarea id="abR" maxlength="300"></textarea></div>${rule}
    <button class="btn" id="abGo">欠勤連絡</button><p class="muted sm" style="margin:10px 2px">送信内容は公式 LINE のトークにも送信されます</p>`);
  $('abGo').onclick = async () => {
    const rs = $('abR').value.trim(); if(!rs){ await uiAlert('理由を入力してください'); return; }
    if(!await uiConfirm(`${dTxt(A.date)}の欠勤連絡を送信しますか？`)) return;
    $('abGo').disabled = true;
    const q = await sb.rpc('cast_absence_submit', { p_token: TOKEN, p_reason: rs });
    if(q.error){ $('abGo').disabled = false; await uiAlert(q.error.message); return; }
    let lineOk = true;

// v0.14・SQL 113：予約・同伴申請と予約一覧（自分が取った予約＋自分が係の予約）。お客様はフルネーム1つの欄・係はキャストから選ぶ・変更と取消は取った本人がその場で（承認なし。2026-10-15 オーナー）
//   申請・変更・取消をすると、お店（公式 LINE のトーク）と係のキャストに LINE が届く。POS に出す所は後で
const resvLine = r => `${Number(String(r.date).slice(5,7))}/${Number(String(r.date).slice(8,10))}（${WD[new Date(r.date+'T00:00:00+09:00').getDay()]}）${r.time}　${r.name} 様 ${r.guests}名`;
// LINE の文（SQL 114 の resv_text と同じ形。2026-10-15 オーナーの見本：【同伴】／日時　人数／お客様 様　係／誘客／（待ち合わせ）／メモ）
const resvMsg = (head, x, kn, by) => `【${x.douhan?head.replace('予約','同伴'):head}】\n${resvLine(x).split('　')[0]}　${x.guests}名\n${x.name} 様　係 ${kn}\n誘客 ${by}${x.douhan?`\n（待ち合わせ ${x.meet}）`:''}${x.memo?`\nメモ：${x.memo}`:''}`;
let RESV = [], NOTICES = [];
async function resvList(){
  setBack(home); show('<div class="card c muted">読み込み中…</div>');
  const r = await sb.rpc('cast_resv_list', { p_token: TOKEN });
  if(r.error){ fail(r.error.message); return; }
  RESV = r.data || [];
  const rows = RESV.map((x, i) => `<div style="padding:8px 0;border-top:1px solid var(--line)"><div class="row" style="padding:0"><span>${esc(resvLine(x))}</span>${x.douhan?'<b class="sm" style="color:var(--ok)">同伴</b>':''}</div>

    ${x.mine&&x.thanked?`<div class="sm" style="color:var(--ok);margin-top:2px">ありがとう ${esc(x.kakari_name||'')}${x.thanks_note?`「${esc(x.thanks_note)}」`:''}</div>`:''}
    ${!x.mine?(x.thanked?'<div class="sm" style="color:var(--ok);margin-top:2px">ありがとう済み</div>':`<div style="margin-top:6px"><button class="btn g" data-th="${i}" style="width:auto;padding:6px 16px">ありがとう</button></div>`):''}
    ${x.mine?`<div style="display:flex;gap:8px;margin-top:6px"><button class="btn g" data-ed="${i}" style="width:auto;padding:6px 16px">変更</button><button class="btn g" data-cx="${i}" style="width:auto;padding:6px 16px;color:var(--warn)">取消</button></div>`:''}</div>`).join('');
  show(`<button class="btn" id="rvNew" style="margin-bottom:12px">予約・同伴申請</button><div class="card"><div class="gh">予約一覧</div>${rows||'<div class="muted sm" style="padding:8px 0">予約はありません</div>'}</div>`);

  $('main').querySelectorAll('[data-cx]').forEach(b => b.onclick = () => resvCancel(RESV[b.dataset.cx]));
  $('main').querySelectorAll('[data-th]').forEach(b => b.onclick = () => resvThanks(RESV[b.dataset.th]));
}
// v0.16・SQL 115：係から誘客したキャストへ「ありがとう」（決まった文＋ひとこと。1つの予約に1回。2026-10-15 オーナー）

// v0.18・SQL 118：⑤お知らせ。補助として、過去のお知らせの置き場所（オーナー 2026-10-16「基本は公式 LINE に送信。過去のトークを遡るのが大変だから、一覧の置き場所」）。管理サイトで掲載、キャストは「確認」を押す
function urlParam(k){
  const q = new URLSearchParams(location.search); let v = q.get(k);
  if(!v){ const st = q.get('liff.state'); if(st) v = new URLSearchParams(st.replace(/^[^?]*\?/, '')).get(k); }
  return /^[0-9a-f-]{36}$/.test(v || '') ? v : null;
}
const noticeDay = a => { const d = new Date(new Date(a).getTime() + 9*3600e3); return `${d.getUTCMonth()+1}/${d.getUTCDate()}（${WD[d.getUTCDay()]}）`; };
async function noticeLoad(){ const n = await sb.rpc('cast_notice_list', { p_token: TOKEN }); if(n.error){ fail(n.error.message); return false; } NOTICES = n.data || []; ME.unread = NOTICES.filter(x => !x.read).length; return true; }
async function noticeList(){
  setBack(home); show('<div class="card c muted">読み込み中…</div>');
  if(!await noticeLoad()) return;
  show(`<div class="ttl">お知らせ</div><div class="card">${NOTICES.map((x, i) => `<button data-nt="${i}" style="display:block;width:100%;text-align:left;background:none;border:0;border-top:${i?'1px solid var(--line)':'0'};padding:10px 0;font:inherit;color:var(--ink);cursor:pointer">
      <div class="row" style="padding:0"><span style="${x.read?'':'font-weight:700'}">${esc(x.title)}</span><span class="sm" style="white-space:nowrap;color:${x.read?'var(--ok)':'var(--warn)'}">${x.read?'確認済み':'未確認'}</span></div>
      <div class="muted sm">${noticeDay(x.at)} 掲載</div></button>`).join('') || '<div class="muted sm" style="padding:8px 0">お知らせはありません</div>'}</div>`);
  $('main').querySelectorAll('[data-nt]').forEach(b => b.onclick = () => noticeShow(NOTICES[b.dataset.nt]));
}
async function noticeOpen(id){
  if(!await noticeLoad()) return;
  const x = NOTICES.find(v => v.id === id);
  if(!x){ await uiAlert('このお知らせは削除されています'); noticeList(); return; }
  noticeShow(x);
}
function noticeShow(x){
  setBack(noticeList);
  show(`<div class="card"><div class="gh">${noticeDay(x.at)} 掲載</div><div style="font-weight:700;font-size:17px">${esc(x.title)}</div>${x.body?`<div style="margin-top:10px;line-height:1.7;white-space:pre-wrap">${esc(x.body)}</div>`:''}</div>
    ${x.read?'<div class="c sm" style="color:var(--ok);padding:8px">確認済み</div>':'<button class="btn" id="ntOk">確認</button>'}`);
  const b = $('ntOk'); if(b) b.onclick = async () => {

// v0.20・SQL 120：⑥書類（オーナーにヒアリングして決めた形 2026-10-16）。3点セット＝契約書・本人確認書類（本籍地入りの住民票またはパスポートのコピー。原本は店で保管）・従業者名簿

let DOCS = null;
async function docsLoad(){ const r = await sb.rpc('cast_docs_info', { p_token: TOKEN }); DOCS = r.error ? null : r.data; ME.docs = DOCS ? { target: DOCS.target, left: [DOCS.contract, DOCS.id_doc, DOCS.roster].filter(x => !x).length } : null; return !r.error; }
const mdDay = d => { const x = new Date(String(d).slice(0,10)+'T00:00:00+09:00'); return `${x.getMonth()+1}/${x.getDate()}`; };

    <div style="padding:10px 0;border-top:1px solid var(--line)"><div class="row" style="padding:0"><b>本人確認書類</b>${st(D.id_doc)}</div>${D.id_doc?'':'<div class="muted sm">本籍地入りの住民票、またはパスポートのコピー。店に提出してください</div>'}</div>
    <div style="padding:10px 0;border-top:1px solid var(--line)"><div class="row" style="padding:0"><b>従業者名簿</b>${st(D.roster)}</div>${D.roster?'':'<div class="muted sm">店に提出してください</div>'}</div></div>

function contractForm(){
  setBack(docsList);
  const V = DOCS.version, fld = 'width:100%;height:48px;font:inherit;font-size:16px;border:1px solid var(--line);border-radius:8px;padding:0 10px;background:var(--card);color:var(--ink)';
  const ck = (id, t) => `<label style="display:flex;gap:8px;align-items:flex-start;margin-top:8px;font-size:15px"><input type="checkbox" class="dcCk" id="${id}" style="width:22px;height:22px;flex:none;margin:0;accent-color:var(--pri)">${t}</label>`;
  show(`<div class="ttl">${esc(V.title)}</div><div class="card"><div class="muted sm" style="white-space:pre-wrap;line-height:1.7">${esc(V.preamble)}</div>
    ${(V.articles||[]).map((a, i) => `<div style="padding:10px 0;border-top:1px solid var(--line);margin-top:10px"><b>${esc(a.title)}</b><div style="white-space:pre-wrap;line-height:1.7;font-size:14px;margin-top:4px">${esc(a.body)}</div>${ck('dcA'+i,'同意')}</div>`).join('')}
    <div class="f" style="margin-top:14px">本人情報</div>
    <input id="dcN" maxlength="40" placeholder="氏名" value="${esc(DOCS.real_name||'')}" style="${fld}">
    <input id="dcAd" maxlength="200" placeholder="住所" style="${fld};margin-top:8px">
    <input id="dcPh" type="tel" maxlength="20" placeholder="電話番号" style="${fld};margin-top:8px">
    <input id="dcEm" type="email" maxlength="100" placeholder="メールアドレス" style="${fld};margin-top:8px">
    <div class="f" style="margin-top:14px">署名</div><canvas class="sign" id="dcSg"></canvas><div style="margin-top:6px"><button class="btn g" id="dcClr" style="width:auto;padding:8px 16px">再入力</button></div>
    ${ck('dcOath', esc(V.oath))}</div>
    <button class="btn" id="dcOk">同意</button>`);
  const cv = $('dcSg'), W = cv.clientWidth, H = cv.clientHeight, dpr = Math.min(2, Math.max(1, window.devicePixelRatio||1)); cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr);
  const g = cv.getContext('2d'); g.scale(dpr, dpr); let drawn = false, down = false;
  const clear = () => { g.fillStyle = '#fff'; g.fillRect(0, 0, W, H); g.strokeStyle = '#111'; g.lineWidth = 2.6; g.lineCap = 'round'; g.lineJoin = 'round'; drawn = false; }; clear();
  const pos = e => { const b = cv.getBoundingClientRect(); return [(e.clientX-b.left)*W/b.width, (e.clientY-b.top)*H/b.height]; };
  cv.onpointerdown = e => { e.preventDefault(); down = true; try{ cv.setPointerCapture(e.pointerId); }catch(_){} const [a, b] = pos(e); g.beginPath(); g.moveTo(a, b); g.lineTo(a+0.1, b+0.1); g.stroke(); drawn = true; };
  cv.onpointermove = e => { if(!down) return; e.preventDefault(); const [a, b] = pos(e); g.lineTo(a, b); g.stroke(); };
  cv.onpointerup = cv.onpointercancel = () => { down = false; };

    if(!drawn){ await uiAlert('署名を入力してください'); return; }
    if(!await uiConfirm(`${V.title}\nこの内容で同意しますか？\n同意は取消できません`)) return;
    $('dcOk').disabled = true;
    const q = await sb.rpc('cast_contract_agree', { p_token: TOKEN, p_version: V.id, p_name: n, p_address: ad, p_phone: ph, p_email: em, p_signature: cv.toDataURL('image/png') });
    if(q.error){ $('dcOk').disabled = false; await uiAlert(q.error.message); return; }
    await uiAlert('契約書に同意しました。\n控えは PDF で保存できます');
    docsList();
  };
}
// 契約書の控え：同意した版の文・本人情報・署名を A4 縦（長い時は複数ページ）
async function contractPdf(){
  const b = $('dcPdf'); b.disabled = true; b.textContent = '作成中…';
  try{
    const r = await sb.rpc('cast_contract_copy', { p_token: TOKEN }); if(r.error) throw new Error(r.error.message);
    const C = r.data, at = new Date(C.at).toLocaleString('ja-JP', { timeZone:'Asia/Tokyo', year:'numeric', month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit' });
    if(!pdfLib) pdfLib = Promise.all([loadJs('https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js'), loadJs('https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js')]);
    await pdfLib;
    const box = document.createElement('div');
    box.style.cssText = 'position:fixed;left:-10000px;top:0;width:720px;padding:36px 40px;background:#fff;color:#111;font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;font-size:13px;line-height:1.75'; /* .kp：印刷物（契約書の PDF・白と黒） */
    box.innerHTML = `<div style="text-align:center;font-size:18px;font-weight:700;margin-bottom:14px">${esc(C.title)}</div><div style="white-space:pre-wrap">${esc(C.preamble)}</div>
      ${(C.articles||[]).map(a => `<div style="margin-top:12px"><b>${esc(a.title)}</b><div style="white-space:pre-wrap">${esc(a.body)}</div><div>☑ 同意</div></div>`).join('')}
      <div style="margin-top:14px">☑ ${esc(C.oath)}</div>
      <table style="margin-top:18px;border-collapse:collapse;width:100%">${[['店舗',C.store],['氏名',C.name],['住所',C.address],['電話番号',C.phone],['メールアドレス',C.email],['同意日時',at]].map(([k,v]) => `<tr><td style="border:1px solid #999;padding:6px 10px;width:130px">${k}</td><td style="border:1px solid #999;padding:6px 10px">${esc(v)}</td></tr>`).join('')}<!-- .kp：印刷物（契約書の PDF・白と黒） -->
      <tr><td style="border:1px solid #999;padding:6px 10px">署名</td><td style="border:1px solid #999;padding:6px 10px"><img src="${C.signature}" style="height:90px"></td></tr></table>`; /* .kp：印刷物（契約書の PDF・白と黒） */
    document.body.appendChild(box);
    try{
      await new Promise(ok => { const im = box.querySelector('img'); if(im.complete) ok(); else { im.onload = ok; im.onerror = ok; } });
      const c = await html2canvas(box, { scale: 2, backgroundColor: '#ffffff' });
      const pdf = new window.jspdf.jsPDF({ unit:'mm', format:'a4' }), pw = 190, ph = 277, k = pw / c.width, pageH = Math.floor(ph / k);
      for(let y = 0, i = 0; y < c.height; y += pageH, i++){
        const h = Math.min(pageH, c.height - y), p = document.createElement('canvas'); p.width = c.width; p.height = h;
        p.getContext('2d').drawImage(c, 0, y, c.width, h, 0, 0, c.width, h);
        if(i) pdf.addPage(); pdf.addImage(p.toDataURL('image/jpeg', 0.92), 'JPEG', 10, 10, pw, h * k);
      }
      pdf.save(`契約書_${ME.name}.pdf`);
    } finally { box.remove(); }
  }catch(e){ await uiAlert('PDF を作成できませんでした：' + (e.message||e)); }
  finally{ b.disabled = false; b.textContent = 'PDF ダウンロード'; }
}

let SALES = null;

    show(`<div class="ttl">連絡済リスト</div><div class="card"><div class="gh">連絡先交換のお客様（敬称略）　選択 ${on.size + extra.length}名</div>

// v0.22・SQL 122：⑧シフト（オーナーにヒアリングして決めた形 2026-10-16）。毎月10日までに来月の「出勤できない日」を提出（1日5人まで先着・10日を過ぎたら変更できない）
// v0.30：ホームのシフトは成績の横（オーナー 2026-10-16）

// v0.28：シフトのカレンダーは左揃え（オーナー 2026-10-16）
// v0.27：確定のカレンダーは時刻を出さず「予約1」「係予約2」の件数だけ（時刻は日を押すと出る。オーナー 2026-10-16）
// v0.26・SQL 128：お店の休みの日は「休」（押せない）

//   確定したシフトはカレンダーで、出勤時刻と同伴・予約・係予約（自分が係のお客様の予約）。日を押すと詳細
let SHIFT = null;
const calGrid = (month, cell) => { const m = new Date(month+'T00:00:00+09:00'), y = m.getFullYear(), mo = m.getMonth(), first = new Date(y, mo, 1).getDay(), n = new Date(y, mo + 1, 0).getDate();

  for(let i = 0; i < first; i++) h += '<div></div>';
  for(let d = 1; d <= n; d++) h += cell(`${y}-${String(mo+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`, d);
  return h + '</div>'; };
async function shiftHome(){

}
function shiftPaint(ng){
  const S = SHIFT, OFF = new Set(S.off || []), OK = !!S.ok_only, full = new Set(OK ? [] : S.full || []), mo = Number(String(S.month).slice(5,7)), dueD = mdDay(S.due);
  const box = 'border:1px solid var(--line);border-radius:6px;text-align:left;padding:5px 4px;font-size:13px;line-height:1.25;min-height:44px';
  const fixed = (S.fixed || []).map(F => { const D = {}; (F.days||[]).forEach(x => D[x.day] = x.time); const M = {}; (F.marks||[]).forEach(x => (M[x.day] = M[x.day] || []).push(x));
    return `<div class="card"><div class="gh">${Number(String(F.month).slice(5,7))}月の出勤（確定）${(F.days||[]).length}日</div>${calGrid(F.month, (iso, d) => { const t = D[iso], k = M[iso];
      return `<div data-sd="${iso}" style="${box};cursor:pointer;${t?'background:var(--gold-soft);font-weight:700':''}">${d}${t?`<small style="display:block;font-size:10px;color:var(--pri)">${t}</small>`:OFF.has(iso)?'<small style="display:block;font-size:10px;color:var(--muted);font-weight:400">休</small>':(k?'<small style="display:block;font-size:10px;color:var(--muted);font-weight:400;white-space:nowrap">出勤なし</small>':'')}${['同伴','予約','係予約'].map(n => { const c = (k||[]).filter(x => x.kind === n).length; return c ? `<small style="display:block;font-size:10px;color:var(--ok);font-weight:400;white-space:nowrap">${n}${c}</small>` : ''; }).join('')}</div>`; })}</div>`; }).join('');
  show(`<div style="display:flex;justify-content:flex-end;margin-bottom:-28px"><button class="lkb" id="shAtt">打刻一覧</button></div><div class="ttl">シフト</div>${fixed}
    <div class="card"><div class="sm" style="font-weight:700;margin-bottom:8px">${mo}月分${OK?'出勤希望':'休み希望'}　提出期限 ${dueD}</div>
    ${calGrid(S.month, (iso, d) => { const on = ng.has(iso), of = OFF.has(iso), fu = (full.has(iso) && !on) || of;
      return `<div ${S.closed||fu?'':`data-ng="${iso}"`} style="${box};${S.closed||fu?'':'cursor:pointer;'}${on?'background:var(--soft)':''}${fu?';color:var(--muted);background:var(--bg)':''}">${d}${on?(OK?'<small style="display:block;color:var(--ok);font-size:12px">○</small>':'<small style="display:block;color:var(--warn);font-size:12px">×</small>'):fu?`<small style="display:block;font-size:10px">${of?'休':'満'}</small>`:''}</div>`; })}
    <div class="muted sm" style="margin-top:6px">${OK?'○ 出勤できる日':'× 出勤できない日（1日5人まで）・満 5人に達した日'}${OFF.size?'・休 お店の休み':''}</div>
    ${S.closed?'<div class="sm" style="margin-top:6px">提出期限を過ぎました。変更は黒服にご連絡ください</div>':''}</div>
    ${S.closed?'':`<button class="btn" id="shGo">${S.submitted?'再提出':'提出'}</button>`}<button class="btn g" id="shChg" style="margin-top:10px">シフト変更（メッセージにてご相談ください）</button>`);
  $('main').querySelectorAll('[data-ng]').forEach(b => b.onclick = () => { const k = b.dataset.ng; ng.has(k) ? ng.delete(k) : ng.add(k); const y = window.scrollY; shiftPaint(ng); window.scrollTo(0, y); });
  $('main').querySelectorAll('[data-sd]').forEach(b => b.onclick = () => shiftDay(b.dataset.sd));
  $('shAtt').onclick = () => attend(null); /* v0.42：打刻一覧はシフトの中から（オーナー 2026-10-18） */
  $('shChg').onclick = async () => { try{ if(liff.isInClient()){ liff.closeWindow(); return; } }catch(e){} await uiAlert('公式 LINE のトークからご連絡ください'); }; // v0.29：お店のトークに戻る
  if($('shGo')) $('shGo').onclick = async () => {
    const days = [...ng].sort();
    if(!await uiConfirm(`${mo}月の${OK?'出勤できる日':'出勤できない日'} ${days.length}日を提出しますか？${days.length?'\n'+days.map(mdDay).join('、'):''}`)) return;
    $('shGo').disabled = true;
    const q = await sb.rpc(OK ? 'cast_shift_ok_submit' : 'cast_shift_ng_submit', { p_token: TOKEN, p_days: days });
    if(q.error){ $('shGo').disabled = false; await uiAlert(q.error.message); shiftHome(); return; }
    SHIFT = q.data; await uiAlert('提出しました'); shiftPaint(new Set(((SHIFT.ok_only ? SHIFT.ok : SHIFT.ng) || []).filter(d => !(SHIFT.off || []).includes(d))));
  };
}
async function shiftDay(iso){
  const F = (SHIFT.fixed || []).find(f => iso >= f.month && iso.slice(0,7) === String(f.month).slice(0,7)); if(!F) return;
  const t = (F.days||[]).find(x => x.day === iso), k = (F.marks||[]).filter(x => x.day === iso), d = new Date(iso+'T00:00:00+09:00');
  await uiAlert(`${d.getMonth()+1}/${d.getDate()}（${WD[d.getDay()]}）\n${t?`出勤 ${t.time}`:'出勤なし'}${k.length?'\n'+k.map(x => `${x.kind}　${x.time}　${x.name} 様 ${x.guests}名`).join('\n'):''}`);
}

start();
</script>
