<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>OLIVE LINEマイページ</title><!-- cast v0.12 -->
<style>
  :root{--bg:#f6f5f0;--card:#fff;--ink:#1a1a1a;--muted:#7a7a7a;--line:#e3e1dc;--soft:#f1f0e8;--head:#4b5320;--head2:#6b7436;--brand:#c9b37a;--brand-d:#a08a4f;--pri:#4b5320;--ok:#b8973e;--warn:#c0392b;--warn-soft:#fbe9e7;--gold-soft:#f8f0d8;--acc:var(--ok);--gold:var(--ok);--blue:var(--pri);--edit:var(--pri)}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;font-size:16px}
  .top{position:sticky;top:0;z-index:5;background:var(--head);color:#fff;display:flex;align-items:center;gap:10px;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top))}
  .top b{font-size:18px}.top .sub{margin-left:auto;font-size:13px;color:var(--line)}
  .top button{background:transparent;border:1px solid var(--line);color:#fff;border-radius:8px;height:34px;padding:0 12px;font:inherit;font-size:14px}
  main{max-width:520px;margin:0 auto;padding:14px 14px 40px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
  .c{text-align:center;padding:24px 16px}.big{font-size:22px;font-weight:700;margin-bottom:8px}
  .code{font-size:42px;font-weight:700;letter-spacing:.2em;margin:16px 0 10px;color:var(--head);font-variant-numeric:tabular-nums}
  .muted{color:var(--muted)}.sm{font-size:13px}.err{color:var(--warn)}
  .hello{font-size:20px;font-weight:700;margin:2px 2px 10px}
  .row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:4px 0}.row b{font-variant-numeric:tabular-nums;white-space:nowrap}
  .row.warn b{color:var(--warn)}
  .bar{height:10px;background:var(--soft);border-radius:6px;margin:8px 0 6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--brand)}
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .tile{position:relative;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 12px;min-height:84px;font:inherit;color:var(--ink);cursor:pointer}
  .tile b{display:block;font-size:17px}.tile small{color:var(--muted)}
  .tile[disabled]{cursor:default;opacity:.55}.tile .soon{position:absolute;top:8px;right:8px;font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:1px 7px}
  .subh{color:var(--muted);margin:0 2px 8px;font-size:14px}
  .warnbox{background:var(--warn-soft);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px;font-size:14px}
  .warnbox b.t{color:var(--warn);display:block;margin-bottom:6px}.warnbox table{width:100%;border-collapse:collapse}.warnbox td{padding:6px 4px;border-top:1px solid var(--line)}
  .warnbox td:last-child{text-align:right;font-weight:700;white-space:nowrap}.warnbox tr.hi td{background:var(--card);color:var(--warn)}.warnbox .now{margin-top:6px;font-size:13px;color:var(--warn)}
  label.f{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}textarea{width:100%;min-height:90px;font:inherit;font-size:16px;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--card);color:var(--ink);resize:vertical}
  .btn{display:block;width:100%;border:0;border-radius:10px;padding:14px;font:inherit;font-weight:700;background:var(--pri);color:#fff;cursor:pointer}.btn.g{background:var(--card);color:var(--ink);border:1px solid var(--line);font-weight:400}.btn[disabled]{opacity:.6}
  table.t{width:100%;border-collapse:collapse;font-size:14px}table.t th{font-weight:400;color:var(--muted);font-size:12px;text-align:left;padding:8px;border-bottom:1px solid var(--line)}table.t td{padding:8px;border-bottom:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}table.t td.mk{color:var(--warn);font-size:12px}
  .mon{display:flex;justify-content:space-between;align-items:center;margin:0 2px 10px;font-size:17px}.mon button{background:none;border:0;font:inherit;font-size:24px;color:var(--muted);padding:0 10px}.mon button[disabled]{opacity:.25}
  .row.s{border-top:1px solid var(--line);font-weight:700}.row.n{font-size:18px;border-top:2px solid var(--head);padding-top:8px;margin-top:4px}.gh{font-size:12px;color:var(--muted);margin-bottom:2px}.ttl{text-align:center;font-weight:700;margin-bottom:6px}
  .sign{width:100%;height:180px;border:1px solid var(--line);border-radius:8px;background:var(--card);touch-action:none;display:block}
  .dlg{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;padding:24px;z-index:50}
  .dlg .box{background:var(--card);border-radius:16px;padding:20px 18px 16px;width:min(360px,100%);text-align:center}.dlg p{margin:0 0 16px;white-space:pre-wrap;line-height:1.6}
  .dlg .bt{display:flex;gap:8px}.dlg .bt .btn{flex:1}
  .hide{display:none!important}
</style>
</head>
<body>
<div class="top"><b id="tStore">OLIVE</b><span class="sub" id="tSub">LINEマイページ</span><button id="tBack" class="hide">戻る</button></div>
<main id="main"><div class="card c muted">読み込み中…</div></main>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0"></script>
<script>
// LINEマイページ v0.01（SQL 096）：公式 LINE のメニュー → LINE ログイン（LIFF）→ 連携済みなら本人のページ、未連携なら4桁の番号。v0.02：言葉を熟語に
// 銀座と広島で入口（LIFF）が別。?s= に店のコード
const SUPABASE_URL = 'https://gjqaxenwvvazhjtziusf.supabase.co';
const SUPABASE_KEY = 'sb_publishable_pPfJUvJd6iJeHBNiD7XkWA_2RKF7JYw';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth:{ persistSession:false } });
const LIFF = { ginza:'2012027414-zlSsSUTA', hiroshima:'2012027414-BSyLe8IB' };
const STORE = new URLSearchParams(location.search).get('s') || (()=>{ try{ return localStorage.getItem('olive_cast_store'); }catch(e){ return null; } })() || '';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const yen = n => Number(n||0).toLocaleString('ja-JP') + '円';
const HM = h => { const t=Math.round(Number(h||0)*60); return `${Math.floor(t/60)}時間${String(t%60).padStart(2,'0')}分`; };
let TOKEN = null, ME = null, KL = '係', pollT = null;

// v0.11：確認・お知らせは画面の中の窓で出す（ブラウザの窓にはサイトのアドレスが出るため。オーナー 2026-10-15）
function dlg(msg, ok, cancel){ return new Promise(res => { const d = document.createElement('div'); d.className = 'dlg';
  d.innerHTML = `<div class="box"><p>${esc(msg)}</p><div class="bt">${cancel?'<button class="btn g" data-k="no">キャンセル</button>':''}<button class="btn" data-k="ok">${esc(ok)}</button></div></div>`;
  document.body.appendChild(d); d.querySelector('[data-k=ok]').onclick = () => { d.remove(); res(true); }; const n = d.querySelector('[data-k=no]'); if(n) n.onclick = () => { d.remove(); res(false); }; }); }
const uiAlert = m => dlg(m, 'OK', false), uiConfirm = (m, ok = 'OK') => dlg(m, ok, true);
function show(html){ $('main').innerHTML = html; window.scrollTo(0,0); }
function fail(msg){ show(`<div class="card c"><div class="big">表示できません</div><p class="err">${esc(msg)}</p><p class="muted sm">公式 LINE のメニューから再度開いてください</p></div>`); }

async function start(){
  if(!LIFF[STORE]){ fail('店舗を特定できません（公式 LINE のメニューから開いてください）'); return; }
  try{ localStorage.setItem('olive_cast_store', STORE); }catch(e){}
  try{ await liff.init({ liffId: LIFF[STORE] }); }catch(e){ fail('LINE の初期化に失敗しました：' + (e.message||e)); return; }
  if(!liff.isLoggedIn()){ liff.login({ redirectUri: location.href }); return; }
  await login();
}

// LINE の id_token をデータベースで認証 → 入場券、または連携用の番号
async function login(){
  const idt = liff.getIDToken();
  if(!idt){ liff.login({ redirectUri: location.href }); return; }
  const r = await sb.rpc('cast_login', { p_store: STORE, p_id_token: idt });
  if(r.error){ if(/認証|確かめ/.test(r.error.message)){ liff.logout(); liff.login({ redirectUri: location.href }); return; } fail(r.error.message); return; }
  if(r.data.status === 'link'){ showLink(r.data); return; }
  TOKEN = r.data.token; clearTimeout(pollT); await loadMe();
}

// 未連携：番号を表示し、黒服が POS で入力するのを待つ（5秒ごとに確認）
function showLink(d){
  show(`<div class="card c"><div class="big">ようこそ</div><p>この LINE は未連携です。</p><p>黒服にこの番号をお伝えください。</p>
    <div class="code">${esc(d.code)}</div><p class="muted sm">番号は10分で更新されます。連携が完了すると自動で切り替わります</p></div>`);
  clearTimeout(pollT); pollT = setTimeout(login, 5000);
}

async function loadMe(){
  const r = await sb.rpc('cast_me', { p_token: TOKEN });
  if(r.error){ fail(r.error.message); return; }
  ME = r.data; KL = ME.kakari_label || '係';
  { const d = await sb.rpc('cast_dress_info', { p_token: TOKEN }); ME.dress = d.error ? null : d.data; } /* v0.12・SQL 110：ドレス新調日（店が「する」の時だけボタンを出す） */
  $('tStore').textContent = ME.store_name || 'OLIVE';
  home();
}

// スライド表の「次の段」の文：あと○○で 時給○円
const UNIT = { sales:v=>`${Math.round(v/10000).toLocaleString('ja-JP')}万円`, points:v=>`${v}ポイント`, douhan:v=>`${v}回`, days:v=>`${v}日`, reactions:v=>`${v}回`, groups:v=>`${v}組`, guests:v=>`${v}名` };
const BASIS = { sales:()=>KL+'小計', points:()=>'ポイント', douhan:()=>'同伴', days:()=>'稼働日数', reactions:()=>'反応◎', groups:()=>KL+'の組数', guests:()=>KL+'の人数' };
function nextTxt(s){
  const u = s.unit === 'daily' ? '日給' : '時給';
  if(s.next_threshold == null) return `最上段（${u} ${yen(s.cur_amount)}）`;
  const rest = Number(s.next_threshold) - Number(s.value||0), f = UNIT[s.basis] || (v=>v);
  return `あと ${f(s.basis==='points'?Math.round(rest*10)/10:Math.ceil(rest))}で ${u} ${yen(s.next_amount)}`;
}
function wageNow(){ const st = ME.stats||{}; if(st.wage) return Number(st.wage); const a = (ME.slides||[]).map(s=>Number(s.cur_amount||0)); return a.length ? Math.max(...a) : 0; }

function setBack(fn){ const b=$('tBack'); b.classList.toggle('hide', !fn); $('tSub').classList.toggle('hide', !!fn); b.onclick = fn || null; }

function home(){
  setBack(null);
  const st = ME.stats||{}, sl = (ME.slides||[]).find(s=>s.basis==='sales') || (ME.slides||[])[0];
  let top = `<div class="row"><span>今月の${esc(KL)}小計</span><b>${Math.round(Number(st.sales||0)/10000).toLocaleString('ja-JP')}万円</b></div>`;
  if(sl && sl.next_threshold != null){
    const pct = Math.max(0, Math.min(100, Number(sl.value||0) / Number(sl.next_threshold) * 100));
    top += `<div class="bar"><i style="width:${pct.toFixed(1)}%"></i></div><div class="muted sm">${esc(nextTxt(sl))}</div>`;
  } else if(sl) top += `<div class="muted sm">${esc(nextTxt(sl))}</div>`;
  const tile = (k,t,s,on) => `<button class="tile" data-go="${k}" ${on?'':'disabled'}>${on?'':'<span class="soon">準備中</span>'}<b>${t}</b>${s?`<small>${s}</small>`:''}</button>`;
  show(`<div class="hello">${esc(ME.name)} さん</div><div class="card">${top}</div>
    <div class="tiles">${tile('perf','成績','今月の実績',true)}${tile('att','打刻一覧','',true)}${tile('pay','給与明細','明細・日払い',true)}${tile('absent','欠勤連絡','',true)}${tile('card','名刺発注','',true)}${ME.dress?.enabled?tile('dress','ドレス新調日','',true):''}${tile('req','申請','変更')}${tile('info','お知らせ','店舗連絡')}${tile('shift','シフト','提出・確定')}</div>`);
  $('main').querySelector('[data-go=perf]').onclick = perf;
  $('main').querySelector('[data-go=absent]').onclick = absent;
  $('main').querySelector('[data-go=att]').onclick = () => attend(null);
  $('main').querySelector('[data-go=pay]').onclick = payslip;
  $('main').querySelector('[data-go=card]').onclick = cardOrder;
  { const d = $('main').querySelector('[data-go=dress]'); if(d) d.onclick = dressReport; }
}

function perf(){
  setBack(home);
  const st = ME.stats||{}, r = (k,v,c='') => `<div class="row ${c}"><span>${k}</span><b>${v}</b></div>`;
  const [y,m] = String(ME.month).split('-').map(Number), d = Number(String(ME.business_date).slice(8,10));
  const u = ME.pay_type === 'daily' ? '日給' : '時給';
  const slides = (ME.slides||[]).map(s=>`<div class="muted sm">${esc(s.name)}：${esc(nextTxt(s))}</div>`).join('');
  const q = st.quota != null && Number(st.quota) > 0 ? Number(st.quota) : null, dh = Number(st.douhan||0);
  const dhCard = q ? `${r('同伴', `${dh}回 / ノルマ ${q}回`, dh<q?'warn':'')}${dh<q?`<div class="muted sm">あと${q-dh}回（未達の場合は月末に罰金）</div>`:'<div class="muted sm">ノルマ達成</div>'}` : r('同伴', `${dh}回`);
  const fines = (ME.fines||[]), fsum = Number(st.fines||0);
  const fl = fines.map(f=>`<div class="muted sm">${Number(String(f.date).slice(5,7))}/${Number(String(f.date).slice(8,10))} ${esc(f.reason||'')}　${f.wage_pct?`時給の${f.wage_pct}%`:yen(f.amount)}</div>`).join('');
  show(`<div class="subh">${m}月（${m}/${d} まで）</div>
    <div class="card">${r(esc(KL)+'小計', yen(st.sales))}${r(`決定${u}（今）`, wageNow()?yen(wageNow()):'—')}${slides}</div>
    <div class="card">${dhCard}</div>
    <div class="card">${r('出勤日数', `${Number(st.days||0)}日`)}${r('稼働時間', HM(st.hours))}${r('ポイント', `${Number(st.points||0)}`)}${r('反応◎', `${Number(st.reactions||0)}回`)}</div>
    <div class="card">${r('罰金（今月）', fines.length?yen(fsum):'なし')}${fl}</div>`);
}

// v0.03・SQL 098：当日欠勤。理由は自由入力。罰金のルールは本人の給与（時給／日給）の分だけ出し、今の時刻に当たる行を赤くする
const WD = ['日','月','火','水','木','金','土'];
const dTxt = d => { const x = new Date(d + 'T00:00:00+09:00'); return `${x.getMonth()+1}月${x.getDate()}日（${WD[x.getDay()]}）`; };
const tTxt = t => new Date(t).toLocaleTimeString('ja-JP', { timeZone:'Asia/Tokyo', hour:'2-digit', minute:'2-digit', hour12:false });
const fineTxt = (f, pt) => !f ? '—' : f.calc === 'hourly_pct' ? `時給の${f.value}%` : f.calc === 'daily_pct' ? `日給の${f.value}%` : f.calc === 'yen' ? yen(f.value) : '—';
async function absent(){
  setBack(home); show('<div class="card c muted">読み込み中…</div>');
  const r = await sb.rpc('cast_absence_info', { p_token: TOKEN });
  if(r.error){ fail(r.error.message); return; }
  const A = r.data;
  if(A.sent){ absentDone(A.date, A.sent.at, A.sent.fine_name, true); return; }
  const t = A.types || {}, rows = [['13時までの連絡', t.early, false], ['13時以降・金曜日・イベント日', t.late, true]].filter(x => x[1]);
  const rule = rows.length ? `<div class="warnbox"><b class="t">当日欠勤の罰金</b><table>${rows.map(x => `<tr class="${x[2]===!!A.is_late?'hi':''}"><td>${x[0]}</td><td>${esc(fineTxt(x[1], t.pay_type))}</td></tr>`).join('')}</table>
    <div class="now">現在の連絡は「${A.is_late ? '13時以降・金曜日・イベント日' : '13時までの連絡'}」に該当します</div></div>` : '';
  show(`<div class="subh">${dTxt(A.date)} ${tTxt(A.now)}</div>
    <div class="card"><label class="f" for="abR">理由</label><textarea id="abR" maxlength="300"></textarea></div>${rule}
    <button class="btn" id="abGo">欠勤連絡</button><p class="muted sm" style="margin:10px 2px">送信内容は公式 LINE のトークにも送信されます</p>`);
  $('abGo').onclick = async () => {
    const rs = $('abR').value.trim(); if(!rs){ await uiAlert('理由を入力してください'); return; }
    if(!await uiConfirm(`${dTxt(A.date)}の欠勤連絡を送信しますか？`)) return;
    $('abGo').disabled = true;
    const q = await sb.rpc('cast_absence_submit', { p_token: TOKEN, p_reason: rs });
    if(q.error){ $('abGo').disabled = false; await uiAlert(q.error.message); return; }
    let lineOk = true;
    try{ await liff.sendMessages([{ type:'text', text:`【当日欠勤】${dTxt(q.data.date)} ${tTxt(q.data.at)}\n${ME.name}\n理由：${rs}` }]); }catch(e){ lineOk = false; }
    absentDone(q.data.date, q.data.at, q.data.fine_name, false, lineOk);
  };
}
function absentDone(date, at, fine, already, lineOk = true){
  setBack(home);
  show(`<div class="card c"><div class="big">${already ? '送信済み' : '送信完了'}</div><p>${dTxt(date)}の欠勤連絡を受付しました。</p>
    <div class="row" style="text-align:left"><span>連絡時刻</span><b>${tTxt(at)}</b></div><div class="row" style="text-align:left"><span>罰金</span><b>${esc(fine || 'なし')}</b></div>
    <div class="muted sm">取消は黒服にご連絡ください</div>${lineOk ? '' : '<p class="err sm">公式 LINE への送信に失敗しました。黒服に LINE でもご連絡ください</p>'}</div>
    <button class="btn g" id="abHome">ホーム</button>`);
  $('abHome').onclick = home;
}

// v0.04・SQL 099：勤怠（月ごとの打刻の履歴。時刻は丸め後＝給与計算と同じ）
const ym = d => String(d).slice(0,7), mAdd = (m, n) => { const [y, mo] = m.split('-').map(Number); const x = new Date(y, mo - 1 + n, 1); return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-01`; };
async function attend(month){
  setBack(home); show('<div class="card c muted">読み込み中…</div>');
  const r = await sb.rpc('cast_attendance', { p_token: TOKEN, p_month: month });
  if(r.error){ fail(r.error.message); return; }
  const A = r.data, m = String(A.month), cur = String(ME.month), [y, mo] = m.split('-').map(Number);
  const prevOk = m > mAdd(cur, -12), nextOk = m < cur;
  const rows = (A.days||[]).map(d => `<tr><td>${Number(d.date.slice(5,7))}/${Number(d.date.slice(8,10))}（${WD[new Date(d.date+'T00:00:00+09:00').getDay()]}）</td><td>${d.in?tTxt(d.in):'—'}</td><td>${d.out?tTxt(d.out):'—'}</td><td>${d.hours!=null?HM(d.hours).replace('時間',':').replace('分',''):'—'}</td><td class="mk">${[d.douhan?'同伴':'', d.after?'アフター':''].filter(Boolean).join('・')}</td></tr>`).join('');
  show(`<div class="mon"><button id="mP" ${prevOk?'':'disabled'} aria-label="前の月">‹</button><b>${y}年${mo}月</b><button id="mN" ${nextOk?'':'disabled'} aria-label="次の月">›</button></div>
    <div class="card"><div class="row"><span>出勤日数</span><b>${Number(A.total_days)}日</b></div><div class="row"><span>稼働時間</span><b>${HM(A.total_hours)}</b></div></div>
    <div class="card" style="padding:0;overflow:hidden">${rows?`<table class="t"><tr><th>日付</th><th>出勤</th><th>退勤</th><th>稼働</th><th></th></tr>${rows}</table>`:'<div class="muted" style="padding:12px">打刻はありません</div>'}<div class="muted sm" style="padding:8px 10px">時刻は15分丸め後（給与計算と同じ）</div></div>`);
  $('mP').onclick = () => attend(mAdd(m, -1)); $('mN').onclick = () => attend(mAdd(m, 1));
}

// v0.04・SQL 099：給与明細（前月分だけ。管理サイトの報酬支払明細書と同じ中身）・PDF・受取確認（15日から、手書きサイン）
const N = v => Number(v||0), cm = v => N(v) ? N(v).toLocaleString('ja-JP') : '--';
function slipHtml(P){
  const x = P.slip, L = (k, v, c='') => `<div class="row ${c}"><span>${esc(k)}</span><b>${v}</b></div>`, B = k => N(x.backs?.[k]?.amount);
  const ded = N(x.ctax) + N(x.fines) + N(x.quota_fine) + N(x.welfare) + N(x.special_deduct);
  const pay = [L(x.pay_type==='daily'?'報酬（日給）':'報酬（時給）', cm(x.time_pay)), L('小計バック', cm(x.kakari_back)), ...(x.seppan?[L(`折半（${N(x.seppan_pct)}%）`, cm(x.seppan_pay))]:[]), L('HC', cm(B('hc'))), L('ボトルバック', cm(B('bottle'))), L('商品バック', cm(B('other'))), L('手当など、その他', cm(N(x.allowance)+N(x.special_pay))), L('合計', cm(x.taxable), 's')];
  const dd = [L('消費税', cm(x.ctax)), ...(P.fine_names||[]).map(f => L(f, cm(x.fine_items?.[f]))), L('同伴ノルマ', cm(x.quota_fine)), L('厚生費', cm(x.welfare)), L('個別控除', cm(x.special_deduct)), L('合計', cm(ded), 's')];
  const [y, mo] = String(P.month).split('-').map(Number), net = N(x.net);
  return `<div class="card"><div class="ttl">報酬支払明細書</div><div class="muted sm" style="text-align:center;margin-bottom:6px">${y}年${mo}月分　${esc(P.store_name)}　${esc(P.name)}${P.real_name?'/'+esc(P.real_name):''}</div>
      ${L('稼働日数', `${N(x.days)}日`)}${L('稼働時間', HM(x.hours))}${L(x.pay_type==='daily'?'決定日給':'決定時給', x.wage?yen(x.wage):'--')}</div>
    <div class="card"><div class="gh">支給対象</div>${pay.join('')}</div><div class="card"><div class="gh">控除対象</div>${dd.join('')}</div>
    <div class="card">${L('総支給額', cm(N(x.taxable)-ded))}${L('課税対象額', cm(x.taxable))}${L('源泉徴収', cm(x.withholding))}${L('日払（立替）', cm(x.advance))}${L('残り支給額', (net<0?'−':'')+'¥'+Math.abs(net).toLocaleString('ja-JP'), 'n')}</div>`;
}
// v0.07・SQL 101：サインの画像を置いて、店から送信。置けなかった・送れなかった時は、次に給与明細を開いた時に送り直す
async function pushSign(id, png, uploaded){
  try{
    if(!uploaded){ const blob = await (await fetch(png)).blob(); const up = await sb.storage.from('pay-signs').upload(`${id}.png`, blob, { contentType:'image/png', upsert:false }); if(up.error && !/exists|Duplicate/i.test(up.error.message)) return false; }
    const r = await sb.rpc('cast_pay_push', { p_token: TOKEN, p_receipt: id }); return !r.error && r.data?.status === 'sent';
  }catch(e){ return false; }
}
async function payslip(){
  setBack(home); show('<div class="card c muted">読み込み中…</div>');
  { const pd = await sb.rpc('cast_pay_pending', { p_token: TOKEN }); if(!pd.error && pd.data) await pushSign(pd.data.id, pd.data.signature, pd.data.uploaded); }
  const r = await sb.rpc('cast_pay_slip', { p_token: TOKEN });
  if(r.error){ fail(r.error.message); return; }
  const P = r.data, [y, mo] = String(P.month).split('-').map(Number);
  if(!P.slip){ show(`<div class="mon"><span></span><b>${y}年${mo}月分</b><span></span></div><div class="card c muted">${mo}月分の明細はありません</div>`); return; }
  const md = d => `${Number(String(d).slice(5,7))}/${Number(String(d).slice(8,10))}`;
  const adv = (P.advances||[]).map(a => `<div class="row"><span>${md(a.date)}（${WD[new Date(a.date+'T00:00:00+09:00').getDay()]}）</span><b>${yen(a.amount)}</b></div>`).join('');
  const fl = (P.fines||[]).map(f => `<div class="row"><span>${md(f.date)} ${esc(f.reason||'')}</span><b>${f.wage_pct?`時給の${f.wage_pct}%`:yen(f.amount)}</b></div>`).join('');
  const rc = P.receipt ? `<div class="card c"><div class="big">受取確認済み</div><p>${mo}月分　${new Date(P.receipt.signed_at).toLocaleString('ja-JP',{timeZone:'Asia/Tokyo',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}</p></div>`
    : P.can_sign ? `<div class="card"><div class="gh">受取確認（給与を受け取ったらサイン）</div><canvas class="sign" id="sg"></canvas><div class="row" style="margin-top:8px;gap:8px"><button class="btn g" id="sgClr" style="width:auto;padding:10px 16px">再入力</button><button class="btn" id="sgOk" style="flex:1">受取確認</button></div></div>`
    : `<div class="card muted sm">受取確認は15日からです</div>`;
  show(`<div class="mon"><span></span><b>${y}年${mo}月分</b><span></span></div><div id="slip">${slipHtml(P)}</div>
    <div class="card"><div class="gh">日払（立替）</div>${adv||'<div class="muted sm">なし</div>'}</div><div class="card"><div class="gh">罰金</div>${fl||'<div class="muted sm">なし</div>'}</div>
    <button class="btn g" id="pdf" style="margin-bottom:10px">PDF ダウンロード</button>${rc}`);
  $('pdf').onclick = () => slipPdf(P);
  if(P.receipt || !P.can_sign) return;
  const cv = $('sg'), W = cv.clientWidth, H = cv.clientHeight, dpr = Math.min(2, Math.max(1, window.devicePixelRatio||1)); cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr);
  const g = cv.getContext('2d'); g.scale(dpr, dpr); let drawn = false, down = false;
  const clear = () => { g.fillStyle = '#fff'; g.fillRect(0, 0, W, H); g.strokeStyle = '#111'; g.lineWidth = 2.6; g.lineCap = 'round'; g.lineJoin = 'round'; drawn = false; }; clear();
  const pos = e => { const b = cv.getBoundingClientRect(); return [(e.clientX-b.left)*W/b.width, (e.clientY-b.top)*H/b.height]; };
  cv.onpointerdown = e => { e.preventDefault(); down = true; try{ cv.setPointerCapture(e.pointerId); }catch(_){} const [a, b] = pos(e); g.beginPath(); g.moveTo(a, b); g.lineTo(a+0.1, b+0.1); g.stroke(); drawn = true; };
  cv.onpointermove = e => { if(!down) return; e.preventDefault(); const [a, b] = pos(e); g.lineTo(a, b); g.stroke(); };
  cv.onpointerup = cv.onpointercancel = () => { down = false; };
  $('sgClr').onclick = clear;
  $('sgOk').onclick = async () => {
    if(!drawn){ await uiAlert('サインを入力してください'); return; }
    if(!await uiConfirm(`${mo}月分の給与を受け取りましたか？\n受取確認は取消できません`)) return;
    $('sgOk').disabled = true;
    const png = cv.toDataURL('image/png');
    const q = await sb.rpc('cast_pay_sign', { p_token: TOKEN, p_signature: png });
    if(q.error){ $('sgOk').disabled = false; await uiAlert(q.error.message); return; }
    const net = N(q.data.net), at = new Date(q.data.signed_at).toLocaleString('ja-JP',{timeZone:'Asia/Tokyo',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
    try{ await liff.sendMessages([{ type:'text', text:`${y}年${mo}月分の給料として ${(net<0?'−':'')}${Math.abs(net).toLocaleString('ja-JP')}円 を受け取りました。\n${ME.name}（${at}）` }]); }catch(e){ await uiAlert('公式 LINE への送信に失敗しました。黒服に LINE でもご連絡ください'); }
    // v0.06・SQL 100：サインの画像を保存して、店（公式 LINE）から本人のトークへ「○月分 給料 ○円 の受取サイン」＋画像を送信
    await pushSign(q.data.id, png, false);
    payslip();
  };
}
// PDF：画面の明細をそのまま A4 縦1枚に
let pdfLib = null;
function loadJs(u){ return new Promise((ok, ng) => { const sc = document.createElement('script'); sc.src = u; sc.onload = ok; sc.onerror = () => ng(new Error('読み込みに失敗しました')); document.head.appendChild(sc); }); }
async function slipPdf(P){
  const b = $('pdf'); b.disabled = true; b.textContent = '作成中…';
  try{
    if(!pdfLib) pdfLib = Promise.all([loadJs('https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js'), loadJs('https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js')]);
    await pdfLib;
    const c = await html2canvas($('slip'), { scale: 2, backgroundColor: getComputedStyle(document.body).backgroundColor });
    const pdf = new window.jspdf.jsPDF({ unit:'mm', format:'a4' }), k = Math.min(190 / c.width, 277 / c.height), w = c.width * k, h = c.height * k;
    pdf.addImage(c.toDataURL('image/jpeg', 0.92), 'JPEG', (210 - w) / 2, 10, w, h);
    pdf.save(`給与明細_${ym(P.month)}_${P.name}.pdf`);
  }catch(e){ await uiAlert('PDF を作成できませんでした：' + (e.message||e)); }
  finally{ b.disabled = false; b.textContent = 'PDF ダウンロード'; }
}

// v0.09・SQL 105：名刺発注。v0.10・SQL 107：印刷する名前は苗字と名前（両方必須）、「前回と同じ」ボタンで前回の名前を入れる。店の Gmail から印刷屋さんへメール。名刺代は給与から控除
async function cardOrder(){
  setBack(home); show('<div class="card c muted">読み込み中…</div>');
  const r = await sb.rpc('cast_card_info', { p_token: TOKEN });
  if(r.error){ fail(r.error.message); return; }
  const C = r.data, ds = t => new Date(t).toLocaleDateString('ja-JP', { timeZone:'Asia/Tokyo', month:'numeric', day:'numeric' });
  const hist = (C.history||[]).map(h => `<div class="row"><span>${ds(h.at)}　${esc(h.print_name)}</span><b>${h.qty}枚</b></div>`).join('');
  if(!C.ready){ show(`<div class="card c muted">名刺発注は準備中です</div>${hist?`<div class="card"><div class="gh">発注履歴</div>${hist}</div>`:''}`); return; }
  const lf = C.last_family || '', lg = C.last_given || '', fld = 'width:100%;font:inherit;font-size:16px;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--card);color:var(--ink)';
  show(`<div class="card"><div class="row"><span>依頼者</span><b>${esc(C.name)}</b></div>
      <div class="row" style="margin-top:10px"><span>印刷する名前（フルネーム）</span>${lf?'<button class="btn g" id="cnLast" style="width:auto;padding:6px 12px;font-size:14px">前回と同じ</button>':''}</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px"><label class="f">苗字<input id="cnF" maxlength="20" placeholder="例：一ノ瀬" style="${fld}"></label><label class="f">名前<input id="cnG" maxlength="20" placeholder="例：美緒" style="${fld}"></label></div>
      <div class="row" style="margin-top:10px"><span>枚数</span><b>${C.qty}枚 ${yen(C.price)}</b></div></div>
    <div class="err sm" style="margin:0 2px 12px">名刺代 ${yen(C.price)}は、給与から控除されます。</div>
    <button class="btn" id="cnGo">名刺発注</button>${hist?`<div class="card" style="margin-top:12px"><div class="gh">発注履歴</div>${hist}</div>`:''}`);
  if(lf) $('cnLast').onclick = () => { $('cnF').value = lf; $('cnG').value = lg; }; /* 初回は出さない（オーナー 2026-10-15） */
  $('cnGo').onclick = async () => {
    const f = $('cnF').value.trim(), g = $('cnG').value.trim(), nm = `${f}　${g}`;
    if(!f || !g){ await uiAlert('苗字と名前を両方入力してください'); return; }
    if(!await uiConfirm(`名刺 ${C.qty}枚（${nm}）を発注しますか？\n名刺代 ${yen(C.price)}は給与から控除されます`)) return;
    $('cnGo').disabled = true;
    const q = await sb.rpc('cast_card_order', { p_token: TOKEN, p_family: f, p_given: g });
    if(q.error){ $('cnGo').disabled = false; await uiAlert(q.error.message); return; }
    show(`<div class="card c"><div class="big">送信完了</div><p>名刺 ${q.data.qty}枚（${esc(nm)}）の発注を受付しました。</p>${q.data.sent?'':'<p class="err sm">印刷屋さんへのメールの送信に失敗しました。黒服にご連絡ください</p>'}</div><button class="btn g" id="cnHome">ホーム</button>`);
    $('cnHome').onclick = home;
  };
}

// v0.12・SQL 110：ドレス新調日。決められた日までに、新しいドレスの金額とレシートの写真を提出。前月の決定時給×3時間未満なら罰金（自動）
async function shrinkJpeg(file){ const img = await new Promise((ok, ng) => { const i = new Image(); i.onload = () => ok(i); i.onerror = ng; i.src = URL.createObjectURL(file); });
  const k = Math.min(1, 1600 / Math.max(img.width, img.height)), c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); return await new Promise(ok => c.toBlob(ok, 'image/jpeg', 0.85)); }
async function dressReport(){
  setBack(home); show('<div class="card c muted">読み込み中…</div>');
  const r = await sb.rpc('cast_dress_info', { p_token: TOKEN });
  if(r.error){ fail(r.error.message); return; }
  const D = r.data; if(!D.enabled){ home(); return; }
  const due = dTxt(D.due), rp = D.report, f = D.fine, unit = D.pay_type === 'daily' ? '日給' : '時給';
  const fineTxt2 = !f ? '—' : f.calc === 'hourly_pct' ? `時給 × ${f.value/100}時間` : f.calc === 'daily_pct' ? `日給の${f.value}%` : f.calc === 'yen' ? yen(f.value) : '—';
  const rule = `<div class="warnbox"><b class="t">新調日の決まり</b>${D.threshold?`ドレスの金額が 前月の決定${unit} × 3時間（<b>${yen(D.threshold)}</b>）以上なら罰金なし。`:'前月の決定時給がないため、金額の判定はありません。'}足りない時・期限までに提出がない時は 罰金（${esc(fineTxt2)}）</div>`;
  const RES = { ok:'罰金なし', short:'罰金あり', missing:'提出なし（罰金あり）', nojudge:'判定なし' };
  if(rp && rp.status !== 'pending_photo'){ show(`<div class="card"><div class="row"><span>新調日</span><b>${due}</b></div></div><div class="card c"><div class="big">提出済み</div>${rp.amount?`<div class="row" style="text-align:left"><span>金額</span><b>${yen(rp.amount)}</b></div>`:''}<div class="row" style="text-align:left"><span>判定</span><b class="${rp.status==='ok'?'':'err'}">${RES[rp.status]||''}</b></div></div>${rule}`); return; }
  const fld = 'width:100%;font:inherit;font-size:16px;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--card);color:var(--ink);text-align:right';
  show(`<div class="card"><div class="row"><span>新調日（提出の期限）</span><b>${due}</b></div><div class="muted sm">この日までに新しいドレスを買って、金額とレシートの写真を提出します</div></div>
    <div class="card"><label class="f" for="drA">ドレスの金額（円）</label><input id="drA" inputmode="numeric" placeholder="例：58000" style="${fld}">
      <label class="f" style="margin-top:10px">レシートの写真</label><input type="file" id="drP" accept="image/*" style="width:100%;font:inherit;font-size:14px"><div id="drPv" class="muted sm"></div></div>
    ${rule}<button class="btn" id="drGo">提出</button>`);
  $('drP').onchange = () => { $('drPv').textContent = $('drP').files[0] ? '写真を選びました' : ''; };
  $('drGo').onclick = async () => {
    const a = Number(String($('drA').value).replace(/[^0-9]/g, '')), file = $('drP').files[0];
    if(!(a > 0)){ await uiAlert('ドレスの金額を入力してください'); return; }
    if(!file){ await uiAlert('レシートの写真を選んでください'); return; }
    if(!await uiConfirm(`ドレス ${yen(a)} を提出しますか？\n提出は1回だけです`)) return;
    $('drGo').disabled = true;
    try{
      const q = await sb.rpc('cast_dress_submit', { p_token: TOKEN, p_amount: a }); if(q.error) throw q.error;
      const blob = await shrinkJpeg(file);
      const up = await sb.storage.from('dress-receipts').upload(`${q.data.id}.jpg`, blob, { contentType:'image/jpeg', upsert:false }); if(up.error && !/exists|Duplicate/i.test(up.error.message)) throw up.error;
      const d = await sb.rpc('cast_dress_done', { p_token: TOKEN, p_report: q.data.id }); if(d.error) throw d.error;
      /* SQL 111：記録は店の公式 LINE から本人へ（金額＋レシートの写真）。キャストからの文は送らない */
      dressReport();
    }catch(e){ $('drGo').disabled = false; await uiAlert(e.message || String(e)); }
  };
}

start();
