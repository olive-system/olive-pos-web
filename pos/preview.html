  .ord4 .qty{display:flex;align-items:center;gap:6px}.ord4 .qty button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:18px}
  .prod{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;text-align:left;min-height:64px}.prod .p{display:block;color:var(--muted);font-size:13px;margin-top:4px}
  .num{display:inline-flex;align-items:center;gap:8px;font-size:22px;font-weight:700}.num button{width:40px;height:40px;border-radius:50%;font-size:22px;padding:0}

  .modal .box{background:#fff;border-radius:16px;padding:18px;width:min(760px,92vw);max-height:88vh;overflow:auto}

  .login{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:50}
  .login form{width:360px;background:#fff;padding:32px;border-radius:16px;border:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
  .hidden{display:none!important}.muted{color:var(--muted)}.right{text-align:right}
  .badge.warnb{background:var(--warn)}.badge.gray{background:#999}.badge.tag{background:#5a7d9a}
  .cast-line{display:flex;align-items:center;gap:8px;padding:4px 0 4px 12px;font-size:15px}
  .kindbtn{padding:10px 14px;border-radius:10px;background:#eee}.kindbtn.on{background:var(--ink);color:#fff}
  .tbl .tags{font-size:13px;color:#5a7d9a}
  @media print{ body>*{display:none!important} #printArea{display:block!important;font-family:"Hiragino Sans",sans-serif;font-size:13px;width:72mm} }
  #printArea{display:none}
  .settings{display:grid;grid-template-columns:170px 1fr 1.2fr;gap:12px;min-height:70vh}.settings .menu{display:flex;flex-direction:column;gap:6px}.settings .menu button{text-align:left}
  .lst{display:flex;flex-direction:column;gap:6px}.lst .row{display:flex;align-items:center;gap:8px;padding:12px;border-radius:10px;background:#fff;border:1px solid var(--line);font-size:16px;user-select:none;-webkit-user-select:none}
  .lst .row.on{background:#e8eefb;border-color:var(--blue);color:var(--ink)}#v-cust .card>div{min-width:0}#cuBtSel{min-width:0}.lst .row .nm{flex:1}.lst .row .hd{color:#aaa;font-size:20px;padding:0 6px;touch-action:none}.lst .row.drag{opacity:.4}
  .form{display:flex;flex-direction:column;gap:10px}.form label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}.form input,.form select{font-size:16px}
  .form .sw{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--ink)}.form .sw input{width:22px;height:22px}
  #v-settings .settings{height:calc(100dvh - 150px);min-height:420px}#v-settings .settings>div{min-height:0;overflow-y:auto}#v-settings .settings>div:nth-child(2){display:flex;flex-direction:column;overflow:hidden}#setList{flex:1;overflow-y:auto;min-height:0;padding-bottom:24px}#setCat{position:sticky;top:0;z-index:1;flex:none}.form label.sw{flex-direction:row;align-items:center;font-size:15px;color:var(--ink)}.lst .row small{white-space:nowrap}

  header{background:#3a3a3a;color:#fff;padding:8px 16px;gap:10px}
  header .store{background:#7a6a4a;color:#fff;padding:10px 40px;border-radius:10px;font-size:20px}

  header .dt small{display:block;font-size:12px}
  header .nav{margin-left:auto;display:flex;gap:8px}
  header .nav button{position:relative;background:#c9b37a;color:#fff;font-weight:700;padding:10px 14px;border-radius:50%;min-width:74px;height:74px;font-size:14px;line-height:1.1}
  header .nav button.on{background:#a08a4f}

  .tables{grid-template-columns:repeat(5,1fr);gap:16px}
  .tbl{background:linear-gradient(#a9c3f0,#5f86d9);color:#1a1a1a;border:2px solid #4a6fb8;min-height:170px}
  /* v10.81〜82（82＝.pill・.casts を .tbl.busy に効くよう修正）：来店中の卓も170pxに収めて段の高さをそろえる */.tables .tbl{gap:2px}.tables .tbl.busy .pill{margin:2px 0}.tables .tbl .total{line-height:1.15}.tables .tbl.busy .casts{padding:2px 8px}.tables .tbl .name,.tables .tbl .cust,.tables .tbl .row{line-height:1.25}
  .tbl .empty{color:#1a2a4a;font-size:28px;font-weight:600}

  .tbl.busy.oki{background:linear-gradient(#e8e8e8,#bdbdbd);border-color:#999}
  /* v10.89：会計後のお預かり返却リマインド（お渡しするまで卓いっぱいに点滅） */.tbl.hand{background:#d9534f;color:#fff;border-color:#8b1e1b;text-align:center;justify-content:center;gap:6px;animation:handBlink 1s steps(1) infinite}.tbl.hand .name{font-size:18px}.tbl.hand .hmsg{font-size:13px;font-weight:700;white-space:nowrap}.tbl.hand .hitem{text-align:left;font-size:22px;font-weight:800;line-height:1.25;overflow-wrap:anywhere}.tbl.hand .hitem small{font-size:14px;font-weight:600}@keyframes handBlink{50%{background:#fff3b0;color:#8b1e1b}}

  .rrow{display:flex;align-items:center;gap:12px;padding:10px 16px;min-height:67px;box-sizing:border-box;background:#fff;border:1px solid var(--line);border-radius:12px;font-size:20px;user-select:none;-webkit-user-select:none}
  .rrow .nm{flex:1}.rrow .hd{color:#aaa;font-size:24px;padding:0 6px;touch-action:none}.rrow.drag{opacity:.4}.rrow.inactive{opacity:.5}

/* v10.76〜81：右の列を整理（v10.81＝列の幅を元の 280px｜1.25｜1 に戻し、文字の大きさで収める（銘柄14px・日付は銘柄の下）。「○か月以上」と両側のボタンは40px。v10.80＝顧客一覧の期間（○か月〜）を常に表示し［全員］と［ご来店なし］の間に。左の列 230px。v10.79＝ボトル欄を 銘柄・日付・残量・✕（削除）／キープ名／飲切・期限切・ボトル移動 に。列の幅は 200px｜1｜1.25。v10.78＝列の幅を 230px｜1｜1.1 にして右の列を広げ、ボトル欄を3段に＝銘柄＋日付／キープ名＋残量／飲み切り・期限切れ・ボトル移動・削除）。来店履歴は全行同じ形（上＝日付・下＝卓・人数・右＝金額、日付は今年なら M/D）。ボトル1本の欄を6段→4段に（銘柄＋日付／キープ名／残量＋飲み切り／期限切れ・ボトル移動・削除） */
#cuSide .item.bt{display:flex;flex-direction:column;align-items:stretch;gap:6px!important}
#cuSide .bt1{display:flex;align-items:center;gap:8px}#cuSide .bt1 .n{flex:1 1 0;min-width:0;overflow-wrap:anywhere;font-size:16px;font-weight:600;line-height:1.35}#cuSide .bt1 .n small{font-size:12px;font-weight:400;margin-left:6px;white-space:nowrap;color:var(--muted)}#cuSide .bt1 select{flex:none;width:auto;padding-left:6px!important;padding-right:2px!important}#cuSide .bt1 button.bx{flex:none;width:30px;padding:0;color:var(--muted);font-size:14px}
#cuSide .bt2{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:12px;margin:0}#cuSide .bt2 .kn{flex:1 1 90px;min-width:0;display:flex;align-items:center;gap:4px}#cuSide .bt2 .kn span{font-size:10px}/* v10.85：キープ名の文字を小さく・ボタンは「移動」にして2段に収める */#cuSide .bt2 span{white-space:nowrap}#cuSide .bt2 input{flex:1 1 0;min-width:0;width:0}#cuSide .bt2 .bt3{flex:none;margin-left:auto}
#cuModes{gap:4px!important;flex-wrap:nowrap!important}#cuModes .chip,#cuMonths{height:40px;box-sizing:border-box;font-size:14px;white-space:nowrap;padding:0 10px}#cuMonths{width:auto;padding:0 2px 0 8px}
#cuSide .cvis{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid #f0eee9;font-size:14px}#cuSide .cvis:last-child{border-bottom:none}#cuSide .cvis .fit1{flex:1 1 0;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#cuSide .cvis .amt{font-variant-numeric:tabular-nums;white-space:nowrap}
/* v10.91：来店履歴の年まとめ（顧客サイトと同じ） */.vyr{border-top:1px solid #f0eee9}.vyr>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;padding:9px 0;font-size:14px;font-weight:600}.vyr>summary::-webkit-details-marker{display:none}.vyr>summary::after{content:'▾';color:var(--muted)}.vyr[open]>summary::after{content:'▴'}.vyr>div{padding-left:12px}#cuSide .vyr>.cvis{padding-left:12px}

<body>

<main>

  <div style="display:flex;align-items:center;justify-content:center;gap:60px;min-height:46vh;flex-wrap:wrap">

<script>
// v11.25・SQL 080：店ごとの「係」の名称（stores.kakari_label。空なら「係」）。画面の「係」は KL を差し込む。見出しの一覧は kReg に入れておき、kSet で付け直す。操作ログに残す操作の名前は「係」のまま（表示の時に kl で読み替える）
let KL='係'; const kl=s=>KL==='係'?s:String(s??'').replace(/係/g,KL); const actL=a=>kl(a==='伝票取消'?'伝票削除':a); /* v11.28：操作ログの「伝票取消」は「伝票削除」と表示（記録の名前は変えない） */ const KT=[];
function kReg(...os){ const walk=o=>{ for(const k of Object.keys(o)){ const v=o[k]; if(typeof v==='string'){ if(v.includes('係')) KT.push([o,k,v]); } else if(v&&typeof v==='object') walk(v); } }; os.forEach(walk); }
function kSet(v){ KL=(v&&String(v).trim())||'係'; KT.forEach(([o,k,v])=>{ o[k]=kl(v); }); }
function kDom(){ const a=$('castAddBtn'); if(a) a.textContent='＋ '+KL+'／同伴'; const t=$('castAddTtl'); if(t) t.textContent=KL+'／同伴を追加'; const c=document.querySelector('#castRole [data-cr=kakari]'); if(c) c.textContent=KL; }
document.addEventListener('click',e=>{ const q=e.target.closest&&e.target.closest('.hint .qm'); if(q){ e.preventDefault(); e.stopPropagation(); q.closest('.hint').classList.toggle('open'); } },true); /* 15番：「？」で詳しい説明を開く・閉じる */
const SUPABASE_URL='https://gjqaxenwvvazhjtziusf.supabase.co', SUPABASE_KEY='sb_publishable_pPfJUvJd6iJeHBNiD7XkWA_2RKF7JYw';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);
const esc=t=>String(t??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const yen = n => (n ?? 0).toLocaleString('ja-JP') + '円';
const hm = t => { const d=new Date(t); return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; };
const ROLE = { douhan1:'同伴①', douhan2:'同伴②', douhan:'同伴', none:'' };

setInterval(()=>{ const d=new Date(); $('clock').textContent=`${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; $('hdDate').textContent=`${d.getMonth()+1}月${d.getDate()}日`; },1000);

async function start(){ const { data:{ session } } = await sb.auth.getSession(); if (!session) return;
  $('login').classList.add('hidden'); checkVersion(); await loadMasters(); rtSub(); await loadHall(); setInterval(loadHall,60000); show('v-hall'); }

async function loadMasters(){
  const [s,st,pm,tb,ca,pr,sf,cu] = await Promise.all([
    sb.from('stores').select('*').limit(1), sb.from('pos_settings').select('*').limit(1),
    sb.from('pricing_modes').select('*').eq('is_active',true).order('sort_order').order('id'), sb.from('tables').select('*').order('sort_order').order('id'),
    sb.from('categories').select('*').order('sort_order').order('id'), sb.from('products').select('*').order('sort_order').order('id'),
    sb.from('staff').select('id,display_name,kind').eq('is_active',true).order('sort_order').order('id'), cuLoadAll()]);
  store=s.data?.[0]; kSet(store?.kakari_label); kDom(); settings=st.data?.[0]; modes=pm.data||[]; tables=tb.data||[]; categories=ca.data||[]; products=pr.data||[]; staff=sf.data||[]; customers=(cu.data||[]).map(cuK);
  $('storeName').textContent = store?.name || '店舗未設定';
  // v11.16・SQL 065：閉店時間（管理サイト「POS設定」の店の情報）。体験の時給の打ち止めに使う。読めない時は 1:00
  if(store){ const r=await sb.rpc('store_close_time',{p_store:store.id}); if(!r.error&&/^\d{2}:\d{2}$/.test(r.data||'')) closeHM=r.data; }
  await expireTrials();
}
// 体験キャストは1日限り：登録した営業日の翌営業日になったら自動で「削除済」にする（記録は残る）
let trialSweepDay=null;
async function expireTrials(){ const bd=businessDate(); if(trialSweepDay===bd||!store) return; try{ const r=await sb.from('staff').select('id,display_name,created_at').eq('is_trial',true).eq('is_active',true); if(r.error) return; const old=(r.data||[]).filter(x=>businessDate(new Date(x.created_at))<bd); const done=[]; for(const x of old){ const u=await sb.from('staff').update({is_active:false}).eq('id',x.id); if(!u.error){ done.push(x.id); await logOp('体験キャストの自動削除',{name:x.display_name,registered:businessDate(new Date(x.created_at))},null,true); } } if(done.length) staff=staff.filter(z=>!done.includes(z.id)); trialSweepDay=bd; }catch(e){ console.warn('expireTrials',e); } }

// ---------- リアルタイム v11.18・SQL 067：設定・伝票がほかで変わったら、すぐ読み直す（つながらない時は、これまでどおり1分ごと） ----------
// 設定：ホール・伝票を見ている時に読み直す（メニュー登録・注文・設定・顧客の画面の間は、ホールに戻った時）。伝票：ホールは読み直し、開いている伝票は
// もう1台で変わった時だけ最新にして「もう1台で変更されました」。この端末で触った直後（3秒）と確認の画面が出ている間は待つ
let rtCh=null, rtMastT=0, rtHallT=0, rtBillT=0, rtTap=0, rtMastWait=false, billFp='';
const fpOf=b=>JSON.stringify(b,(k,v)=>k==='depPays'||k==='totals'?undefined:v);
document.addEventListener('pointerdown',()=>{ rtTap=Date.now(); },true);
const rtBusy=()=>!!document.querySelector('.modal.on');

  clearTimeout(rtHallT); rtHallT=setTimeout(()=>{ if(onView('v-hall')&&!rtBusy()) loadHall(); },1200);
  if(cur&&p.bill===cur.id){ clearTimeout(rtBillT); rtBillT=setTimeout(rtBillCheck,Math.max(800,rtTap+3000-Date.now())); } }
async function rtMasters(){ if(!(onView('v-hall')||onView('v-bill'))||rtBusy()){ rtMastWait=true; return; } rtMastWait=false;
  try{ await loadMasters(); if(onView('v-hall')&&!rtBusy()) loadHall(); else if(onView('v-bill')&&cur&&!rtBusy()) openBill(cur.id); }catch(e){ console.warn('rtMasters',e); } }
async function rtBillCheck(){ if(!cur||!(onView('v-bill')||onView('v-pay'))) return;
  if(rtBusy()||Date.now()-rtTap<3000||document.activeElement?.tagName==='INPUT'&&onView('v-pay')){ clearTimeout(rtBillT); rtBillT=setTimeout(rtBillCheck,1500); return; }
  const id=cur.id, r=await sb.from('bills').select(BILL_SEL).eq('id',id).single(); if(r.error||!cur||cur.id!==id) return;
  if(fpOf(r.data)===billFp) return;
  const onPay=onView('v-pay'); await openBill(id); if(onPay&&cur.status==='open'){ renderPay(); show('v-pay'); } toast('ほかの端末で変更されました'); }

// ---------- hall ----------
const HALL_SEL='*, bill_casts(staff_id,role,is_kakari), bill_extensions(minutes,unit_price,qty,is_auto), bill_tags(id,kind,returned_at), bill_customers(customer_id)';

// v11.00：黒服を削除した時の警告（管理サイトでオーナーがパスワードを新しくするまで出し続ける）。パスワードが変わってこの端末のログインが使えなくなったら、ログイン画面に戻す（SQL 046）
async function checkPwAlert(){ if(!store) return; try{

  const el=$('pwAlert'); if(a.error||!a.data?.pw_alert){ el.style.display='none'; return; }
  el.textContent=`⚠ 黒服（${a.data.pw_alert_note||''}）が削除されました。オーナーは管理サイトでパスワードを新しくしてください`; el.style.display='block';
}catch(e){ console.warn('pwAlert',e); } }
let extOpen=false;
const snm=id=>staffAll.find(x=>x.id===id)?.display_name||staff.find(x=>x.id===id)?.display_name||'';
// 二重押し防止：処理中はボタンを止める
function guard(btn,fn){ return async(...a)=>{ if(btn.disabled) return; btn.disabled=true; try{ await fn(...a); } finally{ btn.disabled=false; } }; }

// 体験入店の日払い：（時給×稼働時間 または 日給 ＋ 手当）− 源泉 ＝ 日払い額。稼働時間は出勤15分切り上げ・退勤15分切り下げ・閉店時間で打ち止め（v11.16：1:00 → 店舗設定の閉店時間）
const closeCap=bd=>new Date(`${bd}T${closeHM}:00`).getTime()+(Number(closeHM.slice(0,2))<12?24*3600*1000:0);
function trialHours(inAt,outAt){ if(!inAt||!outAt) return null; const Q=900000; const a=Math.ceil(new Date(inAt).getTime()/Q)*Q; const bd=businessDate(new Date(inAt)); const cap=closeCap(bd); const b=Math.floor(Math.min(new Date(outAt).getTime(),cap)/Q)*Q; return Math.max(0,(b-a)/3600000); }
function trialCalc(s,ev,extra){ const rate=Number(settings?.trial_withholding_rate??10); const amt=Number(s.trial_pay_amount||0); const f=n=>Number(n).toLocaleString(); let base, head; if(s.trial_pay_type==='daily'){ if(!ev.in) return {ready:false,note:'出勤打刻がありません'}; base=amt; head=`日給 ${f(amt)}`; } else { if(!ev.in) return {ready:false,note:'出勤打刻がありません'}; const h=trialHours(ev.in,ev.out); if(h==null) return {ready:false,note:`時給 ${f(amt)}：退勤打刻後に計算`}; base=Math.floor(amt*h); head=`時給 ${f(amt)} × ${h}時間 ＝ ${f(base)}`; } const gross=base+(extra||0); const tax=Math.floor(gross*rate/100); const pay=gross-tax; return {ready:true,base,gross,tax,pay,note:`${head} ＋ 手当 ${f(extra||0)} ＝ ${f(gross)} − 源泉${rate}% ${f(tax)} ＝ ${f(pay)}円`}; }

async function monthPoints(only){ const bd=businessDate(), m1=bd.slice(0,7)+'-01'; const sp=Number(settings.set_point||0), ep=Number(settings.ext_point||0); const r=await sb.from('bills').select('id,guest_count,set_guest_count,bill_casts(staff_id,is_kakari),bill_extensions(qty),bill_items(is_void,bill_item_splits(staff_id,back_points))').eq('store_id',store.id).eq('status','closed').gte('business_date',m1).lte('business_date',bd); if(r.error) return null; const m={}; const add=(id,v)=>{ if(only&&!only.has(id)) return; m[id]=Math.round(((m[id]||0)+v)*10)/10; };
  (r.data||[]).forEach(b=>{ const ks=(b.bill_casts||[]).filter(c=>c.is_kakari).map(c=>c.staff_id); const base=sp*(b.set_guest_count??b.guest_count??0)+ep*(b.bill_extensions||[]).reduce((a,e)=>a+Number(e.qty||0),0); if(ks.length&&base) ks.forEach(id=>add(id,base/ks.length)); (b.bill_items||[]).filter(x=>!x.is_void).forEach(x=>(x.bill_item_splits||[]).forEach(z=>{ const v=Number(z.back_points||0); if(v) add(z.staff_id,v); })); });
  return m; }
async function monthKakari(only){ const bd=businessDate(), m1=bd.slice(0,7)+'-01'; const r=await sb.from('bills').select('id,bill_casts(staff_id,is_kakari),bill_items(cast_subtotal_price,qty,is_void)').eq('store_id',store.id).eq('status','closed').gte('business_date',m1).lte('business_date',bd); if(r.error) return null;

// v10.45：担当キャストの今月の係小計を黒服ごとに集計し、在籍中の黒服全員の合計に対する割合も出す（削除済みの黒服・担当なしのキャストは含めない）
async function clMgrSum(s){ const halls=new Set(staffAll.filter(x=>x.kind==='hall'&&x.is_active).map(x=>x.id)); const mgr=new Map(staffAll.filter(x=>x.manager_staff_id&&halls.has(x.manager_staff_id)&&x.id!==x.manager_staff_id).map(x=>[x.id,x.manager_staff_id])); const mineN=staffAll.filter(x=>x.manager_staff_id===s.id&&x.id!==s.id&&x.is_active).length; const sums={}; let all=0;
  if(mgr.size){ const m=await monthKakari(new Set(mgr.keys())); if(!m) return {sum:'—',pct:'—'}; Object.entries(m).forEach(([id,v])=>{ const h=mgr.get(id); if(h){ sums[h]=(sums[h]||0)+v; all+=v; } }); }
  const mine=sums[s.id]||0; return {sum:`${yen(mine)} <small class="muted">担当 ${mineN}人</small>`, pct: all>0&&halls.has(s.id) ? (Math.round(mine/all*1000)/10).toFixed(1)+'%' : '—'}; }

  const cur_=Object.fromEntries((item.bill_item_splits||[]).map(s=>[s.staff_id,s]));
  const steps=(max,unit,v)=>{ const a=[]; for(let x=0;x<=max;x+=unit) a.push(x); if(max%unit) a.push(max); if(v&&!a.includes(v)) a.push(v); return a.sort((p,q)=>p-q); };

  const rows=[...$('splitTable').querySelectorAll('input[type=checkbox]:checked')].map(c=>({bill_item_id:splitItem.id,staff_id:c.dataset.s,sales_amount:0,back_amount:g('back',c.dataset.s),back_points:g('pts',c.dataset.s)})).filter(r=>r.back_amount>0||r.back_points>0);

/* メモを行ごとに合わせる（3者マージ）。base＝書き始めた時のメモ、mine＝自分の入力、theirs＝ほかで変わった今のメモ。同じ所を両方が別々に直した時だけ conflicts に入る */
function memoMerge(base,mine,theirs){ const L=s=>s?String(s).replace(/\r/g,'').split('\n'):[]; const b=L(base), m=L(mine), t=L(theirs), J=a=>a.join('\n');
  if(J(m)===J(t)||J(t)===J(b)) return {lines:m,conflicts:[]}; if(J(m)===J(b)) return {lines:t,conflicts:[]};
  const hunks=(a,o)=>{ const n=a.length, k=o.length, d=Array.from({length:n+1},()=>new Int32Array(k+1)); for(let i=n-1;i>=0;i--) for(let j=k-1;j>=0;j--) d[i][j]=a[i]===o[j]?d[i+1][j+1]+1:Math.max(d[i+1][j],d[i][j+1]);
    const h=[]; let i=0,j=0,cur=null; const flush=()=>{ if(cur){ h.push(cur); cur=null; } };
    while(i<n||j<k){ if(i<n&&j<k&&a[i]===o[j]){ flush(); i++; j++; } else if(j<k&&(i>=n||d[i][j+1]>=d[i+1][j])){ cur=cur||{s:i,e:i,lines:[]}; cur.lines.push(o[j]); j++; } else { cur=cur||{s:i,e:i,lines:[]}; cur.e=i+1; i++; } }
    flush(); return h; };
  const all=[...hunks(b,m).map(x=>({...x,w:'m'})),...hunks(b,t).map(x=>({...x,w:'t'}))].sort((x,y)=>x.s-y.s||x.e-y.e);
  const hit=(x,y)=>(x.s===x.e&&y.s===y.e)?x.s===y.s:(x.s===x.e?(x.s>y.s&&x.s<y.e):y.s===y.e?(y.s>x.s&&y.s<x.e):Math.max(x.s,y.s)<Math.min(x.e,y.e));
  const groups=[]; for(const x of all){ const g=groups[groups.length-1]; if(g&&g.some(y=>y.w!==x.w&&hit(x,y))){ g.push(x); g.S=Math.min(g.S,x.s); g.E=Math.max(g.E,x.e); } else { const ng=[x]; ng.S=x.s; ng.E=x.e; groups.push(ng); } }
  const side=(g,w)=>{ const out=[]; let p=g.S; for(const x of g.filter(y=>y.w===w)){ out.push(...b.slice(p,x.s),...x.lines); p=x.e; } out.push(...b.slice(p,g.E)); return out; };
  const out=[], conflicts=[]; let p=0;
  for(const g of groups){ out.push(...b.slice(p,g.S)); const ws=new Set(g.map(x=>x.w));
    if(ws.size===1){ out.push(...side(g,g[0].w)); }
    else { const vm=side(g,'m'), vt=side(g,'t');
      if(J(vm)===J(vt)) out.push(...vm);
      else if(g.S===g.E) out.push(...vt,...vm); // 同じ所に両方が書き足した時は、両方残す（先に入っていた方が上）
      else { conflicts.push({at:out.length,mine:vm,theirs:vt}); } }
    p=Math.max(p,g.E); }
  out.push(...b.slice(p)); return {lines:out,conflicts}; }
/* conflicts の choice（'m'／'t'／'b'）で仕上げる */
function memoMergeDone(r,choices){ const out=[...r.lines]; for(let i=r.conflicts.length-1;i>=0;i--){ const c=r.conflicts[i], ch=choices[i]; out.splice(c.at,0,...(ch==='m'?c.mine:ch==='t'?c.theirs:[...c.theirs,...c.mine])); } return out.join('\n'); }
function pickClash(x){ return new Promise(res=>{ const m=document.createElement('div'); m.className='modal on'; m.style.zIndex=60; const bx=t=>`<div style="white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6;border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-top:4px">${esc(t.join('\n'))||'<span class="muted">（消した）</span>'}</div>`;
  m.innerHTML=`<div class="box" style="width:min(520px,94vw)"><div style="font-size:18px;font-weight:700">同じ所をほかの人も直していました</div><div class="muted" style="font-size:13px">どちらを残しますか？</div><div style="margin-top:10px">あなた${bx(x.mine)}</div><div style="margin-top:8px">ほかの人${bx(x.theirs)}</div><div class="bar" style="justify-content:flex-end;margin-top:12px"><button class="ghost" data-v="x">やめる</button><button class="ghost" data-v="b">両方残す</button><button class="ghost" data-v="t">ほかの人</button><button class="primary" data-v="m">あなた</button></div></div>`;

function clMailUrl(who){ const to=String(settings?.receipt_mail_to||'').trim(); const subject=`【${store?.name||''}】現金払い（名前→${who}）`; const body='📎→書類をスキャン→フィルタ→白黒　で送信'; return `mailto:${encodeURIComponent(to).replace(/%40/g,'@')}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`; }
// v10.43：前回の精算の翌日〜前日のうち、未精算の日の現金の動き（現金売上＋入金−出金−日払い）の合計
async function clGap(after,d){ const [mv,adv,pay,cl]=await Promise.all([ sb.from('cash_movements').select('business_date,kind,amount').eq('store_id',store.id).gt('business_date',after).lt('business_date',d),
    sb.from('daily_advances').select('business_date,amount').eq('store_id',store.id).gt('business_date',after).lt('business_date',d),
    sb.from('payments').select('amount,paid_at,bills!inner(status,store_id)').eq('method','cash').gte('paid_at',new Date(`${after}T08:00:00`).toISOString()).lt('paid_at',new Date(`${d}T08:00:00`).toISOString()),
    sb.from('register_closings').select('business_date').eq('store_id',store.id).gt('business_date',after).lt('business_date',d) ]);
  const done=new Set((cl.data||[]).map(r=>r.business_date)); const net={}; const add=(k,v)=>{ if(!done.has(k)) net[k]=(net[k]||0)+v; };
  (mv.data||[]).forEach(r=>add(r.business_date,r.kind==='in'?Number(r.amount):-Number(r.amount))); (adv.data||[]).filter(r=>r.amount>0).forEach(r=>add(r.business_date,-Number(r.amount)));
  (pay.data||[]).filter(p=>p.bills&&p.bills.store_id===store.id&&p.bills.status!=='void'&&p.amount).forEach(p=>{ const b=businessDate(new Date(p.paid_at)); if(b>after&&b<d) add(b,Number(p.amount)); });
  const days=Object.keys(net).filter(k=>net[k]).sort(); return {net:days.reduce((s,k)=>s+net[k],0),days}; }
function clRecalc(){ const c=clCtx; if(!c) return {}; const s=c.saved; const cnt=s?(s.counts||{}):clCounts; let counted=0; DENOMS.forEach(([v])=>{ const a=v*clNum(cnt[v]); counted+=a; const el=document.querySelector(`[data-denamt="${v}"]`); if(el) el.textContent=yen(a); });
  const opening=s?s.opening_float:(c.hasPrev?c.prevFloat:clOpening); const sales=s?s.cash_sales:c.cashSales, cin=s?s.cash_in:c.inSum, cout=s?s.cash_out:(c.outSum+c.advSum); const expected=opening+sales+cin-cout; if(s) counted=s.counted; const diff=counted-expected; const deposit=s?s.deposit:clDeposit; const next=counted-deposit;

    `<h3 style="margin:16px 0 4px">VIP料金（卓ごと。0＝通常卓）</h3><table style="width:100%;margin-top:6px"><tr><th style="text-align:left">卓</th><th>VIP代</th><th>VIP${settings.ext_minutes}分延長</th></tr>${tables.map(t=>`<tr><td>${esc(t.name)}</td><td><input value="${t.vip_set_fee||0}" disabled></td><td><input value="${t.vip_ext_fee||0}" disabled></td></tr>`).join('')}</table>`; }
$('setAdd').onclick=async()=>{ const def=SET.find(s=>s.key===setCur); const rows=setRows(def); const row=def.newRow(); if(!def.nosort) row.sort_order=(Math.max(0,...rows.map(r=>r.sort_order||0))+1); if(def.key==='products'&&setCatFilter) row.category_id=setCatFilter;
  const { data, error } = await sb.from(def.table).insert(row).select().single(); if(error){toast(error.message);return;} await logOp('設定の追加',{kind:def.name,name:def.label(data)},null,true); setSel=data; renderSettings(setCur,true); };
$('setEdit').onclick=()=>{ setEditMode=!setEditMode; renderSettings(setCur,true); };
$('setFilter').oninput=e=>{ const q=e.target.value.trim(); $('setList').querySelectorAll('.row').forEach(r=>{ r.style.display=!q||r.textContent.includes(q)?'':'none'; }); };
// 長押しドラッグ並び替え
function enableDrag(def){ dragSort($('setList'),'.row',async ids=>{ const rs=await Promise.all(ids.map((id,i)=>sb.from(def.table).update({sort_order:(i+1)*10}).eq('id',id))); const er=rs.find(r=>r.error); toast(er?('並び順を保存できませんでした：'+er.error.message):'並び順を保存しました'); renderSettings(def.key,true); }); }
// 行を動かすと指の追跡が切れるため、動き・離すは画面全体で受ける
function dragSort(list,sel,onDone){
  list.querySelectorAll(sel).forEach(row=>{ const h=row.querySelector('.hd'); if(!h)return;
    h.onpointerdown=e=>{ e.preventDefault(); let dragging=null, moved=false;
      const timer=setTimeout(()=>{ dragging=row; row.classList.add('drag'); },150);
      const move=ev=>{ if(!dragging)return; ev.preventDefault(); const el=document.elementFromPoint(ev.clientX,ev.clientY)?.closest(sel); if(!el||el===dragging||el.parentElement!==list)return; const r=el.getBoundingClientRect(); const before=ev.clientY<r.top+r.height/2; const ref=before?el:el.nextSibling; if(ref===dragging||ref===dragging.nextSibling)return; list.insertBefore(dragging,ref); moved=true; };
      const end=async()=>{ clearTimeout(timer); window.removeEventListener('pointermove',move); window.removeEventListener('pointerup',end); window.removeEventListener('pointercancel',end); if(!dragging)return; dragging.classList.remove('drag'); dragging=null; if(moved) await onDone([...list.querySelectorAll(sel)].map(r=>r.dataset.id)); };
      window.addEventListener('pointermove',move,{passive:false}); window.addEventListener('pointerup',end); window.addEventListener('pointercancel',end); }; }); }

kReg(SET,CUF);
start();
