<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>OLIVE 会計</title><!-- v11.97 -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet"><style>button,input,select,textarea{font-family:inherit}</style><!-- 書体：Zen Kaku Gothic New（オーナー 2026-10-18） -->
<link rel="stylesheet" href="pos.css"><!-- 2026-10-19：見た目は pos.css、プログラムは js/ に画面ごとに分けた（中身はそのまま） -->
</head>
<body>
<div class="login" id="login"><form id="loginForm">
  <h1 style="margin:0;font-size:20px">店舗端末ログイン</h1>
  <input id="email" type="email" placeholder="端末メールアドレス" autocomplete="username" required><input id="pw" type="password" placeholder="パスワード" autocomplete="current-password" required>
  <button class="primary" type="submit">ログイン</button><div id="loginErr" style="color:var(--warn);font-size:14px;min-height:18px"></div>
</form></div>

<header>
  <div class="store" id="storeName">—</div>
  <div class="dt"><small id="hdDate">—</small><span id="clock">--:--</span></div>
  <button id="tdBtn" style="flex:none;align-self:center;margin-left:12px;padding:4px 10px;min-height:0;height:auto;font-size:12px;line-height:1.2;border:1px solid rgba(255,255,255,.35);border-radius:999px;background:transparent;color:rgba(255,255,255,.75)">本日</button>
  <div id="tdSum" style="display:none;align-self:center;margin-left:12px;color:var(--gold-soft);font-size:15px;line-height:1.4;white-space:nowrap;cursor:pointer"></div>
  <nav class="nav">
    <button id="navHall">ホール<br>状況<span class="bd" id="bdHall">0</span></button>
    <button id="navOrder">注文</button>
    <button id="navCasts">在籍<br>キャスト<span class="bd" id="bdCasts">0</span></button>
    <button id="navCust">顧客</button>
    <button id="navSettings">設定</button>
  </nav>
</header>
<div id="pwAlert" class="alert" style="display:none;margin:0;border-radius:0"></div>

<main>
<section class="view on" id="v-hall"><div id="alerts"></div><div class="tables" id="tables"></div></section>

<section class="view" id="v-new"><div class="card">
  <div style="background:var(--ink);color:#fff;text-align:center;font-size:22px;padding:12px;border-radius:10px">卓：<span id="nTable"></span></div>
  <div style="display:flex;align-items:center;justify-content:center;gap:60px;min-height:46vh;flex-wrap:wrap">
    <button class="ghost" id="nCust" style="font-size:26px;padding:24px 40px">新規</button>
    <span style="display:flex;align-items:center;gap:18px"><span id="nCount" style="font-size:72px;font-weight:700;min-width:110px;text-align:right">0</span>
      <button id="nPlus" style="width:110px;height:110px;border-radius:50%;font-size:56px;background:var(--ok);color:#fff;padding:0">＋</button>
      <button id="nMinus" style="width:110px;height:110px;border-radius:50%;font-size:56px;background:var(--warn);color:#fff;padding:0">−</button></span>
  </div>
  <div class="muted" style="text-align:center">最大50名</div>
  <div class="bar" style="justify-content:space-between"><button class="ghost" id="nBack" style="padding:16px 60px;border-radius:999px;background:var(--line);color:#fff;border:none">ホール状況</button><button class="primary" id="nNext" style="padding:16px 80px;border-radius:999px;background:var(--pri)">次　へ</button></div>
</div></section>

<section class="view" id="v-bill"><div class="card">
  <div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap">
    <b id="bTable" style="font-size:20px"></b><span id="bTime" class="muted"></span>
    <span>客数 <span class="num"><button id="gMinus">−</button><span id="bGuests">1</span><button id="gPlus">＋</button></span></span><button class="ghost sm" id="gLeave">途中退店</button><button class="ghost sm" id="bMove">席移動</button>
    <span id="bFlags" style="margin-left:auto;display:flex;gap:6px"></span>
  </div>
  <div class="cols" style="margin-top:12px">
    <div><div class="list" id="bCust"></div><button class="ghost sm" id="custAddBtn" style="margin-top:6px">＋ お客様</button>
      <div class="list" id="bCasts" style="margin-top:10px"></div><button class="ghost sm" id="castAddBtn" style="margin-top:6px">＋ 係／同伴</button>
      <div style="display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px"><span id="bGood" style="display:contents"></span><select id="goodAdd" style="display:none;width:auto;min-width:0;height:auto;min-height:0;margin:0;font-size:13px;line-height:1.2;padding:5px 10px;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--muted);-webkit-appearance:none;appearance:none"></select></div>
      <div class="list" id="bTags" style="margin-top:14px"></div><button class="ghost sm" id="tagBtn" style="margin-top:6px">＋ お預かりタグ</button></div>
    <div><h2>1セット目・延長</h2><div class="list" id="bSet"></div><div class="bar" style="margin-top:6px"><button class="ghost sm" id="extAdd">30分延長</button><button class="ghost sm" id="svcBtn">サービス料</button></div></div>
    <div id="bOrders" style="display:contents"><div><h2>ボトル</h2><div class="list" id="bItems"></div></div><div><h2>ドリンク・フード他</h2><div class="list" id="bItems2"></div></div></div>
  </div>
  <div style="display:flex;justify-content:space-between;align-items:end;margin-top:12px;flex-wrap:wrap;gap:12px">
    <div class="totals" id="bTotals"></div>
    <div class="bar"><button class="ghost" id="bBack">ホールへ</button><button class="ghost sm" id="bVoid" style="color:var(--muted)">伝票削除</button>
      <button class="ghost" id="prEst">概算印刷</button><button class="ghost" id="prBill">会計印刷</button><button class="ghost" id="prDetail">明細印刷</button>
      <button class="primary" id="bOrder">注文</button><button class="gold" id="bPay">会計</button></div>
  </div>
</div></section>

<section class="view" id="v-order"><div class="card">
  <div class="ord4">
    <div class="col"><h3>カテゴリー</h3><div class="body" id="oCats"></div></div>
    <div class="col"><h3>メニュー</h3><div class="body" id="oProds"></div></div>
    <div class="col"><h3>振り分け（バックを付ける人）</h3><div class="body" id="oCasts"></div></div>
    <div class="col"><h3>注文</h3><div class="body" id="oCart"></div><div style="padding:8px"><button class="primary" id="oConfirm" style="width:100%;min-height:52px;font-size:17px">確定</button></div></div>
  </div>
  <div class="bar"><button class="ghost" id="orderBack">伝票へ戻る</button></div>
</div></section>

<section class="view" id="v-pay"><div class="card">
  <h2>会計：<span id="pTable"></span></h2>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
    <div class="totals" id="pTotals" style="align-content:start;align-self:start"></div>
    <div><div class="chips" id="payMethods"></div>
      <div id="payBillTo" class="hidden" style="margin-top:10px"></div><!-- v11.97・SQL 171：請求書の時は請求先を選ぶ -->
      <input id="payAmount" type="number" inputmode="numeric" placeholder="金額" style="width:100%;font-size:24px;text-align:right;margin-top:10px">
      <div id="payChange" class="hidden" style="display:grid;grid-template-columns:auto 1fr;gap:8px 12px;align-items:center;margin-top:10px;font-size:18px"><span>お預かり</span><input id="payRecv" type="number" inputmode="numeric" placeholder="0" style="font-size:22px;text-align:right"><span>お釣り</span><b id="payChg" style="text-align:right;font-size:26px">―</b></div><!-- v11.91：現金の時だけ、お預かりからお釣りを出す（記録はしない。ゲネプロ #19・見本 キ） -->
      <div class="bar"><button id="payAdjDiscount">値引</button><button id="payAdjSurcharge">値増</button><button class="ok" id="payAdd" style="margin-left:auto">入金</button></div>
      <div class="list" id="payList" style="margin-top:10px"></div></div>
  </div>
  <div class="bar"><button class="ghost" id="payBack">伝票へ戻る</button><button class="ghost" id="prReceipt">領収書印刷</button><button class="primary" id="payClose">会計を締める</button></div>
</div></section>

<section class="view" id="v-cust"><div class="card settings" style="grid-template-columns:280px minmax(0,1.25fr) minmax(0,1fr)">
  <div style="min-width:0"><div style="display:flex;gap:6px;margin-bottom:8px"><input id="cuSearch" placeholder="名前・会社名で検索" style="flex:1 1 0;min-width:0;width:0"><button class="primary sm" id="cuNew" style="white-space:nowrap;flex:none">＋新規</button></div><div id="cuModes" style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px"><select id="cuMonths" aria-label="期間"></select><button class="chip" data-cm="req" id="cuReqChip" style="display:none"></button></div><div class="muted" id="cuCount" style="font-size:13px;margin-bottom:6px"></div><div class="lst" id="cuList" style="max-height:70vh;overflow:auto"></div></div>
  <div id="cuForm" class="form"></div>
  <div id="cuSide"></div>
</div></section>

<section class="view" id="v-casts"><div class="card">
  <div class="bar" style="margin:0 0 12px">
    <button class="pillbtn brown" id="cTabToday">在籍リスト<span id="cTodayN" style="display:none"></span></button>
    <button class="pillbtn brown" id="cTabAll">全員</button>
    <button class="pillbtn brown" id="cSort">並べ替え</button>
    <button class="pillbtn brown" id="cNew">新規登録</button>
    <input id="cSearch" placeholder="キャスト検索" style="flex:1;font-size:18px">
    
  </div>
  <div style="display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px">
    <div class="rlist" id="cList"></div>
    <div><h2>詳細</h2><div class="form" id="cForm"><div class="muted">一覧の「編集」を押してください</div></div></div>
  </div>
</div></section>

<section class="view" id="v-settings"><div class="card settings">
  <div class="menu" id="setMenu"></div>
  <div><div class="bar" style="margin:0 0 10px"><button class="ok sm" id="setAdd">追加</button><input id="setFilter" placeholder="検索" style="flex:1"><button class="sm" id="setEdit">編集</button></div><div class="lst" id="setList"></div></div>
  <div><h2>詳細</h2><div class="form" id="setForm"><div class="muted">左の一覧から選ぶか「追加」</div></div></div>
</div></section>
</main>

<div class="modal" id="custModal"><div class="box" style="width:520px">
  <h2 style="color:var(--ink)">お客様を追加</h2>
  <div style="display:flex;gap:8px"><input id="custSearch" placeholder="名前で検索" style="flex:1"><button id="custNew">新規登録</button></div>
  <div class="chips" id="custList" style="margin-top:10px"></div>
  <div class="bar"><button class="ghost" id="custCancel">伝票へ戻る</button></div>
</div></div>

<div class="modal" id="castModal"><div class="box" style="width:640px">
  <h2 style="color:var(--ink)" id="castAddTtl">係／同伴を追加</h2>
  <div class="chips" id="castRole" style="margin-bottom:10px"><button class="chip on" data-cr="kakari" style="font-size:18px;padding:10px 22px">係</button><button class="chip" data-cr="douhan" style="font-size:18px;padding:10px 22px">同伴</button></div>
  <div class="muted">出勤中</div><div class="chips" id="castList"></div>
  <button class="ghost sm" id="castMoreBtn" style="margin-top:10px">出勤していないキャストから選ぶ ▾</button>
  <div class="chips hidden" id="castListAll" style="margin-top:8px"></div>
  <div class="bar"><button class="ghost" id="castCancel">伝票へ戻る</button></div>
</div></div>

<div class="modal" id="splitModal"><div class="box">
  <h2 style="color:var(--ink)">振り分け：<span id="splitName"></span></h2><div class="muted" id="splitBase"></div>
  <table class="t" id="splitTable"></table>
  <div class="bar"><button class="ghost" id="splitCancel">伝票へ戻る</button><button id="splitEven" style="margin-left:auto">均等</button><button class="primary" id="splitOk">確定</button></div>
</div></div>

<div class="modal" id="uiDlg" style="z-index:60"><div class="box" style="width:460px">
  <div id="uiDlgMsg" style="white-space:pre-wrap;font-size:16px;margin-bottom:12px"></div>
  <input id="uiDlgIn" style="width:100%;font-size:18px">
  <div class="bar" style="justify-content:flex-end"><button class="ghost" id="uiDlgNo">キャンセル</button><button class="primary" id="uiDlgOk">OK</button></div>
</div></div>

<div class="modal" id="svcModal"><div class="box" style="width:460px">
  <h2 style="color:var(--ink)">サービス料</h2>
  <div class="muted" id="svcNow" style="margin-bottom:10px"></div>
  <div class="form">
    <label>率の変更（%）<div style="display:flex;gap:8px"><input id="svcRate" type="number" step="1" style="flex:1;font-size:22px;text-align:right"><button class="primary" id="svcRateOk">適用</button></div></label>
    <button id="svcNormal">既定の率に戻す</button>
  </div>
  <div class="bar"><button class="ghost" id="svcCancel">伝票へ戻る</button></div>
</div></div>

<div class="modal" id="tagModal"><div class="box" style="width:520px">
  <h2 style="color:var(--ink)">お預かりタグ</h2>
  <div class="list" id="tagList" style="margin-bottom:12px"></div>
  <div class="chips" id="tagKinds"></div>
  <div style="display:flex;gap:8px;margin-top:10px"><input id="tagNo" placeholder="タグ番号" style="width:120px"><input id="tagMemo" placeholder="メモ（色・特徴など）" style="flex:1"><button class="primary" id="tagAdd">追加</button></div>
  <div class="bar"><button class="ghost" id="tagCancel">伝票へ戻る</button></div>
</div></div>

<div class="toast" id="toast"></div>
<div id="printArea"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0"></script>
<script src="js/01_core.js"></script>
<script src="js/02_hall.js"></script>
<script src="js/03_log.js"></script>
<script src="js/04_casts.js"></script>
<script src="js/05_bill.js"></script>
<script src="js/06_tags.js"></script>
<script src="js/07_print.js"></script>
<script src="js/08_cust_modal.js"></script>
<script src="js/09_cast_modal.js"></script>
<script src="js/10_order.js"></script>
<script src="js/11_split.js"></script>
<script src="js/12_pay.js"></script>
<script src="js/13_settings.js"></script>
<script src="js/14_bottles.js"></script>
<script src="js/15_customers.js"></script>
<script src="js/16_closing.js"></script>
<script src="js/17_chorei.js"></script>
</body>
</html>
